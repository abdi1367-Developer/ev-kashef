<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>کاشف ۴۹۵ | پایش کنترل‌های امنیتی</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{--white:#fff;--line:#e4e4e7;--line2:#d4d4d8;--txt:#09090b;--txt2:#3f3f46;--muted:#71717a;--dim:#a1a1aa;--faint:#f4f4f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;height:100dvh;overflow:hidden}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--white);color:var(--txt);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2)}
a{color:var(--txt);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
.hidden{display:none!important}

/* LOGIN */
.login-wrap{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;z-index:200;padding:16px;background:var(--white)}
.bg-anim{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(var(--faint) 1px,transparent 1px),linear-gradient(90deg,var(--faint) 1px,transparent 1px);background-size:48px 48px;opacity:.8}
.rotor{position:absolute;border:1px solid var(--faint);top:50%;left:50%;pointer-events:none}
.rotor-a{width:56vmin;height:56vmin;animation:rot 180s linear infinite}
.rotor-b{width:34vmin;height:34vmin;border-style:dashed;border-color:var(--line);animation:rot 240s linear infinite reverse}
.rotor-c{width:80vmin;height:80vmin;animation:rot 320s linear infinite}
@keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}
.login-card{position:relative;z-index:3;width:min(380px,94vw);padding:36px 28px 28px;background:var(--white);border:1px solid var(--txt);animation:pop .5s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.kashaf{font-size:11px;font-weight:600;letter-spacing:.32em;text-align:center;text-transform:uppercase;margin-bottom:14px}
.kashaf-rule{height:1px;background:var(--txt);margin-bottom:22px}
.login-card h1{font-size:15px;font-weight:600;margin:0 0 4px;text-align:center}
.login-card .sub{margin:0 0 26px;text-align:center;color:var(--muted);font-size:11.5px}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px;letter-spacing:.15em;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--txt);background:var(--white);color:var(--txt);outline:none;font-size:13px;border-radius:0;font-variant-numeric:tabular-nums}
.field input:focus,.field select:focus,.field textarea:focus{background:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:1px solid var(--txt);background:var(--white);color:var(--txt);cursor:pointer;font-weight:500;font-size:12.5px;transition:.12s;border-radius:0}
.btn:hover{background:var(--faint)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--txt);color:var(--white);border-color:var(--txt)}
.btn-primary:hover{background:var(--txt2);border-color:var(--txt2)}
.btn-full{width:100%;padding:12px}
.btn-sm{padding:6px 10px;font-size:11.5px}
.err{color:var(--txt);font-size:11.5px;text-align:center;margin-top:10px;min-height:14px;font-weight:500}
.diag{margin:0 0 16px;padding:9px 11px;border:1px solid var(--line);background:var(--faint);font-size:10.5px;line-height:1.7;color:var(--muted)}
.diag.ok{background:var(--white);border-color:var(--txt)}
.diag.err{background:var(--white);border-color:var(--txt);border-style:dashed}
.diag.warn{background:var(--white);border-color:var(--line2)}
.diag b{color:var(--txt);font-weight:600}
.diag code{background:var(--white);padding:1px 4px;font-size:10px;border:1px solid var(--line)}
.hint{text-align:center;color:var(--dim);font-size:10.5px;margin-top:16px;letter-spacing:.06em;padding-top:16px;border-top:1px solid var(--line)}
.hint b{color:var(--txt);font-weight:600}
.mode-toggle{display:flex;margin-top:12px;border:1px solid var(--txt)}
.mode-toggle button{flex:1;padding:8px 6px;font-size:10.5px;background:var(--white);color:var(--txt);border:none;cursor:pointer;letter-spacing:.05em;font-weight:500}
.mode-toggle button:first-child{border-left:1px solid var(--txt)}
.mode-toggle button:hover{background:var(--faint)}

/* APP - Fixed sidebar, main column scrolls internally */
#app{height:100vh;height:100dvh;display:block}
.sidebar{position:fixed;top:0;right:0;width:220px;height:100vh;height:100dvh;z-index:50;background:var(--white);border-left:1px solid var(--txt);display:flex;flex-direction:column;padding:22px 14px;overflow:hidden}
.brand{padding:0 6px 18px;border-bottom:1px solid var(--txt);margin-bottom:18px;flex-shrink:0}
.brand b{display:block;font-size:13px;font-weight:600;letter-spacing:.16em;margin-bottom:4px}
.brand span{display:block;font-size:10px;color:var(--muted);letter-spacing:.06em}
.nav{display:flex;flex-direction:column;gap:0;flex:1;min-height:0;overflow:hidden}
.nav button{display:flex;align-items:center;width:100%;padding:9px 10px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-weight:500;font-size:12px;text-align:right;transition:.12s;border-right:2px solid transparent;padding-right:8px;flex-shrink:0}
.nav button:hover{color:var(--txt);background:var(--faint)}
.nav button.active{color:var(--txt);font-weight:600;border-right-color:var(--txt);background:var(--faint)}
.side-foot{border-top:1px solid var(--txt);padding-top:14px;margin-top:14px;flex-shrink:0}
.user-chip{display:flex;align-items:center;gap:9px;padding:8px 4px;margin-bottom:10px}
.user-chip .av{width:26px;height:26px;border:1px solid var(--txt);display:grid;place-items:center;font-weight:600;font-size:10px;flex:0 0 auto}
.user-chip b{display:block;font-size:11.5px;font-weight:600;line-height:1.25}
.user-chip span{display:block;font-size:9.5px;color:var(--muted);margin-top:2px;letter-spacing:.06em}
.mode-line{display:flex;align-items:center;gap:6px;padding:6px 4px;margin-bottom:8px;font-size:9.5px;color:var(--muted);letter-spacing:.14em;font-weight:500}
.mode-line::before{content:'';width:6px;height:6px;background:var(--txt);flex:0 0 auto}
.mode-line.local::before{background:var(--dim)}
.side-foot .btn{padding:7px;font-size:11px;letter-spacing:.08em}

.main{margin-right:220px;height:100vh;height:100dvh;display:flex;flex-direction:column;min-height:0}
.topbar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:16px 24px;background:var(--white);border-bottom:1px solid var(--txt);z-index:30}
.topbar h2{margin:0;font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.06em}
.icon-btn{width:34px;height:34px;border:1px solid var(--txt);background:var(--white);color:var(--txt);cursor:pointer;display:none;place-items:center;font-size:15px;flex:0 0 auto}
.icon-btn:hover{background:var(--faint)}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.top-actions select{padding:8px 11px;border:1px solid var(--txt);background:var(--white);color:var(--txt);outline:none;font-size:11.5px;max-width:200px;font-variant-numeric:tabular-nums}
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:24px;width:100%;min-width:0}
.overlay{position:fixed;inset:0;background:rgba(9,9,11,.32);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}

/* COMPONENTS */
.grid{display:grid;gap:16px;width:100%}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--white);border:1px solid var(--txt);padding:20px;min-width:0}
.card h3{margin:0 0 16px;font-size:10.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;letter-spacing:.16em;padding-bottom:12px;border-bottom:1px solid var(--line)}
.card h3 .dot{width:5px;height:5px;background:var(--txt);flex:0 0 auto}
.kpi .v{font-size:32px;font-weight:600;line-height:1;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:10px;margin-top:8px;letter-spacing:.14em;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:10px;white-space:nowrap;font-weight:500;letter-spacing:.06em;border:1px solid transparent}
.st-ok{background:var(--txt);color:var(--white);border-color:var(--txt)}
.st-warn{background:var(--white);color:var(--txt);border-color:var(--txt)}
.st-bad{background:var(--white);color:var(--muted);border-color:var(--line2);border-style:dashed}
.st-gray{background:transparent;color:var(--dim);border-color:var(--line)}
.badge-soft{background:var(--faint);color:var(--muted);border-color:var(--line)}
.bar-row{display:grid;grid-template-columns:1fr 42px;gap:12px;align-items:center;margin:10px 0}
.bar-row .nm{font-size:11.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .pc{font-size:11px;font-weight:600;text-align:left}
.bar{height:4px;background:var(--faint);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--txt);transition:width .6s cubic-bezier(.2,.9,.3,1)}
.donut-wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center}
.donut{width:150px;height:150px;border-radius:50%;position:relative;display:grid;place-items:center;flex:0 0 auto}
.donut::before{content:'';position:absolute;inset:22px;border-radius:50%;background:var(--white)}
.donut .mid{position:relative;z-index:2;text-align:center}
.donut .mid b{display:block;font-size:26px;font-weight:600;line-height:1;letter-spacing:-.03em}
.donut .mid span{font-size:9.5px;color:var(--muted);margin-top:4px;letter-spacing:.14em;display:block;font-weight:500}
.legend{display:flex;flex-direction:column;gap:10px;min-width:160px}
.legend div{display:flex;align-items:center;gap:10px;font-size:11px}
.legend i{width:8px;height:8px;flex:0 0 auto;border:1px solid var(--txt)}
.legend b{margin-right:auto;font-weight:600}
.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.toolbar input,.toolbar select{padding:9px 11px;border:1px solid var(--txt);background:var(--white);color:var(--txt);outline:none;width:100%;font-size:11.5px;font-variant-numeric:tabular-nums}
.toolbar input:focus,.toolbar select:focus{background:var(--faint)}
.toolbar input::placeholder{color:var(--dim)}
.list{display:grid;gap:10px}
.ctrl{background:var(--white);border:1px solid var(--line2);padding:14px 16px;cursor:pointer;transition:border-color .12s;min-width:0;position:relative}
.ctrl:hover{border-color:var(--txt)}
.cc-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;padding-left:30px}
.cc-no{font-size:10px;color:var(--muted);font-weight:500;margin-right:auto;letter-spacing:.08em}
.cc-title{font-size:12.5px;line-height:1.85;font-weight:500;margin-bottom:8px}
.cc-ev{font-size:11px;line-height:1.85;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-foot{margin-top:12px;display:flex;align-items:center;gap:12px}
.cc-foot .bar{flex:1;margin:0}
.cc-foot b{font-size:10.5px;min-width:38px;text-align:left;font-weight:600}
.del-btn{position:absolute;top:12px;left:12px;width:22px;height:22px;border:1px solid var(--line2);background:var(--white);cursor:pointer;font-size:12px;line-height:1;color:var(--muted);display:grid;place-items:center}
.del-btn:hover{background:var(--faint);border-color:var(--txt);color:var(--txt)}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;flex-wrap:wrap}
.pager .info{color:var(--muted);font-size:10.5px;padding:0 8px;letter-spacing:.06em}

.as-item{background:var(--white);border:1px solid var(--line2);padding:16px;margin-bottom:10px}
.as-item .t{font-size:12.5px;font-weight:500;line-height:1.9;margin-bottom:12px}
.as-item .t .n{color:var(--muted);font-weight:600;margin-left:6px;font-size:11px;letter-spacing:.06em}
.as-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:10px}
.as-grid label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px;font-weight:500;letter-spacing:.12em}
.as-grid select,.as-grid input{width:100%;padding:8px 10px;border:1px solid var(--txt);background:var(--white);color:var(--txt);outline:none;font-size:11.5px;font-variant-numeric:tabular-nums}
.as-grid select:focus,.as-grid input:focus{background:var(--faint)}
.prog-row{display:grid;grid-template-columns:1fr 80px;gap:10px;align-items:center}
input[type=range]{width:100%;accent-color:var(--txt);margin-top:8px}
textarea{width:100%;padding:10px 12px;border:1px solid var(--txt);background:var(--white);color:var(--txt);outline:none;resize:vertical;min-height:66px;line-height:1.8;font-size:11.5px}
textarea:focus{background:var(--faint)}
input[type=file]{width:100%;padding:7px;border:1px dashed var(--line2);background:var(--white);color:var(--muted);font-size:10.5px;cursor:pointer}
.as-foot{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.saved{color:var(--txt);font-size:10.5px;font-weight:600;letter-spacing:.12em}
.tbl-wrap{overflow-x:auto;width:100%}
table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:520px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:9.5px;background:var(--faint);white-space:nowrap;letter-spacing:.14em;border-bottom:1px solid var(--txt)}
tbody tr:hover{background:var(--faint)}
tbody td{font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:16px;background:rgba(9,9,11,.4);animation:fade .18s;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{width:min(760px,100%);max-height:88dvh;overflow:auto;border:1px solid var(--txt);background:var(--white);padding:24px;animation:pop .2s ease;margin:auto}
.modal-box h3{margin:0 0 16px;font-size:13px;font-weight:600;line-height:1.9;padding-bottom:12px;border-bottom:1px solid var(--line)}
.kv{margin-bottom:14px}
.kv .k{font-size:9.5px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.14em}
.kv .v{font-size:12px;line-height:1.95;background:var(--faint);padding:11px 13px;border:1px solid var(--line)}
.close-x{position:sticky;top:0;float:left;background:var(--white);color:var(--txt);border:1px solid var(--txt);width:28px;height:28px;cursor:pointer;font-size:14px;line-height:1}
.close-x:hover{background:var(--faint)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(100px);z-index:400;padding:10px 20px;background:var(--txt);color:var(--white);font-size:11px;font-weight:500;letter-spacing:.08em;transition:transform .3s cubic-bezier(.2,.9,.3,1.15)}
.toast.show{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:48px 16px;color:var(--muted);font-size:11.5px;line-height:1.9;letter-spacing:.04em}
.spin{width:22px;height:22px;border:1.5px solid var(--line);border-top-color:var(--txt);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* Date input */
.date-field{position:relative}
.date-input{padding-left:36px !important;cursor:pointer;caret-color:transparent}
.date-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none;color:var(--muted)}

/* Jalali Date Picker */
.date-picker{position:fixed;inset:0;z-index:600;display:grid;place-items:center;padding:16px;background:rgba(9,9,11,.4);animation:fade .15s}
.date-picker-box{width:min(340px,100%);background:var(--white);border:1px solid var(--txt);padding:20px;animation:pop .2s ease;max-height:92dvh;overflow-y:auto}
.dp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);gap:8px}
.dp-title{font-size:12.5px;font-weight:600;letter-spacing:.02em;text-align:center;flex:1;white-space:nowrap}
.dp-nav{display:flex;gap:3px;flex-shrink:0}
.dp-nav button{width:26px;height:26px;border:1px solid var(--line2);background:var(--white);cursor:pointer;font-size:12px;display:grid;place-items:center;color:var(--txt);font-family:inherit}
.dp-nav button:hover{background:var(--faint);border-color:var(--txt)}
.dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px}
.dp-weekdays span{text-align:center;font-size:9.5px;color:var(--muted);font-weight:600;padding:4px 0;letter-spacing:.06em}
.dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-day{aspect-ratio:1;border:1px solid transparent;background:var(--white);cursor:pointer;font-size:11.5px;display:grid;place-items:center;font-variant-numeric:tabular-nums;color:var(--txt);font-family:inherit;padding:0}
.dp-day:hover{background:var(--faint);border-color:var(--line2)}
.dp-day.today{font-weight:700;border-color:var(--line2)}
.dp-day.selected{background:var(--txt);color:var(--white);border-color:var(--txt);font-weight:600}
.dp-day.selected:hover{background:var(--txt2)}
.dp-day.empty{cursor:default;background:transparent;border-color:transparent}
.dp-day.empty:hover{background:transparent;border-color:transparent}
.dp-foot{display:flex;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dp-foot button{flex:1;padding:8px;border:1px solid var(--txt);background:var(--white);cursor:pointer;font-size:11px;font-weight:500;font-family:inherit;color:var(--txt)}
.dp-foot button:hover{background:var(--faint)}
.dp-foot button.primary{background:var(--txt);color:var(--white)}
.dp-foot button.primary:hover{background:var(--txt2)}

/* RESPONSIVE */
@media(max-width:900px){
  .sidebar{transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.9,.3,1);width:240px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-right:0}
  .icon-btn{display:grid}
  .content{padding:16px}
  .topbar{padding:12px 16px}
  .kpi .v{font-size:26px}
  .card{padding:16px}
}
@media(max-width:560px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cols2{grid-template-columns:1fr}
  .topbar h2{font-size:11.5px}
  .donut{width:130px;height:130px}
  .donut::before{inset:18px}
  .donut .mid b{font-size:22px}
  .modal-box{padding:16px}
  .cc-ev{-webkit-line-clamp:3}
  .content{padding:12px}
}
@media(max-height:520px){
  .sidebar{overflow-y:auto}
  .nav{overflow:visible}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
  <div class="bg-anim">
    <div class="bg-grid"></div>
    <div class="rotor rotor-a"></div>
    <div class="rotor rotor-b"></div>
    <div class="rotor rotor-c"></div>
  </div>
  <div class="login-card">
    <div class="kashaf">KASHAF — 495</div>
    <div class="kashaf-rule"></div>
    <h1>ورود به سامانه</h1>
    <p class="sub">پایش کنترل‌های امنیت اطلاعات</p>
    <div id="connBox" class="diag">
      <div><b>وضعیت اتصال:</b> <span id="connTxt">در حال بررسی…</span></div>
    </div>
    <form id="loginForm">
      <div class="field"><label>نام کاربری</label>
        <input id="luser" value="ice" required autocomplete="username"></div>
      <div class="field"><label>رمز عبور</label>
        <input id="lpass" type="password" value="ice" required autocomplete="current-password"></div>
      <button class="btn btn-primary btn-full" type="submit" id="loginBtn">ورود</button>
      <div class="err" id="loginErr"></div>
    </form>
    <div class="mode-toggle">
      <button id="retestBtn">تست اتصال</button>
      <button id="localModeBtn">حالت محلی</button>
    </div>
    <div class="hint">کاربر پیش‌فرض: <b>ice</b> / رمز: <b>ice</b></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><b>KASHAF 495</b><span>پایش کنترل‌های امنیت</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="user-chip">

/* =========================================================
   JALALI CALENDAR
========================================================= */
const JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const JALALI_WEEKDAYS = ['ش','ی','د','س','چ','پ','ج'];

function g2j(gy, gm, gd){
  const gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + gdm[gm-1];
  jy += 33*Math.floor(days/12053); days %= 12053;
  jy += 4*Math.floor(days/1461); days %= 1461;
  if (days > 365) { jy += Math.floor((days-1)/365); days = (days-1)%365; }
  const jm = (days < 186) ? 1 + Math.floor(days/31) : 7 + Math.floor((days-186)/30);
  const jd = 1 + ((days < 186) ? (days%31) : ((days-186)%30));
  return [jy, jm, jd];
}
function j2g(jy, jm, jd){
  let gy = (jy <= 979) ? 621 : 1600;
  jy -= (jy <= 979) ? 0 : 979;
  let days = (365*jy) + (Math.floor(jy/33)*8) + Math.floor(((jy%33)+3)/4) + 78 + jd + ((jm<7) ? (jm-1)*31 : ((jm-7)*30)+186);
  gy += 400*Math.floor(days/146097); days %= 146097;
  if (days >= 36525) { days--; gy += 100*Math.floor(days/36524); days %= 36524; if (days >= 365) days++; }
  gy += 4*Math.floor(days/1461); days %= 1461;
  if (days >= 366) { gy += Math.floor((days-1)/365); days = (days-1)%365; }
  let gd = days + 1;
  const sa = [0,31,((gy%4===0 && gy%100!==0) || (gy%400===0)) ? 29 : 28,31,30,31,30,31,31,30,31,30,31];
  let gm; for (gm=1; gm<=12; gm++) { if (gd <= sa[gm]) break; gd -= sa[gm]; }
  return [gy, gm, gd];
}
function isLeapJalali(jy){
  const a = jy % 33;
  return [1,5,9,13,17,22,26,30].includes(a);
}
function jalaliMonthLength(jy, jm){
  if (jm <= 6) return 31;
  if (jm <= 11) return 30;
  return isLeapJalali(jy) ? 30 : 29;
}
function firstWeekdayOfJalaliMonth(jy, jm){
  const [gy, gm, gd] = j2g(jy, jm, 1);
  const d = new Date(gy, gm-1, gd);
  // JS: 0=Sun..6=Sat. Persian week starts Saturday(0).
  return (d.getDay() + 1) % 7;
}
function todayJalali(){
  const n = new Date();
  const [y,m,d] = g2j(n.getFullYear(), n.getMonth()+1, n.getDate());
  return `${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
}
function parseJalali(s){
  const m = toLatin(String(s||'').trim()).match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  if(y<1200||y>1600||mo<1||mo>12||d<1||d>31) return null;
  const maxD = jalaliMonthLength(y, mo);
  if(d > maxD) return null;
  return `${y}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
}
function displayDate(s){
  if(!s) return '';
  const p = parseJalali(s);
  return p ? fa(p) : '';
}

function openDatePicker(currentValue, onPick){
  const today = todayJalali();
  const parsed = currentValue ? parseJalali(currentValue) : null;
  let viewParts = (parsed || today).split('/').map(Number);
  let jy = viewParts[0], jm = viewParts[1];
  let selected = parsed;

  const host = document.getElementById('datePickerHost');

  function render(){
    const monthLen = jalaliMonthLength(jy, jm);
    const firstWd = firstWeekdayOfJalaliMonth(jy, jm);
    const cells = [];
    for(let i=0; i<firstWd; i++) cells.push(null);
    for(let d=1; d<=monthLen; d++) cells.push(d);
    while(cells.length % 7 !== 0) cells.push(null);

    const daysHtml = cells.map(d => {
      if(d === null) return `<span class="dp-day empty"></span>`;
      const full = `${jy}/${String(jm).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
      const isToday = full === today;
      const isSel = selected === full;
      const cls = ['dp-day'];
      if(isToday) cls.push('today');
      if(isSel) cls.push('selected');
      return `<button type="button" class="${cls.join(' ')}" data-day="${d}">${fa(d)}</button>`;
    }).join('');

    host.innerHTML = `<div class="date-picker" id="dpBg">
      <div class="date-picker-box">
        <div class="dp-header">
          <div class="dp-nav">
            <button type="button" data-nav="py" title="سال قبل">««</button>
            <button type="button" data-nav="pm" title="ماه قبل">«</button>
          </div>
          <div class="dp-title">${JALALI_MONTHS[jm-1]} ${fa(jy)}</div>
          <div class="dp-nav">
            <button type="button" data-nav="nm" title="ماه بعد">»</button>
            <button type="button" data-nav="ny" title="سال بعد">»»</button>
          </div>
        </div>
        <div class="dp-weekdays">${JALALI_WEEKDAYS.map(w=>`<span>${w}</span>`).join('')}</div>
        <div class="dp-days">${daysHtml}</div>
        <div class="dp-foot">
          <button type="button" data-act="today" class="primary">امروز</button>
          <button type="button" data-act="clear">پاک</button>
          <button type="button" data-act="close">بستن</button>
        </div>
      </div>
    </div>`;

    host.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
      const n = b.dataset.nav;
      if(n === 'py') jy--;
      if(n === 'ny') jy++;
      if(n === 'pm') { jm--; if(jm<1){ jm=12; jy--; } }
      if(n === 'nm') { jm++; if(jm>12){ jm=1; jy++; } }
      render();
    }));

    host.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => {
      const d = Number(b.dataset.day);
      const full = `${jy}/${String(jm).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
      selected = full;
      onPick(full);
      close();
    }));

    host.querySelector('[data-act="today"]').addEventListener('click', () => {
      const p = today.split('/').map(Number);
      jy = p[0]; jm = p[1]; selected = today;
      onPick(today);
      close();
    });

    host.querySelector('[data-act="clear"]').addEventListener('click', () => {
      onPick(null);
      close();
    });

    host.querySelector('[data-act="close"]').addEventListener('click', close);

    host.querySelector('#dpBg').addEventListener('click', e => {
      if(e.target.id === 'dpBg') close();
    });
  }

  function close(){ host.innerHTML = ''; }

  render();
}

async function testConnection(){
  const box = $('#connBox'); const txt = document.getElementById('connTxt');
  if(!box||!txt||MODE==='local') return;
  txt.textContent = 'در حال بررسی…'; box.className = 'diag';
  if(!sb){ txt.textContent = 'کتابخانه بارگذاری نشد.'; box.className = 'diag err'; return; }
  const ctrl = new AbortController(); const timer = setTimeout(()=>ctrl.abort(), 9000);
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_users?select=id&limit=1`, {
      method:'GET', headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}` }, signal:ctrl.signal
    });
    clearTimeout(timer);
    if(res.ok){ txt.textContent = 'متصل — پایگاه داده در دسترس است.'; box.className = 'diag ok'; return true; }
    let body=''; try{ body = await res.text(); }catch(e){}
    if(res.status===404 || (body && body.includes('does not exist'))){
      txt.textContent = 'اتصال برقرار شد ولی جداول ساخته نشده‌اند.';
      box.className = 'diag warn';
    } else {
      txt.textContent = `پاسخ سرور: ${res.status}`; box.className = 'diag warn';
    }
  }catch(err){
    clearTimeout(timer);
    const msg = String(err&&err.message||err);
    if(msg.includes('abort') || msg.includes('Failed to fetch') || msg.includes('NetworkError')){
      txt.textContent = 'اتصال برقرار نشد. پروژه Paused است یا شبکه مسدود است.';
      box.className = 'diag err';
    } else {
      txt.textContent = 'خطا: '+msg; box.className = 'diag err';
    }
  }
}

  if(error){

  }
  const safe = file.name.replace(/[^\w.\-آ-ی]/g, '_');
  const path = `${S.periodId}/${controlId}/${Date.now()}_${safe}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { upsert:true });
  if(error) throw new Error('آپلود فایل ناموفق: '+error.message);
  const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
  return { url: data.publicUrl, name: file.name };
}

/* =========================================================
   LOADERS
========================================================= */
async function loadControls(){
  S.controls = await apiListControls();
  S.units = [...new Set(S.controls.map(c=>c.owner_unit).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  S.cats  = [...new Set(S.controls.map(c=>c.category).filter(Boolean))];
  S.levels= [...new Set(S.controls.map(c=>c.level).filter(Boolean))];
}
async function loadPeriods(){
  S.periods = await apiListPeriods();
  if(S.periods.length && !S.periods.find(p=>p.id===S.periodId)){
    S.periodId = S.periods[0].id;
  }
}
async function loadAssessments(){
  S.assessments = {};
  if(!S.periodId) return;
  const rows = await apiListAssessments(S.periodId);
  rows.forEach(a => S.assessments[a.control_id] = a);
}
async function loadAllAssessments(){
  S.allAssessments = await apiListAssessments(null);
}

/* =========================================================
   DERIVED
========================================================= */
function controlStatus(c){
  const a = S.assessments[c.id];
  return normalizeStatus((a && a.status) || c.status || 'عدم پیاده‌سازی');
}
function controlProgress(c){
  const a = S.assessments[c.id];
  if(a && a.progress !== null && a.progress !== undefined && a.progress !== '') return Number(a.progress);
  return statusWeight(controlStatus(c));
}
function assessmentMapFor(pid){
  const m = {};
  S.allAssessments.filter(a=>a.period_id===pid).forEach(a => m[a.control_id]=a);
  return m;
}
function progressWithMap(c, map){
  const a = map[c.id];
  if(a && a.progress !== null && a.progress !== undefined && a.progress !== '') return Number(a.progress);
  return statusWeight((a && a.status) || c.status);
}

/* =========================================================
   BOOT
========================================================= */
async function bootApp(){
  const content = $('#content');
  content.innerHTML = `<div class="card"><div class="spin"></div><div class="empty">در حال بارگذاری…</div></div>`;
  try{
    await loadPeriods();
    await loadControls();
    await loadAssessments();
    if(!S.periods.length) S.view = 'periods';
    renderNav(); renderPeriodSelect(); render();
  }catch(err){
    content.innerHTML = `<div class="card"><h3><span class="dot"></span> خطا در بارگذاری</h3>
      <div class="empty" style="text-align:right">${esc(err.message || err)}</div></div>`;
  }
}
function renderNav(){
  $('#nav').innerHTML = NAV.map(n =>
    `<button data-view="${n.id}" class="${S.view===n.id?'active':''}">${n.label}</button>`).join('');
}
function renderPeriodSelect(){
  const sel = $('#globalPeriod');
  if(!S.periods.length){ sel.innerHTML = `<option value="">— بدون دوره —</option>`; sel.disabled = true; return; }
  sel.disabled = false;
  sel.innerHTML = S.periods.map((p,i) =>
    `<option value="${p.id}" ${p.id===S.periodId?'selected':''}>${esc(p.name)}${i===0?' (پایه)':''}</option>`).join('');
}
function render(){
  $('#pageTitle').textContent = TITLES[S.view] || '';
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view===S.view));
  const c = $('#content');
  switch(S.view){
    case 'dashboard': c.innerHTML = viewDashboard(); break;
    case 'controls':  c.innerHTML = viewControls(); break;
    case 'assess':    c.innerHTML = viewAssess(); break;
    case 'trend':     c.innerHTML = viewTrend(); break;
    case 'periods':   c.innerHTML = viewPeriods(); break;
    case 'users':     c.innerHTML = viewUsers(); break;
    case 'import':    c.innerHTML = viewImport(); break;
  }
  c.scrollTop = 0;
  bindView();
  if(S.view==='trend') ensureTrendData();
}

function viewDashboard(){
  const total = S.controls.length;
  const counts = {'عدم پیاده‌سازی':0,'در حال پیاده‌سازی':0,'پیاده‌سازی کامل':0,'غیر قابل احراز':0};
  let sum = 0;
  S.controls.forEach(c => { counts[normalizeStatus(controlStatus(c))]++; sum += controlProgress(c); });
  const avg = total ? Math.round(sum/total) : 0;

  const byUnit = {};
  S.controls.forEach(c => {
    const u = c.owner_unit || 'نامشخص';
    if(!byUnit[u]) byUnit[u] = { n:0, sum:0, ok:0, doing:0, bad:0 };
    byUnit[u].n++; byUnit[u].sum += controlProgress(c);
    const ns = normalizeStatus(controlStatus(c));
    if(ns==='پیاده‌سازی کامل') byUnit[u].ok++;
    else if(ns==='در حال پیاده‌سازی') byUnit[u].doing++;
    else byUnit[u].bad++;

  const unitRows = Object.entries(byUnit).map(([k,v]) => ({
    name:k, n:v.n, ok:v.ok, doing:v.doing, bad:v.bad, pct: v.n?Math.round(v.sum/v.n):0

  const byLevel = {};
  S.controls.forEach(c => {
    const l = c.level || 'نامشخص';
    if(!byLevel[l]) byLevel[l] = { n:0, sum:0 };
    byLevel[l].n++; byLevel[l].sum += controlProgress(c);
  });
  const byCat = {};
  S.controls.forEach(c => {
    const k = c.category || 'نامشخص';
    if(!byCat[k]) byCat[k] = { n:0, sum:0 };
    byCat[k].n++; byCat[k].sum += controlProgress(c);
  });
  const catRows = Object.entries(byCat).map(([k,v]) => ({
    name:k, n:v.n, pct: v.n?Math.round(v.sum/v.n):0
  })).sort((a,b)=>b.pct-a.pct);

  const segs = [
    {label:'پیاده‌سازی کامل', val:counts['پیاده‌سازی کامل'], color:'#18181b'},
    {label:'در حال', val:counts['در حال پیاده‌سازی'], color:'#71717a'},
    {label:'عدم پیاده‌سازی', val:counts['عدم پیاده‌سازی'], color:'#d4d4d8'},
    {label:'غیر قابل احراز', val:counts['غیر قابل احراز'], color:'#f4f4f5'}
  ];
  let acc = 0;
  const grad = segs.map(s => {
    const from = total?acc/total*360:0; acc += s.val;
    const to = total?acc/total*360:0;
    return `${s.color} ${from}deg ${to}deg`;
  }).join(',');

  const periodName = (S.periods.find(p=>p.id===S.periodId)||{}).name || 'بدون دوره';
  const idx = periodIndex();

  return `<div class="grid" style="gap:16px">
    <div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 20px">
      <span class="badge badge-soft">دوره: ${esc(periodName)}${idx===0?' (پایه)':''}</span>
      <span class="badge badge-soft">کنترل: ${fa(total)}</span>
      <span class="badge badge-soft">واحد: ${fa(unitRows.length)}</span>
      <span class="badge badge-soft" style="margin-right:auto">${MODE==='local'?'LOCAL':'SUPABASE'}</span>
    </div>

    <div class="grid kpis">
      <div class="card kpi"><div class="v">${fa(avg)}٪</div><div class="l">پیشرفت کل</div>
        <div class="bar" style="margin-top:12px"><i style="width:${avg}%"></i></div></div>
      <div class="card kpi"><div class="v">${fa(counts['پیاده‌سازی کامل'])}</div><div class="l">پیاده‌سازی کامل</div></div>
      <div class="card kpi"><div class="v">${fa(counts['در حال پیاده‌سازی'])}</div><div class="l">در حال انجام</div></div>
      <div class="card kpi"><div class="v">${fa(counts['عدم پیاده‌سازی'])}</div><div class="l">عدم پیاده‌سازی</div></div>
    </div>

    <div class="grid cols2">
      <div class="card">
        <h3><span class="dot"></span> توزیع وضعیت</h3>
        <div class="donut-wrap">
          <div class="donut" style="background:conic-gradient(${grad||'#f4f4f5 0deg 360deg'})">
            <div class="mid"><b>${fa(total)}</b><span>کنترل</span></div>
          </div>
          <div class="legend">
            ${segs.map(s=>`<div><i style="background:${s.color}"></i>${s.label}<b>${fa(s.val)}</b></div>`).join('')}
          </div>
        </div>
      </div>
      <div class="card">
        <h3><span class="dot"></span> پیشرفت به تفکیک سطح</h3>
        ${Object.keys(byLevel).length ? Object.entries(byLevel).map(([k,v])=>{
          const pct = v.n?Math.round(v.sum/v.n):0;
          return `<div class="bar-row"><div><div class="nm">${esc(k)} — ${fa(v.n)}</div>

          </div></td></tr>`).join('')}</tbody>
      </table></div>` : '<div class="empty">داده‌ای نیست</div>'}
    </div>

    <div class="card">
      <h3><span class="dot"></span> پیشرفت به تفکیک دسته</h3>
      ${catRows.length ? catRows.map(c=>`<div class="bar-row">
        <div><div class="nm">${esc(c.name)} — ${fa(c.n)}</div>
          <div class="bar"><i style="width:${c.pct}%"></i></div></div>

/* =========================================================
   CONTROLS
========================================================= */
function filteredControls(){
  const f = S.filters;
  return S.controls.filter(c => {
    if(f.unit && c.owner_unit!==f.unit) return false;
    if(f.cat && c.category!==f.cat) return false;
    if(f.level && c.level!==f.level) return false;
    if(f.status && normalizeStatus(controlStatus(c))!==f.status) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = `${c.title||''} ${c.evidence||''} ${c.owner_unit||''} ${c.category||''} ${c.row_no||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* =========================================================
   TREND
========================================================= */
function viewTrend(){
  if(!S.periods.length) return `<div class="card"><div class="empty">دوره‌ای نیست.</div></div>`;
  if(!S._trendLoaded) return `<div class="card"><div class="spin"></div><div class="empty">بارگذاری…</div></div>`;
  const unitOpts = ['<option value="__all">همه واحدها</option>']
    .concat(S.units.map(u=>`<option value="${esc(u)}" ${S._trendUnit===u?'selected':''}>${esc(u)}</option>`)).join('');
  const selected = S._trendUnit || '__all';
  const ctrlFiltered = selected==='__all' ? S.controls : S.controls.filter(c=>c.owner_unit===selected);
  const series = S.periods.map(p => {
    const map = assessmentMapFor(p.id);
    const vals = ctrlFiltered.map(c=>progressWithMap(c,map));
    return { id:p.id, name:p.name, value: vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0 };
  });
  return `

      <select id="trendUnit">${unitOpts}</select>

  <div class="card" style="margin-bottom:16px">
    <h3><span class="dot"></span> روند ${selected==='__all'?'کل سازمان':esc(selected)}</h3>
    ${lineChart(series)}

  <div class="card" style="margin-bottom:16px">
    <h3><span class="dot"></span> جدول پیشرفت واحدها</h3>

      <thead><tr><th>واحد</th>${S.periods.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr></thead>
      <tbody>${S.units.map(u=>{
        const cs = S.controls.filter(c=>c.owner_unit===u);
        const cells = S.periods.map(p=>{
          const map = assessmentMapFor(p.id);
          const vals = cs.map(c=>progressWithMap(c,map));
          const avg = vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
          return `<td>${fa(avg)}٪</td>`;
        }).join('');
        return `<tr><td style="font-weight:600">${esc(u)}</td>${cells}</tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>
  <div class="card">
    <h3><span class="dot"></span> سابقه اقدامات</h3>
    ${S.periods.slice().reverse().map(p=>{
      const acts = S.allAssessments.filter(a=>a.period_id===p.id && (a.actions||'').trim());
      if(!acts.length) return '';
      return `<div style="margin-bottom:20px">
        <div class="badge badge-soft" style="margin-bottom:10px">${esc(p.name)} — ${fa(acts.length)} اقدام</div>
        ${acts.slice(0,80).map(a=>{
          const c = S.controls.find(x=>x.id===a.control_id);
          return `<div style="background:var(--faint);border:1px solid var(--line);padding:12px;margin-bottom:8px">
            <div style="font-size:10.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.06em">
              #${fa(c?.row_no??'')} — ${esc(c?.owner_unit||'')} — ${esc((c?.title||'').slice(0,80))}
            </div>
            <div style="font-size:11.5px;line-height:1.9">${esc(a.actions)}</div>
            <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
              ${a.status?`<span class="badge ${statusClass(a.status)}">${esc(normalizeStatus(a.status))}</span>`:''}
              ${a.progress!=null?`<span class="badge badge-soft">${fa(a.progress)}٪</span>`:''}
              ${a.file_url?`<a class="badge badge-soft" href="${esc(a.file_url)}" target="_blank" rel="noopener">پیوست</a>`:''}
            </div></div>`;
        }).join('')}
      </div>`;
    }).join('') || '<div class="empty">اقدامی ثبت نشده.</div>'}
  </div>`;
}
function lineChart(series){
  if(!series.length) return '<div class="empty">—</div>';
  const W=640, H=240, PAD=44, n=series.length;
  const xs = i => n===1?W/2:PAD+i*(W-2*PAD)/(n-1);
  const ys = v => H-PAD-(v/100)*(H-2*PAD);
  const path = series.map((s,i)=>`${i?'L':'M'}${xs(i).toFixed(1)},${ys(s.value).toFixed(1)}`).join(' ');
  return `<div style="width:100%;overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:340px;height:auto">
    ${[0,25,50,75,100].map(v=>`
      <line x1="${PAD}" y1="${ys(v)}" x2="${W-PAD}" y2="${ys(v)}" stroke="#e4e4e7" stroke-width="1"/>
      <text x="${PAD-8}" y="${ys(v)+4}" fill="#a1a1aa" font-size="9" text-anchor="end">${v}%</text>`).join('')}
    <path d="${path}" fill="none" stroke="#18181b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    ${series.map((s,i)=>`
      <circle cx="${xs(i)}" cy="${ys(s.value)}" r="4" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
      <text x="${xs(i)}" y="${ys(s.value)-12}" fill="#09090b" font-size="10" font-weight="600" text-anchor="middle">${fa(s.value)}٪</text>
      <text x="${xs(i)}" y="${H-14}" fill="#71717a" font-size="9" text-anchor="middle">${esc(s.name.length>16?s.name.slice(0,16)+'…':s.name)}</text>`).join('')}
  </svg></div>`;
}

function bindView(){
  const c = $('#content');

  // date inputs (open picker on click)
  document.querySelectorAll('.date-input').forEach(inp => {
    inp.addEventListener('click', () => {
      openDatePicker(inp.value, v => {
        inp.value = v ? fa(v) : '';
      });
    });
  });

  if(S.view==='controls'){
    const rebind = () => { c.innerHTML = viewControls(); bindView(); };
    $('#fQ')?.addEventListener('input', e => { S.filters.q = e.target.value; S.page = 1; c.innerHTML = viewControls(); bindView(); const el = $('#fQ'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); });
    $('#fUnit')?.addEventListener('change', e => { S.filters.unit = e.target.value; S.page = 1; rebind(); });
    $('#fStatus')?.addEventListener('change', e => { S.filters.status = e.target.value; S.page = 1; rebind(); });
    $('#fCat')?.addEventListener('change', e => { S.filters.cat = e.target.value; S.page = 1; rebind(); });
    $('#fLevel')?.addEventListener('change', e => { S.filters.level = e.target.value; S.page = 1; rebind(); });
    $('#fSize')?.addEventListener('change', e => { S.pageSize = Number(e.target.value); S.page = 1; rebind(); });
    $('#clearFilters')?.addEventListener('click', () => { S.filters = {q:'',unit:'',status:'',cat:'',level:''}; S.page = 1; rebind(); });
    $('#addControlBtn')?.addEventListener('click', () => openAddControlModal());
    c.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => { S.page = Number(b.dataset.page); rebind(); c.scrollTop = 0; }));
    c.querySelectorAll('[data-open]').forEach(el => {
      el.addEventListener('click', (ev) => {
        if(ev.target.closest('[data-del]')) return;
        openControlModal(el.dataset.open);
      });
    });
    c.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async ev => {
      ev.stopPropagation();
      if(!confirm('این کنترل و ارزیابی‌هایش حذف شود؟')) return;
      try{
        await apiDelControl(b.dataset.del);
        await loadControls(); await loadAssessments();
        toast('حذف شد'); render();
      }catch(err){ toast('خطا: '+err.message); }
    }));
  }
  if(S.view==='assess'){
    $('#asUnit')?.addEventListener('change', e => { S.assessUnit = e.target.value; c.innerHTML = viewAssess(); bindView(); });
    c.querySelectorAll('.as-item').forEach(item => {
      const cid = item.dataset.cid;
      const isFirst = item.dataset.first === '1';
      const range = item.querySelector('.a-range');
      const num = item.querySelector('.a-num');
      const statusSel = item.querySelector('.a-status');

      if(!isFirst && range && num && statusSel){
        const sync = v => {
          v = Math.max(0, Math.min(100, Math.round(Number(v)||0)));
          range.value = v; num.value = v;
          statusSel.value = statusFromProgress(v);
        };
        range.addEventListener('input', () => sync(range.value));
        num.addEventListener('input', () => sync(num.value));
      }

      item.querySelector('.a-save').addEventListener('click', async ev => {
        const btn = ev.currentTarget; btn.disabled = true; btn.textContent = 'ذخیره…';
        try{
          let payload;
          if(isFirst){
            const st = statusSel.value;
            payload = {
              status: st, progress: statusWeight(st),
              actions: item.querySelector('.a-actions').value.trim(),
              updated_by: S.user?.username || '',
              updated_at: new Date().toISOString()
            };
          } else {
            const pr = Math.max(0, Math.min(100, Math.round(Number(num.value)||0)));
            payload = {
              status: statusFromProgress(pr), progress: pr,
              actions: item.querySelector('.a-actions').value.trim(),
              updated_by: S.user?.username || '',
              updated_at: new Date().toISOString()
            };
          }
          const fi = item.querySelector('.a-file');
          if(fi.files && fi.files[0]){
            const up = await apiUpload(fi.files[0], cid);
            payload.file_url = up.url; payload.file_name = up.name;
          }
          const saved = await apiSaveAssessment(cid, payload);
          S.assessments[cid] = saved;
          const s = item.querySelector('.saved'); s.style.display = 'inline'; setTimeout(()=>s.style.display='none', 2000);
          toast('ذخیره شد');
        }catch(err){ toast('خطا: '+err.message); }
        finally{ btn.disabled = false; btn.textContent = 'ذخیره'; }
      });
    });
  }
  if(S.view==='trend'){
    $('#trendUnit')?.addEventListener('change', e => { S._trendUnit = e.target.value; c.innerHTML = viewTrend(); bindView(); });
  }
  if(S.view==='periods'){
    $('#addPeriod')?.addEventListener('click', async () => {
      const name = ($('#pName').value||'').trim();
      if(!name) return toast('نام دوره را وارد کنید');
      const sVal = parseJalali($('#pStart').value);
      const eVal = parseJalali($('#pEnd').value);
      if($('#pStart').value && !sVal) return toast('تاریخ شروع نامعتبر');
      if($('#pEnd').value && !eVal) return toast('تاریخ پایان نامعتبر');
      try{
        const row = await apiAddPeriod({ name, start_date: sVal, end_date: eVal });
        await loadPeriods();
        S.periodId = row.id;
        renderPeriodSelect(); await loadAssessments();
        toast('دوره ایجاد شد');
        c.innerHTML = viewPeriods(); bindView();
      }catch(err){ toast('خطا: '+err.message); }
    });
    c.querySelectorAll('[data-selperiod]').forEach(b => b.addEventListener('click', async () => {
      S.periodId = b.dataset.selperiod; renderPeriodSelect(); await loadAssessments();
      toast('دوره انتخاب شد'); c.innerHTML = viewPeriods(); bindView();
    }));
    c.querySelectorAll('[data-delperiod]').forEach(b => b.addEventListener('click', async () => {
      if(!confirm('حذف دوره و ارزیابی‌های آن؟')) return;
      try{
        await apiDelPeriod(b.dataset.delperiod);
        await loadPeriods();
        if(!S.periods.find(p=>p.id===S.periodId)) S.periodId = S.periods[0]?.id || null;
        renderPeriodSelect(); await loadAssessments();
        toast('حذف شد'); c.innerHTML = viewPeriods(); bindView();
      }catch(err){ toast('خطا: '+err.message); }
    }));
  }
  if(S.view==='users'){
    renderUsersList().then(() => {
      document.querySelectorAll('[data-deluser]').forEach(b => b.addEventListener('click', async () => {
        if(!confirm('حذف کاربر؟')) return;
        try{
          if(MODE==='local') await LocalDB.delUser(b.dataset.deluser);
          else { const { error } = await sb.from('app_users').delete().eq('id', b.dataset.deluser); if(error) throw error; }
          toast('حذف شد'); renderUsersList();
        }catch(err){ toast('خطا: '+err.message); }
      }));
    });
    $('#addUser')?.addEventListener('click', async () => {
      const u = ($('#nuUser').value||'').trim();
      const p = ($('#nuPass').value||'').trim();
      const n = ($('#nuName').value||'').trim();
      const r = $('#nuRole').value;
      if(!u || !p) return toast('نام کاربری و رمز الزامی است');
      try{
        const hash = await sha256(p);
        if(MODE==='local'){
          if(await LocalDB.findUser(u)) throw new Error('کاربر تکراری است');
          await LocalDB.addUser({ id:uuid(), username:u, password_hash:hash, full_name:n, role:r });
        } else {
          const { error } = await sb.from('app_users').insert({ username:u, password_hash:hash, full_name:n, role:r });
          if(error) throw error;
        }
        toast('کاربر اضافه شد');
        $('#nuUser').value = ''; $('#nuPass').value = ''; $('#nuName').value = '';
        renderUsersList();
      }catch(err){ toast('خطا: '+err.message); }
    });
  }
  if(S.view==='import'){
    $('#addCtrlFromImport')?.addEventListener('click', () => openAddControlModal());
    $('#wipeControls')?.addEventListener('click', async () => {
      if(!confirm('همه کنترل‌ها و ارزیابی‌های مرتبط حذف شوند؟')) return;
      try{
        if(MODE==='local') await LocalDB.wipeControls();
        else { const { error } = await sb.from('controls').delete().not('id','is',null); if(error) throw error; }
        await loadControls(); toast('حذف شد'); c.innerHTML = viewImport(); bindView();
      }catch(err){ toast('خطا: '+err.message); }
    });
    $('#doImport')?.addEventListener('click', async () => {
      const file = $('#xlsFile').files[0]; const log = $('#importLog');
      if(!file) return toast('فایل را انتخاب کنید');
      log.textContent = 'در حال خواندن…';
      try{
        const rows = await parseSheet(file);
        if(!rows.length) throw new Error('فایل خالی است');
        const mapped = rows.map(r => {
          const g = (...names) => {
            for(const n of names){
              const key = Object.keys(r).find(k => String(k).trim()===n);
              if(key!==undefined && String(r[key]).trim()!=='') return String(r[key]).trim();
            }
            return '';
          };
          return {
            category: g('دسته')||null,
            level: g('سطح پیشرفتگی')||null,
            title: g('کنترل')||'',
            evidence: g('شواهد')||'',
            status: normalizeStatus(g('وضعیت پیاده‌سازی')||''),
            owner_unit: g('واحد مسئول رسیدگی')||null
          };
        }).filter(x=>x.title);
        if(!mapped.length) throw new Error('ستون‌ها شناسایی نشدند. سرستون‌ها را بررسی کنید.');
        log.textContent = `${fa(mapped.length)} رکورد. حذف داده قبلی…`;
        if(MODE==='local'){
          await LocalDB.setControls(mapped);
        } else {
          const del = await sb.from('controls').delete().not('id','is',null);
          if(del.error) throw del.error;
          const CH = 100;
          for(let i = 0; i < mapped.length; i += CH){
            const part = mapped.slice(i, i+CH).map((r,idx) => ({ row_no: i+idx+1, ...r }));
            const { error } = await sb.from('controls').insert(part);
            if(error) throw error;
            log.textContent = `${fa(Math.min(i+CH, mapped.length))} از ${fa(mapped.length)}`;
          }
        }
        await loadControls();
        log.innerHTML = `<span style="color:var(--txt);font-weight:600">بارگذاری کامل شد — ${fa(mapped.length)} کنترل</span>`;
        toast('بارگذاری کامل شد'); render();
      }catch(err){
        log.innerHTML = `<span style="color:var(--txt)">خطا: ${esc(err.message||err)}</span>`;
        toast('خطا در بارگذاری');
      }
    });
  }
}
function parseSheet(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        res(XLSX.utils.sheet_to_json(ws, { defval:'', raw:false }));
      }catch(err){ rej(err); }
    };
    r.onerror = () => rej(new Error('خواندن فایل ناموفق'));
    r.readAsArrayBuffer(file);
  });
}

    <div class="field"><label>دسته</label>
      <input id="mCat" placeholder="مثلاً: امنیت شبکه"></div>
    <div class="field"><label>سطح پیشرفتگی</label>
      <select id="mLevel">
        <option value="پایه">پایه</option>
        <option value="مقدماتی">مقدماتی</option>
        <option value="پیشرفته">پیشرفته</option>
      </select></div>
    <div class="field"><label>متن کنترل</label>
      <textarea id="mTitle" placeholder="متن کنترل…"></textarea></div>
    <div class="field"><label>شواهد</label>
      <textarea id="mEvidence" placeholder="شواهد ارزیابی…"></textarea></div>
    <div class="field"><label>وضعیت پیاده‌سازی (اولیه)</label>
      <select id="mStatus">${STATUS_OPTS.map(v=>`<option value="${v}">${v}</option>`).join('')}</select></div>
    <div class="field"><label>واحد مسئول رسیدگی</label>
      <input id="mUnit" placeholder="مثلاً: واحد مدیریت زیرساخت و شبکه"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" id="mSave">افزودن</button>
      <button class="btn" id="mCancel">انصراف</button>
    </div>
  </div></div>`;
  const close = () => $('#modalHost').innerHTML='';
  $('#closeModal').addEventListener('click', close);
  $('#mCancel').addEventListener('click', close);
  $('#modalBg').addEventListener('click', e => { if(e.target.id==='modalBg') close(); });
  $('#mSave').addEventListener('click', async () => {
    const title = $('#mTitle').value.trim();
    if(!title) return toast('متن کنترل الزامی است');
    try{
      const row = {
        category: $('#mCat').value.trim() || null,
        level: $('#mLevel').value || null,
        title,
        evidence: $('#mEvidence').value.trim() || '',
        status: normalizeStatus($('#mStatus').value),
        owner_unit: $('#mUnit').value.trim() || null
      };
      if(MODE==='local'){
        await LocalDB.addControl(row);
      } else {
        const maxRow = S.controls.reduce((m,c)=>Math.max(m, Number(c.row_no)||0), 0);
        const { error } = await sb.from('controls').insert({ row_no: maxRow+1, ...row });
        if(error) throw error;
      }
      await loadControls();
      toast('کنترل اضافه شد');
      close();
      render();
    }catch(err){ toast('خطا: '+err.message); }
  });
}

/* =========================================================
   CONTROL DETAIL MODAL
========================================================= */
function openControlModal(id){
  const c = S.controls.find(x=>x.id===id); if(!c) return;
  const a = S.assessments[c.id] || {};
  const st = controlStatus(c), pr = controlProgress(c);
  const periodName = (S.periods.find(p=>p.id===S.periodId)||{}).name || '—';
  $('#modalHost').innerHTML = `<div class="modal" id="modalBg"><div class="modal-box">
    <button class="close-x" id="closeModal">×</button>
    <h3>#${fa(c.row_no??'')} — ${esc(c.title)}</h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">
      <span class="badge badge-soft">${esc(c.category||'—')}</span>
      <span class="badge badge-soft">سطح: ${esc(c.level||'—')}</span>
      <span class="badge ${statusClass(st)}">${esc(st)}</span>
      <span class="badge badge-soft">${esc(c.owner_unit||'—')}</span>
    </div>
    <div class="kv"><div class="k">متن کنترل</div><div class="v">${esc(c.title)}</div></div>
    <div class="kv"><div class="k">شواهد ارزیابی</div><div class="v">${esc(c.evidence||'—')}</div></div>
    <div class="kv"><div class="k">وضعیت دوره «${esc(periodName)}»</div>
      <div class="v" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="badge ${statusClass(st)}">${esc(st)}</span>
        <div class="bar" style="flex:1;min-width:120px;margin:0"><i style="width:${pr}%"></i></div>
        <b>${fa(pr)}٪</b>
      </div></div>
    ${a.actions?`<div class="kv"><div class="k">اقدامات این دوره</div><div class="v">${esc(a.actions)}</div></div>`:''}
    ${a.file_url?`<div class="kv"><div class="k">پیوست</div><div class="v"><a href="${esc(a.file_url)}" target="_blank" rel="noopener">${esc(a.file_name||'دانلود فایل')}</a></div></div>`:''}
    <button class="btn btn-primary btn-full" id="goAssess" style="margin-top:8px">فرم ارزیابی این واحد</button>
  </div></div>`;
  const close = () => $('#modalHost').innerHTML='';
  $('#closeModal').addEventListener('click', close);
  $('#modalBg').addEventListener('click', e => { if(e.target.id==='modalBg') close(); });
  $('#goAssess').addEventListener('click', () => { S.assessUnit = c.owner_unit||''; S.view = 'assess'; close(); render(); });
}

/* =========================================================
   GLOBAL EVENTS
========================================================= */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), err = $('#loginErr');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'در حال بررسی…';
  try{
    const u = await doLogin($('#luser').value.trim(), $('#lpass').value);
    startSession(u);
  }catch(ex){ err.textContent = ex.message || 'ورود ناموفق'; }
  finally{ btn.disabled = false; btn.textContent = 'ورود'; }
});
$('#retestBtn').addEventListener('click', async () => {
  if(MODE==='local'){ setMode('supabase'); } else { await testConnection(); }
});
$('#localModeBtn').addEventListener('click', () => { setMode('local'); toast('حالت محلی فعال شد'); });
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]'); if(!b) return;
  S.view = b.dataset.view;
  $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show');
  render();
});
$('#globalPeriod').addEventListener('change', async e => {
  S.periodId = e.target.value || null;
  await loadAssessments();
  toast('دوره تغییر کرد'); render();
});
$('#menuBtn').addEventListener('click', () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); });
$('#overlay').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); });
$('#logoutBtn').addEventListener('click', logout);
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){
    $('#sidebar').classList.remove('open');
    $('#overlay').classList.remove('show');
    $('#modalHost').innerHTML='';
    $('#datePickerHost').innerHTML='';
  }
});

updateConnBox();
</script>
</body>
</html>
