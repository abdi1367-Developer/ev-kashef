<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>سامانه پایش کنترل‌های امنیتی | کاشف ۴۹۵</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --line:#e5e9f0;
  --line2:#d4dce8;
  --txt:#111827;
  --muted:#6b7280;
  --muted2:#9ca3af;
  --accent:#2563eb;
  --accent2:#1d4ed8;
  --accent-bg:#eff6ff;
  --accent-border:#dbeafe;
  --ok:#16a34a;--ok-bg:#f0fdf4;--ok-border:#bbf7d0;
  --warn:#d97706;--warn-bg:#fffbeb;--warn-border:#fde68a;
  --bad:#dc2626;--bad-bg:#fef2f2;--bad-border:#fecaca;
  --gray:#64748b;--gray-bg:#f1f5f9;--gray-border:#e2e8f0;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:'Vazirmatn',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--txt);
  font-size:14px;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}
::-webkit-scrollbar-track{background:transparent}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
.hidden{display:none!important}

/* ============ LOGIN ============ */
.login-wrap{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;z-index:200;padding:16px;background:#f8fafc}
.bg-anim{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.b1{width:44vw;height:44vw;min-width:300px;min-height:300px;background:#bfdbfe;top:-10%;right:-8%;animation:float 19s ease-in-out infinite}
.b2{width:38vw;height:38vw;min-width:280px;min-height:280px;background:#c7d2fe;bottom:-12%;left:-8%;animation:float 23s ease-in-out infinite reverse}
.b3{width:30vw;height:30vw;min-width:240px;min-height:240px;background:#ddd6fe;top:42%;left:38%;opacity:.4;animation:float 27s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(-7%,9%,0) scale(1.1)}66%{transform:translate3d(9%,-7%,0) scale(.95)}}

.login-card{
  position:relative;z-index:3;width:min(400px,94vw);
  padding:32px 26px;border-radius:16px;
  background:#fff;border:1px solid var(--line);
  box-shadow:0 20px 60px -20px rgba(15,23,42,.12),0 4px 12px -4px rgba(15,23,42,.04);
}
.logo{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:24px;margin:0 auto 16px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border)}
.login-card h1{font-size:17px;margin:0 0 6px;text-align:center;font-weight:700;color:var(--txt)}
.login-card .sub{margin:0 0 22px;text-align:center;color:var(--muted);font-size:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input{
  width:100%;padding:11px 13px;border-radius:8px;
  border:1px solid var(--line2);background:#fff;color:var(--txt);
  outline:none;transition:.15s;font-size:13.5px;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:8px;border:1px solid var(--line2);
  background:#fff;color:var(--txt);cursor:pointer;font-weight:600;
  transition:.15s;font-size:13px;
}
.btn:hover{background:#f8fafc;border-color:#94a3b8}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-full{width:100%;padding:11px}
.btn-sm{padding:6px 11px;border-radius:7px;font-size:12px}
.btn-danger{background:#fff;border-color:var(--bad-border);color:var(--bad)}
.btn-danger:hover{background:var(--bad-bg);border-color:var(--bad)}

.err{color:var(--bad);font-size:12px;text-align:center;margin-top:10px;min-height:16px;line-height:1.7}
.diag{margin:14px 0;padding:10px 12px;border-radius:8px;font-size:11.5px;line-height:1.8;border:1px solid var(--line);background:#f8fafc;color:var(--muted)}
.diag.ok{background:var(--ok-bg);border-color:var(--ok-border);color:#166534}
.diag.err{background:var(--bad-bg);border-color:var(--bad-border);color:#991b1b}
.diag.warn{background:var(--warn-bg);border-color:var(--warn-border);color:#92400e}
.diag b{color:var(--txt);font-weight:700}
.diag code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:10.5px;font-family:monospace;color:#1e40af}
.hint{text-align:center;color:var(--muted);font-size:11px;margin-top:12px;line-height:1.8}

/* ============ APP LAYOUT ============ */
#app{display:flex;min-height:100dvh;width:100%}
.sidebar{
  width:236px;flex:0 0 236px;
  height:100dvh;position:sticky;top:0;z-index:50;
  background:#fff;border-left:1px solid var(--line);
  display:flex;flex-direction:column;
  padding:16px 10px;
  overflow:hidden;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:2px 8px 14px;border-bottom:1px solid var(--line);
  margin-bottom:10px;flex-shrink:0;
}
.brand .ic{
  width:34px;height:34px;border-radius:9px;
  display:grid;place-items:center;font-size:16px;
  background:var(--accent-bg);color:var(--accent);
  border:1px solid var(--accent-border);flex-shrink:0;
}
.brand b{display:block;font-size:13px;font-weight:700;color:var(--txt);line-height:1.3}
.brand span{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.nav{
  display:flex;flex-direction:column;gap:1px;
  flex:1;min-height:0;overflow:hidden;
}
.nav button{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:8px 11px;
  border-radius:7px;border:none;
  background:transparent;color:var(--muted);
  cursor:pointer;font-weight:500;font-size:12.5px;
  text-align:right;transition:.12s;flex-shrink:0;
}
.nav button:hover{background:var(--gray-bg);color:var(--txt)}
.nav button.active{background:var(--accent-bg);color:var(--accent);font-weight:600}
.nav button .ic{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.side-foot{border-top:1px solid var(--line);padding-top:10px;margin-top:8px;flex-shrink:0}
.user-chip{
  display:flex;align-items:center;gap:8px;
  padding:7px 8px;border-radius:8px;
  background:var(--gray-bg);margin-bottom:8px;
}
.user-chip .av{
  width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;font-weight:700;font-size:12px;
  background:var(--accent);color:#fff;flex:0 0 auto;
}
.user-chip b{display:block;font-size:12px;color:var(--txt);font-weight:600;line-height:1.2}
.user-chip span{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:45;opacity:0;pointer-events:none;transition:.25s}
.overlay.show{opacity:1;pointer-events:auto}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;width:100%}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);
}
.topbar h2{
  margin:0;font-size:15px;font-weight:700;
  flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;color:var(--txt);
}
.icon-btn{
  width:36px;height:36px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--txt);
  cursor:pointer;display:none;place-items:center;font-size:16px;flex:0 0 auto;
}
.icon-btn:hover{background:var(--gray-bg)}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.content{flex:1;padding:20px;width:100%;min-width:0}

/* ============ COMPONENTS ============ */
.grid{display:grid;gap:12px;width:100%}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;min-width:0;
}
.card h3{
  margin:0 0 12px;font-size:13px;font-weight:700;
  color:var(--txt);display:flex;align-items:center;gap:8px;
}
.card h3 .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.kpi .v{font-size:26px;font-weight:800;line-height:1.1;color:var(--txt);letter-spacing:-.5px}
.kpi .l{color:var(--muted);font-size:11.5px;margin-top:5px}

.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 9px;border-radius:99px;font-size:11px;
  border:1px solid transparent;white-space:nowrap;font-weight:500;
}
.st-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-border)}
.st-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.st-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-border)}
.st-gray{background:var(--gray-bg);color:var(--gray);border-color:var(--gray-border)}
.badge-soft{background:var(--gray-bg);color:var(--muted);border-color:var(--gray-border)}

.bar-row{display:grid;grid-template-columns:1fr 48px;gap:10px;align-items:center;margin:8px 0}
.bar-row .nm{font-size:12px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .pc{font-size:11.5px;font-weight:700;text-align:left;color:var(--accent)}
.bar{height:6px;border-radius:99px;background:var(--gray-bg);overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s ease}
.bar.g>i{background:var(--ok)}
.bar.w>i{background:var(--warn)}
.bar.b>i{background:var(--bad)}

.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
.donut{width:150px;height:150px;border-radius:50%;position:relative;display:grid;place-items:center;flex:0 0 auto}
.donut::before{content:'';position:absolute;inset:22px;border-radius:50%;background:#fff}
.donut .mid{position:relative;z-index:2;text-align:center}
.donut .mid b{display:block;font-size:24px;font-weight:800;line-height:1;color:var(--txt)}
.donut .mid span{font-size:10.5px;color:var(--muted);margin-top:2px;display:block}
.legend{display:flex;flex-direction:column;gap:8px;min-width:140px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt)}
.legend i{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.legend b{margin-right:auto;color:var(--txt);font-weight:700}

.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:12px}
.toolbar input,.toolbar select{
  padding:9px 11px;border-radius:7px;
  border:1px solid var(--line2);background:#fff;color:var(--txt);
  outline:none;width:100%;font-size:12.5px;transition:.12s;
}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}

.list{display:grid;gap:10px}
.ctrl{
  background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:13px;
  cursor:pointer;transition:.15s;min-width:0;
}
.ctrl:hover{border-color:var(--line2);box-shadow:0 2px 8px -2px rgba(15,23,42,.08)}
.cc-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.cc-no{font-size:10.5px;color:var(--muted2);font-weight:700;background:var(--gray-bg);padding:2px 7px;border-radius:5px;margin-right:auto}
.cc-title{font-size:13px;line-height:1.9;font-weight:600;margin-bottom:7px;color:var(--txt)}
.cc-ev{font-size:11.5px;line-height:1.9;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-foot{margin-top:9px;display:flex;align-items:center;gap:10px}
.cc-foot .bar{flex:1}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.pager .info{color:var(--muted);font-size:12px;padding:0 6px}

.as-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.as-item .t{font-size:13px;font-weight:600;line-height:1.85;margin-bottom:10px;color:var(--txt)}
.as-item .t .n{color:var(--accent);font-weight:700;margin-left:5px}
.as-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
.as-grid label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.as-grid select,.as-grid input{
  width:100%;padding:8px 10px;border-radius:7px;
  border:1px solid var(--line2);background:#fff;color:var(--txt);
  outline:none;font-size:12.5px;
}
.as-grid select:focus,.as-grid input:focus{border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);margin-top:6px}
textarea{
  width:100%;padding:9px 11px;border-radius:8px;
  border:1px solid var(--line2);background:#fff;color:var(--txt);
  outline:none;resize:vertical;min-height:64px;line-height:1.8;font-size:12.5px;
}
textarea:focus{border-color:var(--accent)}
input[type=file]{
  width:100%;padding:7px;border-radius:7px;
  border:1px dashed var(--line2);background:#fafbfc;
  color:var(--muted);font-size:11.5px;cursor:pointer;
}
.as-foot{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.saved{color:var(--ok);font-size:11.5px;font-weight:600}

.tbl-wrap{overflow-x:auto;width:100%}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:480px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;background:#fafbfc;white-space:nowrap}
tbody tr:hover{background:#fafbfc}

.modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:16px;background:rgba(15,23,42,.4);backdrop-filter:blur(4px);animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{
  width:min(760px,100%);max-height:88dvh;overflow:auto;
  border-radius:12px;border:1px solid var(--line);
  background:#fff;padding:20px;
  box-shadow:0 25px 60px -15px rgba(15,23,42,.25);
  animation:pop .2s ease;
}
@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:scale(1);opacity:1}}
.modal-box h3{margin:0 0 14px;font-size:15px;font-weight:700;line-height:1.9;color:var(--txt)}
.kv{margin-bottom:12px}
.kv .k{font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.kv .v{font-size:12.5px;line-height:1.95;background:#f8fafc;padding:10px 12px;border-radius:7px;border:1px solid var(--line)}
.close-x{
  position:sticky;top:0;float:left;
  background:#fff;color:var(--muted);border:1px solid var(--line2);
  width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:14px;
}
.close-x:hover{background:var(--gray-bg)}

.toast{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%) translateY(100px);z-index:400;
  padding:11px 20px;border-radius:9px;
  background:#111827;color:#fff;font-size:12.5px;font-weight:600;
  box-shadow:0 15px 40px -10px rgba(15,23,42,.4);
  transition:transform .3s cubic-bezier(.2,.9,.3,1.15);
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:#065f46}
.toast.err{background:#7f1d1d}

.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:12.5px;line-height:1.9}
.spin{width:24px;height:24px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

.mode-pill{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:99px;
  font-size:10.5px;font-weight:600;
  background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border);
}
.mode-pill.local{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}

/* ============ RESPONSIVE ============ */
@media(max-width:900px){
  .sidebar{
    position:fixed;top:0;right:0;
    height:100dvh;transform:translateX(100%);
    transition:transform .28s cubic-bezier(.2,.9,.3,1);
    box-shadow:-10px 0 40px -10px rgba(15,23,42,.2);
    width:250px;flex-basis:250px;z-index:55;
  }
  .sidebar.open{transform:translateX(0)}
  .icon-btn{display:grid}
  .content{padding:14px}
  .topbar{padding:10px 14px}
  .kpi .v{font-size:22px}
  .card{padding:14px}
}
@media(max-width:560px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cols2{grid-template-columns:1fr}
  .topbar h2{font-size:13.5px}
  .donut{width:130px;height:130px}
  .donut::before{inset:18px}
  .donut .mid b{font-size:20px}
  .modal-box{padding:16px}
  .cc-ev{-webkit-line-clamp:3}
}
@media(max-height:520px){
  .sidebar{overflow-y:auto}
  .nav{overflow:visible}
}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="bg-anim">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>
  <div class="login-card">
    <div class="logo">🛡️</div>
    <h1>سامانه پایش کنترل‌های امنیتی</h1>
    <p class="sub">مرکز مبادله ارز و طلای ایران — کاشف ۴۹۵</p>

    <div id="connBox" class="diag">
      <div><b>وضعیت اتصال:</b> <span id="connTxt">در حال بررسی…</span></div>
    </div>

    <form id="loginForm">
      <div class="field"><label>نام کاربری</label>
        <input id="luser" value="ice" required></div>
      <div class="field"><label>رمز عبور</label>
        <input id="lpass" type="password" value="ice" required></div>
      <button class="btn btn-primary btn-full" type="submit" id="loginBtn">ورود به سامانه</button>
      <div class="err" id="loginErr"></div>
    </form>

    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="btn btn-sm" id="retestBtn" style="flex:1">🔄 تست مجدد</button>
      <button class="btn btn-sm" id="localModeBtn" style="flex:1">💾 حالت محلی</button>
    </div>

    <div class="hint">کاربر پیش‌فرض: <b>ice</b> / رمز: <b>ice</b></div>
  </div>
</div>

<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="ic">🛡️</div><div><b>کاشف ۴۹۵</b><span>پایش کنترل‌های امنیتی</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="user-chip"><div class="av" id="avatar">I</div>
        <div style="min-width:0"><b id="uName">—</b><span id="uRole">—</span></div></div>
      <div id="modeIndicator" style="margin-bottom:8px"></div>
      <button class="btn btn-sm btn-full" id="logoutBtn">🚪 خروج</button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn">☰</button>
      <h2 id="pageTitle">داشبورد</h2>
      <div class="top-actions">
        <select id="globalPeriod" style="padding:8px 12px;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--txt);max-width:190px;font-size:12.5px;outline:none"></select>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div id="modalHost"></div>

function toast(msg, type='ok'){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show '+type;
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.className='toast '+type, 2600);
}
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function normalizeStatus(s){
  s = String(s||'');
  if(s.includes('عدم')) return 'عدم پیاده‌سازی';
  if(s.includes('غیر قابل')) return 'غیر قابل احراز';
  if(s.includes('در حال')) return 'در حال پیاده‌سازی';
  if(s.includes('پیاده')) return 'پیاده‌سازی';
  return 'عدم پیاده‌سازی';
}
function statusWeight(s){
  const n = normalizeStatus(s);
  if(n === 'پیاده‌سازی') return 100;
  if(n === 'در حال پیاده‌سازی') return 50;
  return 0;
}
function statusClass(s){
  const n = normalizeStatus(s);
  if(n === 'پیاده‌سازی') return 'st-ok';
  if(n === 'در حال پیاده‌سازی') return 'st-warn';
  if(n === 'غیر قابل احراز') return 'st-gray';
  return 'st-bad';
}

const LS = {
  read(k){ try { return JSON.parse(localStorage.getItem('kashaf_'+k) || 'null'); } catch(e){ return null; } },
  write(k,v){ localStorage.setItem('kashaf_'+k, JSON.stringify(v)); }
};
function uuid(){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
  const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);
});}

const LocalDB = {
  tables(){
    const t = LS.read('tables') || { users:[], controls:[], periods:[], assessments:[] };
    if(!t.users || !t.users.length){
      t.users = [{ id:uuid(), username:'ice', password_hash:null, full_name:'مدیر سامانه', role:'admin' }];
      LS.write('tables', t);
      sha256('ice').then(h => {
        const x = LS.read('tables') || t;
        x.users[0].password_hash = h;
        LS.write('tables', x);
      });
    }
    return t;
  },
  save(t){ LS.write('tables', t); },
  async findUser(username){ return this.tables().users.find(u => u.username === username) || null; },
  async addUser(u){ const t = this.tables(); t.users.push(u); this.save(t); },
  async delUser(id){ const t = this.tables(); t.users = t.users.filter(u=>u.id!==id); this.save(t); },
  async listUsers(){ return this.tables().users; },
  async listControls(){ return this.tables().controls; },
  async setControls(rows){
    const t = this.tables();
    t.controls = rows.map(r => ({ id: uuid(), ...r }));
    const ids = new Set(t.controls.map(c=>c.id));
    t.assessments = t.assessments.filter(a => ids.has(a.control_id));
    this.save(t);
  },
  async wipeControls(){ const t = this.tables(); t.controls=[]; t.assessments=[]; this.save(t); },
  async listPeriods(){ return this.tables().periods; },
  async addPeriod(p){ const t = this.tables(); const row = { id:uuid(), created_at:new Date().toISOString(), ...p }; t.periods.push(row); this.save(t); return row; },
  async delPeriod(id){ const t=this.tables(); t.periods=t.periods.filter(p=>p.id!==id); t.assessments=t.assessments.filter(a=>a.period_id!==id); this.save(t); },
  async listAssessments(pid){
    const t = this.tables();
    return pid ? t.assessments.filter(a=>a.period_id===pid) : t.assessments;
  },
  async upsertAssessment(a){
    const t = this.tables();
    const i = t.assessments.findIndex(x => x.period_id===a.period_id && x.control_id===a.control_id);
    if(i >= 0) t.assessments[i] = { ...t.assessments[i], ...a };
    else t.assessments.push({ id:uuid(), created_at:new Date().toISOString(), ...a });
    this.save(t);
    return t.assessments.find(x => x.period_id===a.period_id && x.control_id===a.control_id);
  }
};

async function testConnection(){
  const box = $('#connBox');
  const txt = document.getElementById('connTxt');
  if(!box || !txt || MODE === 'local') return;
  txt.textContent = 'در حال بررسی…';
  box.className = 'diag';
  if(!sb){ txt.textContent = 'کتابخانه Supabase بارگذاری نشد.'; box.className = 'diag err'; return; }
  const controller = new AbortController();
  const timer = setTimeout(()=> controller.abort(), 9000);
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_users?select=id&limit=1`, {
      method: 'GET',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
      signal: controller.signal
    });
    clearTimeout(timer);
    if(res.ok){ txt.innerHTML = '✅ اتصال به Supabase برقرار است.'; box.className = 'diag ok'; return true; }
    let body = ''; try{ body = await res.text(); }catch(e){}
    if(res.status === 404 || (body && body.includes('does not exist'))){
      txt.innerHTML = '⚠️ اتصال برقرار شد ولی <b>جداول ساخته نشده‌اند</b>. اسکریپت SQL را در Supabase اجرا کنید.';
      box.className = 'diag warn';
    } else if(res.status === 401 || res.status === 403){
      txt.innerHTML = '⚠️ کلید Supabase نامعتبر است.'; box.className = 'diag err';
    } else {
      txt.innerHTML = `⚠️ پاسخ سرور: ${res.status}`; box.className = 'diag warn';
    }
  }catch(err){
    clearTimeout(timer);
    const msg = String(err && err.message || err);
    if(msg.includes('abort') || msg.includes('Failed to fetch') || msg.includes('NetworkError') || msg.includes('timeout')){
      txt.innerHTML = `❌ <b>اتصال برقرار نشد</b>.<br>
        علت‌ها: (۱) پروژه در Supabase <b>Paused</b> است → Restore کنید،
        یا (۲) دسترسی به <code>supabase.co</code> مختل است.
        <br>می‌توانید روی «حالت محلی» بزنید.`;
      box.className = 'diag err';
    } else {
      txt.innerHTML = `❌ خطا: ${esc(msg)}`; box.className = 'diag err';
    }
  }
}

async function doLogin(username, password){
  const hash = await sha256(password);
  if(MODE === 'local'){
    const u = await LocalDB.findUser(username);
    if(!u) throw new Error('کاربر یافت نشد (حالت محلی).');
    if(u.password_hash && u.password_hash !== hash) throw new Error('رمز نادرست است.');
    return u;
  }
  let { data, error } = await sb.from('app_users').select('*').eq('username', username).limit(1);
  if(error){
    if(String(error.message).includes('does not exist'))
      throw new Error('جدول app_users وجود ندارد. اسکریپت SQL را در Supabase اجرا کنید.');
    if(String(error.message).includes('Failed to fetch'))
      throw new Error('اتصال به Supabase برقرار نشد. پروژه Paused است یا شبکه مسدود است.');
    throw new Error('خطا در اتصال: ' + error.message);
  }
  if(!data || !data.length){
    if(username === 'ice'){
      const { data:d2, error:e2 } = await sb.from('app_users').insert({
        username:'ice', password_hash: await sha256('ice'), full_name:'مدیر سامانه', role:'admin'
      }).select().single();
      if(e2) throw new Error('ساخت کاربر پیش‌فرض ناموفق: ' + e2.message);
      data = [d2];
    } else throw new Error('کاربر یافت نشد.');
  }
  if(data[0].password_hash !== hash) throw new Error('رمز عبور نادرست است.');
  return data[0];
}

async function apiListControls(){
  if(MODE === 'local') return LocalDB.listControls();
  const { data, error } = await sb.from('controls').select('*').order('row_no',{ascending:true});
  if(error) throw new Error('خطا در خواندن کنترل‌ها: ' + error.message);
  return data || [];
}
async function apiListPeriods(){
  if(MODE === 'local') return LocalDB.listPeriods();
  const { data, error } = await sb.from('periods').select('*').order('created_at',{ascending:true});
  if(error) throw new Error('خطا در خواندن دوره‌ها: ' + error.message);
  return data || [];
}
async function apiListAssessments(pid){
  if(MODE === 'local') return LocalDB.listAssessments(pid);
  let q = sb.from('assessments').select('*');
  if(pid) q = q.eq('period_id', pid);
  const { data, error } = await q;
  if(error) throw new Error('خطا در خواندن ارزیابی‌ها: ' + error.message);
  return data || [];
}
async function apiSaveAssessment(controlId, payload){
  if(MODE === 'local'){
    return LocalDB.upsertAssessment({ period_id:S.periodId, control_id:controlId, ...payload });
  }
  const existing = S.assessments[controlId];
  if(existing){
    const { data, error } = await sb.from('assessments').update(payload).eq('id', existing.id).select().single();
    if(error) throw new Error(error.message);
    return data;
  }
  const { data, error } = await sb.from('assessments').insert({ period_id:S.periodId, control_id:controlId, ...payload }).select().single();
  if(error) throw new Error(error.message);
  return data;
}
async function apiUpload(file, controlId){
  if(MODE === 'local'){
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res({ url:r.result, name:file.name });
      r.onerror = () => rej(new Error('خواندن فایل ممکن نشد'));
      r.readAsDataURL(file);
    });
  }
  const safe = file.name.replace(/[^\w.\-آ-ی]/g, '_');
  const path = `${S.periodId}/${controlId}/${Date.now()}_${safe}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { upsert:true });
  if(error) throw new Error('آپلود فایل ناموفق: ' + error.message);
  const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
  return { url: data.publicUrl, name: file.name };
}

async function loadControls(){
  S.controls = await apiListControls();
  S.units = [...new Set(S.controls.map(c=>c.owner_unit).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  S.cats  = [...new Set(S.controls.map(c=>c.category).filter(Boolean))];
  S.levels= [...new Set(S.controls.map(c=>c.level).filter(Boolean))];
}
async function loadPeriods(){
  S.periods = await apiListPeriods();
  if(S.periods.length && !S.periods.find(p=>p.id===S.periodId)){
    S.periodId = S.periods[0].id;
  }
}
async function loadAssessments(){
  S.assessments = {};
  if(!S.periodId) return;
  const rows = await apiListAssessments(S.periodId);
  rows.forEach(a => S.assessments[a.control_id] = a);
}
async function loadAllAssessments(){
  S.allAssessments = await apiListAssessments(null);
}

function controlStatus(c){
  const a = S.assessments[c.id];
  return (a && a.status) || c.status || '—';
}
function controlProgress(c){
  const a = S.assessments[c.id];
  if(a && a.progress !== null && a.progress !== undefined && a.progress !== '') return Number(a.progress);
  return statusWeight(controlStatus(c));
}
function assessmentMapFor(pid){
  const m = {};
  S.allAssessments.filter(a=>a.period_id===pid).forEach(a => m[a.control_id]=a);
  return m;
}
function progressWithMap(c, map){
  const a = map[c.id];
  if(a && a.progress !== null && a.progress !== undefined && a.progress !== '') return Number(a.progress);
  return statusWeight((a && a.status) || c.status);
}

async function bootApp(){
  const content = $('#content');
  content.innerHTML = `<div class="card"><div class="spin"></div><div class="empty">در حال بارگذاری…</div></div>`;
  try{
    await loadPeriods();
    await loadControls();
    await loadAssessments();
    if(!S.periods.length) S.view = 'periods';
    renderNav(); renderPeriodSelect(); render();
  }catch(err){
    content.innerHTML = `<div class="card">
      <h3><span class="dot" style="background:var(--bad)"></span> خطا در بارگذاری</h3>
      <div class="empty" style="text-align:right">${esc(err.message || err)}</div>
    </div>`;
  }
}

function renderNav(){
  $('#nav').innerHTML = NAV.map(n =>
    `<button data-view="${n.id}" class="${S.view===n.id?'active':''}">
      <span class="ic">${n.icon}</span><span>${n.label}</span></button>`).join('');
}
function renderPeriodSelect(){
  const sel = $('#globalPeriod');
  if(!S.periods.length){ sel.innerHTML = `<option value="">— بدون دوره —</option>`; sel.disabled = true; return; }
  sel.disabled = false;
  sel.innerHTML = S.periods.map(p =>
    `<option value="${p.id}" ${p.id===S.periodId?'selected':''}>${esc(p.name)}</option>`).join('');
}
function render(){
  $('#pageTitle').textContent = TITLES[S.view] || '';
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view===S.view));
  const c = $('#content');
  switch(S.view){
    case 'dashboard': c.innerHTML = viewDashboard(); break;
    case 'controls':  c.innerHTML = viewControls(); break;
    case 'assess':    c.innerHTML = viewAssess(); break;
    case 'trend':     c.innerHTML = viewTrend(); break;
    case 'periods':   c.innerHTML = viewPeriods(); break;
    case 'users':     c.innerHTML = viewUsers(); break;
    case 'import':    c.innerHTML = viewImport(); break;
  }
  bindView();
  if(S.view==='trend') ensureTrendData();
}

function viewDashboard(){
  const total = S.controls.length;
  const counts = {'پیاده‌سازی':0,'در حال پیاده‌سازی':0,'عدم پیاده‌سازی':0,'غیر قابل احراز':0};
  let sum = 0;
  S.controls.forEach(c => { counts[normalizeStatus(controlStatus(c))]++; sum += controlProgress(c); });
  const avg = total ? Math.round(sum/total) : 0;

  const byUnit = {};
  S.controls.forEach(c => {
    const u = c.owner_unit || 'نامشخص';
    if(!byUnit[u]) byUnit[u] = { n:0, sum:0, ok:0, doing:0, bad:0 };
    byUnit[u].n++; byUnit[u].sum += controlProgress(c);
    const ns = normalizeStatus(controlStatus(c));
    if(ns==='پیاده‌سازی') byUnit[u].ok++;
    else if(ns==='در حال پیاده‌سازی') byUnit[u].doing++;
    else byUnit[u].bad++;
  });
  const unitRows = Object.entries(byUnit).map(([k,v]) => ({
    name:k, n:v.n, ok:v.ok, doing:v.doing, bad:v.bad, pct: v.n?Math.round(v.sum/v.n):0
  })).sort((a,b)=>b.pct-a.pct);

  const byLevel = {};
  S.controls.forEach(c => {
    const l = c.level || 'نامشخص';
    if(!byLevel[l]) byLevel[l] = { n:0, sum:0 };
    byLevel[l].n++; byLevel[l].sum += controlProgress(c);
  });

  const byCat = {};
  S.controls.forEach(c => {
    const k = c.category || 'نامشخص';
    if(!byCat[k]) byCat[k] = { n:0, sum:0 };
    byCat[k].n++; byCat[k].sum += controlProgress(c);
  });
  const catRows = Object.entries(byCat).map(([k,v]) => ({
    name:k, n:v.n, pct: v.n?Math.round(v.sum/v.n):0
  })).sort((a,b)=>b.pct-a.pct);

  const segs = [
    {label:'پیاده‌سازی شده', val:counts['پیاده‌سازی'], color:'#16a34a'},
    {label:'در حال پیاده‌سازی', val:counts['در حال پیاده‌سازی'], color:'#d97706'},
    {label:'عدم پیاده‌سازی', val:counts['عدم پیاده‌سازی'], color:'#dc2626'},
    {label:'غیر قابل احراز', val:counts['غیر قابل احراز'], color:'#64748b'}
  ];
  let acc = 0;
  const grad = segs.map(s => {
    const from = total?acc/total*360:0; acc += s.val;
    const to = total?acc/total*360:0;
    return `${s.color} ${from}deg ${to}deg`;
  }).join(',');

  const periodName = (S.periods.find(p=>p.id===S.periodId)||{}).name || 'بدون دوره';

  return `<div class="grid" style="gap:12px">
    <div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px">
      <span class="badge badge-soft">دوره: ${esc(periodName)}</span>
      <span class="badge badge-soft">کنترل: ${fa(total)}</span>
      <span class="badge badge-soft">واحد: ${fa(unitRows.length)}</span>
      <span class="mode-pill ${MODE==='local'?'local':''}" style="margin-right:auto">${MODE==='local'?'💾 محلی':'☁️ Supabase'}</span>
    </div>

    <div class="grid kpis">
      <div class="card kpi"><div class="v">${fa(avg)}٪</div><div class="l">پیشرفت کل</div>
        <div class="bar g" style="margin-top:10px"><i style="width:${avg}%"></i></div></div>
      <div class="card kpi"><div class="v" style="color:var(--ok)">${fa(counts['پیاده‌سازی'])}</div><div class="l">پیاده‌سازی شده</div></div>
      <div class="card kpi"><div class="v" style="color:var(--warn)">${fa(counts['در حال پیاده‌سازی'])}</div><div class="l">در حال انجام</div></div>
      <div class="card kpi"><div class="v" style="color:var(--bad)">${fa(counts['عدم پیاده‌سازی'])}</div><div class="l">عدم پیاده‌سازی</div></div>
    </div>

    <div class="grid cols2">
      <div class="card">
        <h3><span class="dot"></span> توزیع وضعیت</h3>
        <div class="donut-wrap">
          <div class="donut" style="background:conic-gradient(${grad||'#e2e8f0 0deg 360deg'})">
            <div class="mid"><b>${fa(total)}</b><span>کنترل</span></div>
          </div>
          <div class="legend">
            ${segs.map(s=>`<div><i style="background:${s.color}"></i>${s.label}<b>${fa(s.val)}</b></div>`).join('')}
          </div>
        </div>
      </div>
      <div class="card">
        <h3><span class="dot"></span> پیشرفت به تفکیک سطح</h3>
        ${Object.keys(byLevel).length ? Object.entries(byLevel).map(([k,v])=>{
          const pct = v.n?Math.round(v.sum/v.n):0;
          return `<div class="bar-row"><div><div class="nm">${esc(k)} (${fa(v.n)})</div>
            <div class="bar"><i style="width:${pct}%"></i></div></div>
            <div class="pc">${fa(pct)}٪</div></div>`;
        }).join('') : '<div class="empty">—</div>'}
      </div>
    </div>

    <div class="card">

function filteredControls(){
  const f = S.filters;
  return S.controls.filter(c => {
    if(f.unit && c.owner_unit!==f.unit) return false;
    if(f.cat && c.category!==f.cat) return false;
    if(f.level && c.level!==f.level) return false;
    if(f.status && normalizeStatus(controlStatus(c))!==f.status) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = `${c.title||''} ${c.evidence||''} ${c.owner_unit||''} ${c.category||''} ${c.row_no||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function lineChart(series){
  if(!series.length) return '<div class="empty">—</div>';
  const W=640, H=240, PAD=38, n=series.length;
  const xs = i => n===1?W/2:PAD+i*(W-2*PAD)/(n-1);
  const ys = v => H-PAD-(v/100)*(H-2*PAD);
  const path = series.map((s,i)=>`${i?'L':'M'}${xs(i).toFixed(1)},${ys(s.value).toFixed(1)}`).join(' ');
  const area = `${path} L${xs(n-1).toFixed(1)},${H-PAD} L${xs(0).toFixed(1)},${H-PAD} Z`;
  return `<div style="width:100%;overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:340px;height:auto">
    <defs>
      <linearGradient id="gline" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#93c5fd" stop-opacity=".45"/><stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#2563eb"/>
      </linearGradient>
    </defs>
    ${[0,25,50,75,100].map(v=>`
      <line x1="${PAD}" y1="${ys(v)}" x2="${W-PAD}" y2="${ys(v)}" stroke="rgba(15,23,42,.06)" stroke-width="1"/>
      <text x="${PAD-8}" y="${ys(v)+4}" fill="#94a3b8" font-size="10" text-anchor="end">${v}%</text>`).join('')}
    <path d="${area}" fill="url(#gline)"/>
    <path d="${path}" fill="none" stroke="url(#stroke)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${series.map((s,i)=>`
      <circle cx="${xs(i)}" cy="${ys(s.value)}" r="4.5" fill="#fff" stroke="#2563eb" stroke-width="2.5"/>
      <text x="${xs(i)}" y="${ys(s.value)-13}" fill="#111827" font-size="11" font-weight="700" text-anchor="middle">${fa(s.value)}٪</text>
      <text x="${xs(i)}" y="${H-12}" fill="#64748b" font-size="10" text-anchor="middle">${esc(s.name.length>16?s.name.slice(0,16)+'…':s.name)}</text>`).join('')}
  </svg></div>`;
}

function bindView(){
  const c = $('#content');
  if(S.view==='controls'){
    const rebind = () => { c.innerHTML = viewControls(); bindView(); };
    $('#fQ')?.addEventListener('input', e => { S.filters.q = e.target.value; S.page = 1; c.innerHTML = viewControls(); bindView(); const el = $('#fQ'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); });
    $('#fUnit')?.addEventListener('change', e => { S.filters.unit = e.target.value; S.page = 1; rebind(); });
    $('#fStatus')?.addEventListener('change', e => { S.filters.status = e.target.value; S.page = 1; rebind(); });
    $('#fCat')?.addEventListener('change', e => { S.filters.cat = e.target.value; S.page = 1; rebind(); });
    $('#fLevel')?.addEventListener('change', e => { S.filters.level = e.target.value; S.page = 1; rebind(); });
    $('#fSize')?.addEventListener('change', e => { S.pageSize = Number(e.target.value); S.page = 1; rebind(); });
    $('#clearFilters')?.addEventListener('click', () => { S.filters = {q:'',unit:'',status:'',cat:'',level:''}; S.page = 1; rebind(); });
    c.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => { S.page = Number(b.dataset.page); rebind(); window.scrollTo({top:0,behavior:'smooth'}); }));
    c.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openControlModal(el.dataset.open)));
  }
  if(S.view==='assess'){
    $('#asUnit')?.addEventListener('change', e => { S.assessUnit = e.target.value; c.innerHTML = viewAssess(); bindView(); });
    c.querySelectorAll('.as-item').forEach(item => {
      const cid = item.dataset.cid;
      const range = item.querySelector('.a-range');
      const pval = item.querySelector('.p-val');
      const statusSel = item.querySelector('.a-status');
      range.addEventListener('input', () => { pval.textContent = fa(range.value)+'٪'; });
      statusSel.addEventListener('change', () => { const w = statusWeight(statusSel.value); range.value = w; pval.textContent = fa(w)+'٪'; });
      item.querySelector('.a-save').addEventListener('click', async ev => {
        const btn = ev.currentTarget; btn.disabled = true; btn.textContent = 'در حال ذخیره…';
        try{
          const payload = {
            status: statusSel.value,
            progress: Number(range.value),
            actions: item.querySelector('.a-actions').value.trim(),
            updated_by: S.user?.username || '',
            updated_at: new Date().toISOString()
          };
          const fi = item.querySelector('.a-file');
          if(fi.files && fi.files[0]){
            const up = await apiUpload(fi.files[0], cid);
            payload.file_url = up.url; payload.file_name = up.name;
          }
          const saved = await apiSaveAssessment(cid, payload);
          S.assessments[cid] = saved;
          const s = item.querySelector('.saved'); s.style.display = 'inline'; setTimeout(()=>s.style.display='none', 2000);
          toast('ذخیره شد ✔','ok');
        }catch(err){ toast('خطا: '+err.message,'err'); }
        finally{ btn.disabled = false; btn.textContent = '💾 ذخیره'; }
      });
    });
  }
  if(S.view==='trend'){
    $('#trendUnit')?.addEventListener('change', e => { S._trendUnit = e.target.value; c.innerHTML = viewTrend(); bindView(); });
  }
  if(S.view==='periods'){
    $('#addPeriod')?.addEventListener('click', async () => {
      const name = ($('#pName').value||'').trim();
      if(!name) return toast('نام دوره را وارد کنید','err');
      try{
        let row;
        if(MODE==='local'){
          row = await LocalDB.addPeriod({ name, start_date:$('#pStart').value||null, end_date:$('#pEnd').value||null });
        } else {
          const { data, error } = await sb.from('periods').insert({ name, start_date:$('#pStart').value||null, end_date:$('#pEnd').value||null }).select().single();
          if(error) throw error; row = data;
        }
        await loadPeriods();
        S.periodId = row.id;
        renderPeriodSelect(); await loadAssessments();
        toast('دوره ایجاد شد ✔','ok');
        c.innerHTML = viewPeriods(); bindView();
      }catch(err){ toast('خطا: '+err.message,'err'); }
    });
    c.querySelectorAll('[data-selperiod]').forEach(b => b.addEventListener('click', async () => {
      S.periodId = b.dataset.selperiod; renderPeriodSelect(); await loadAssessments();
      toast('دوره انتخاب شد','ok'); c.innerHTML = viewPeriods(); bindView();
    }));
    c.querySelectorAll('[data-delperiod]').forEach(b => b.addEventListener('click', async () => {
      if(!confirm('حذف دوره و ارزیابی‌های آن؟')) return;
      try{
        if(MODE==='local') await LocalDB.delPeriod(b.dataset.delperiod);
        else { const { error } = await sb.from('periods').delete().eq('id', b.dataset.delperiod); if(error) throw error; }
        await loadPeriods(); if(!S.periods.find(p=>p.id===S.periodId)) S.periodId = S.periods[0]?.id || null;
        renderPeriodSelect(); await loadAssessments();
        toast('حذف شد','ok'); c.innerHTML = viewPeriods(); bindView();
      }catch(err){ toast('خطا: '+err.message,'err'); }
    }));
  }
  if(S.view==='users'){
    renderUsersList().then(() => {
      document.querySelectorAll('[data-deluser]').forEach(b => b.addEventListener('click', async () => {
        if(!confirm('حذف کاربر؟')) return;
        try{
          if(MODE==='local') await LocalDB.delUser(b.dataset.deluser);
          else { const { error } = await sb.from('app_users').delete().eq('id', b.dataset.deluser); if(error) throw error; }
          toast('حذف شد','ok'); renderUsersList();
        }catch(err){ toast('خطا: '+err.message,'err'); }
      }));
    });
    $('#addUser')?.addEventListener('click', async () => {
      const u = ($('#nuUser').value||'').trim(), p = ($('#nuPass').value||'').trim(), n = ($('#nuName').value||'').trim(), r = $('#nuRole').value;
      if(!u || !p) return toast('نام کاربری و رمز الزامی است','err');
      try{
        const hash = await sha256(p);
        if(MODE==='local'){
          if(await LocalDB.findUser(u)) throw new Error('کاربر تکراری است');
          await LocalDB.addUser({ id:uuid(), username:u, password_hash:hash, full_name:n, role:r });
        } else {
          const { error } = await sb.from('app_users').insert({ username:u, password_hash:hash, full_name:n, role:r });
          if(error) throw error;
        }
        toast('کاربر اضافه شد ✔','ok');
        $('#nuUser').value = ''; $('#nuPass').value = ''; $('#nuName').value = '';
        renderUsersList();
      }catch(err){ toast('خطا: '+err.message,'err'); }
    });
  }
  if(S.view==='import'){
    $('#wipeControls')?.addEventListener('click', async () => {
      if(!confirm('همه کنترل‌ها و ارزیابی‌های مرتبط حذف شوند؟')) return;
      try{
        if(MODE==='local') await LocalDB.wipeControls();
        else { const { error } = await sb.from('controls').delete().not('id','is',null); if(error) throw error; }
        await loadControls(); toast('حذف شد','ok'); c.innerHTML = viewImport(); bindView();
      }catch(err){ toast('خطا: '+err.message,'err'); }
    });
    $('#doImport')?.addEventListener('click', async () => {
      const file = $('#xlsFile').files[0]; const log = $('#importLog');
      if(!file) return toast('فایل را انتخاب کنید','err');
      log.textContent = 'در حال خواندن…';
      try{
        const rows = await parseSheet(file);
        if(!rows.length) throw new Error('فایل خالی است');
        const mapped = rows.map(r => {
          const g = (...names) => {
            for(const n of names){
              const key = Object.keys(r).find(k => String(k).trim()===n);
              if(key!==undefined && String(r[key]).trim()!=='') return String(r[key]).trim();
            }
            return '';
          };
          return {
            row_no: Number(g('ردیف'))||null,
            category: g('دسته')||null,
            level: g('سطح پیشرفتگی')||null,
            title: g('کنترل')||'',
            evidence: g('شواهد')||'',
            status: g('وضعیت پیاده‌سازی')||null,
            owner_unit: g('واحد مسئول رسیدگی')||null
          };
        }).filter(x=>x.title);
        if(!mapped.length) throw new Error('ستون‌ها شناسایی نشدند.');
        log.textContent = `${fa(mapped.length)} رکورد. در حال بارگذاری…`;
        if(MODE==='local'){
          await LocalDB.setControls(mapped);
        } else {
          const del = await sb.from('controls').delete().not('id','is',null);
          if(del.error) throw del.error;
          const CH = 100;
          for(let i = 0; i < mapped.length; i += CH){
            const part = mapped.slice(i, i+CH);
            const { error } = await sb.from('controls').insert(part);
            if(error) throw error;
            log.textContent = `${fa(Math.min(i+CH, mapped.length))} از ${fa(mapped.length)}`;
          }
        }
        await loadControls();
        log.innerHTML = `<span style="color:var(--ok);font-weight:700">✔ ${fa(mapped.length)} کنترل بارگذاری شد.</span>`;
        toast('بارگذاری کامل شد ✔','ok'); render();
      }catch(err){
        log.innerHTML = `<span style="color:var(--bad)">خطا: ${esc(err.message||err)}</span>`;
        toast('خطا در بارگذاری','err');
      }
    });
  }
}
function parseSheet(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        res(XLSX.utils.sheet_to_json(ws, { defval:'', raw:false }));
      }catch(err){ rej(err); }
    };
    r.onerror = () => rej(new Error('خواندن فایل ناموفق'));
    r.readAsArrayBuffer(file);
  });
}

function openControlModal(id){
  const c = S.controls.find(x=>x.id===id); if(!c) return;
  const a = S.assessments[c.id] || {};
  const st = controlStatus(c), pr = controlProgress(c);
  const periodName = (S.periods.find(p=>p.id===S.periodId)||{}).name || '—';
  $('#modalHost').innerHTML = `<div class="modal" id="modalBg"><div class="modal-box">
    <button class="close-x" id="closeModal">✕</button>
    <h3>#${fa(c.row_no??'')} — ${esc(c.title)}</h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      <span class="badge badge-soft">${esc(c.category||'—')}</span>
      <span class="badge badge-soft">سطح: ${esc(c.level||'—')}</span>
      <span class="badge ${statusClass(st)}">${esc(normalizeStatus(st))}</span>
      <span class="badge badge-soft">${esc(c.owner_unit||'—')}</span>
    </div>
    <div class="kv"><div class="k">متن کنترل</div><div class="v">${esc(c.title)}</div></div>
    <div class="kv"><div class="k">شواهد ارزیابی</div><div class="v">${esc(c.evidence||'—')}</div></div>
    <div class="kv"><div class="k">وضعیت دوره «${esc(periodName)}»</div>
      <div class="v" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="badge ${statusClass(st)}">${esc(normalizeStatus(st))}</span>
        <div class="bar" style="flex:1;min-width:120px"><i style="width:${pr}%"></i></div>
        <b style="color:var(--accent)">${fa(pr)}٪</b>
      </div></div>
    ${a.actions?`<div class="kv"><div class="k">اقدامات این دوره</div><div class="v">${esc(a.actions)}</div></div>`:''}
    ${a.file_url?`<div class="kv"><div class="k">پیوست</div><div class="v"><a href="${esc(a.file_url)}" target="_blank" rel="noopener">📎 ${esc(a.file_name||'دانلود')}</a></div></div>`:''}
    <button class="btn btn-primary btn-full" id="goAssess" style="margin-top:8px">✏️ فرم ارزیابی این واحد</button>
  </div></div>`;
  const close = () => $('#modalHost').innerHTML = '';
  $('#closeModal').addEventListener('click', close);
  $('#modalBg').addEventListener('click', e => { if(e.target.id==='modalBg') close(); });
  $('#goAssess').addEventListener('click', () => { S.assessUnit = c.owner_unit||''; S.view = 'assess'; close(); render(); });
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), err = $('#loginErr');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'در حال بررسی…';
  try{
    const u = await doLogin($('#luser').value.trim(), $('#lpass').value);
    startSession(u);
  }catch(ex){ err.textContent = ex.message || 'ورود ناموفق'; }
  finally{ btn.disabled = false; btn.textContent = 'ورود به سامانه'; }
});

$('#retestBtn').addEventListener('click', async () => {
  if(MODE==='local'){ setMode('supabase'); } else { await testConnection(); }
});
$('#localModeBtn').addEventListener('click', () => {
  setMode('local');
  toast('حالت محلی فعال — داده‌ها در مرورگر ذخیره می‌شوند','ok');
});
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]'); if(!b) return;
  S.view = b.dataset.view;
  $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show');
  render();
});
$('#globalPeriod').addEventListener('change', async e => {
  S.periodId = e.target.value || null;
  await loadAssessments();
  toast('دوره تغییر کرد','ok'); render();
});
$('#menuBtn').addEventListener('click', () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); });
$('#overlay').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); });
$('#logoutBtn').addEventListener('click', logout);
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); $('#modalHost').innerHTML=''; }
});

updateConnBox();
</script>
