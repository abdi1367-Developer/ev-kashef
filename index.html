*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;height:100dvh;overflow:hidden}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg-main);color:var(--txt);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;transition:background .25s,color .25s}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2)}
a{color:var(--txt);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
.hidden{display:none!important}

/* LOGIN */
.login-wrap{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;z-index:200;padding:16px;background:var(--bg-main)}
.bg-anim{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(var(--faint) 1px,transparent 1px),linear-gradient(90deg,var(--faint) 1px,transparent 1px);background-size:48px 48px;opacity:.8}
.rotor{position:absolute;border:1px solid var(--faint);top:50%;left:50%;pointer-events:none}
.rotor-a{width:56vmin;height:56vmin;animation:rot 180s linear infinite}
.rotor-b{width:34vmin;height:34vmin;border-style:dashed;border-color:var(--line);animation:rot 240s linear infinite reverse}
.rotor-c{width:80vmin;height:80vmin;animation:rot 320s linear infinite}
@keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.b1{width:44vw;height:44vw;min-width:300px;min-height:300px;background:var(--blob-1);top:-10%;right:-8%;animation:float 19s ease-in-out infinite}
.b2{width:38vw;height:38vw;min-width:280px;min-height:280px;background:var(--blob-2);bottom:-12%;left:-8%;animation:float 23s ease-in-out infinite reverse}
.b3{width:30vw;height:30vw;min-width:240px;min-height:240px;background:var(--blob-3);top:42%;left:38%;opacity:.4;animation:float 27s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(-7%,9%,0) scale(1.1)}66%{transform:translate3d(9%,-7%,0) scale(.95)}}
.login-card{position:relative;z-index:3;width:min(380px,94vw);padding:36px 28px 28px;background:var(--white);border:1px solid var(--txt);animation:pop .5s ease;transition:background .25s,border-color .25s}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.login-theme{position:absolute;top:12px;left:12px;padding:5px 10px;border:1px solid var(--txt);background:transparent;color:var(--txt);cursor:pointer;font-size:10px;font-weight:500;letter-spacing:.06em;font-family:inherit}
.login-theme:hover{background:var(--faint)}
.kashaf{font-size:11px;font-weight:600;letter-spacing:.32em;text-align:center;text-transform:uppercase;margin-bottom:14px}
.kashaf-rule{height:1px;background:var(--txt);margin-bottom:22px}
.login-card h1{font-size:15px;font-weight:600;margin:0 0 4px;text-align:center}
.login-card .sub{margin:0 0 26px;text-align:center;color:var(--muted);font-size:11.5px}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px;letter-spacing:.15em;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--txt);background:var(--white);color:var(--txt);outline:none;font-size:13px;border-radius:0;font-variant-numeric:tabular-nums}
.field input:focus,.field select:focus,.field textarea:focus{background:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:1px solid var(--txt);background:var(--white);color:var(--txt);cursor:pointer;font-weight:500;font-size:12.5px;transition:.12s;border-radius:0}
.btn:hover{background:var(--faint)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--txt);color:var(--white);border-color:var(--txt)}
.btn-primary:hover{background:var(--txt2);border-color:var(--txt2)}
.btn-full{width:100%;padding:12px}
.btn-sm{padding:6px 10px;font-size:11.5px}
.err{color:var(--txt);font-size:11.5px;text-align:center;margin-top:10px;min-height:14px;font-weight:500}
.diag{margin:0 0 16px;padding:9px 11px;border:1px solid var(--line);background:var(--faint);font-size:10.5px;line-height:1.7;color:var(--muted)}
.diag.ok{background:var(--white);border-color:var(--txt)}
.diag.err{background:var(--white);border-color:var(--txt);border-style:dashed}
.diag.warn{background:var(--white);border-color:var(--line2)}
.diag b{color:var(--txt);font-weight:600}
.hint{text-align:center;color:var(--dim);font-size:10.5px;margin-top:16px;letter-spacing:.06em;padding-top:16px;border-top:1px solid var(--line)}
.hint b{color:var(--txt);font-weight:600}
.mode-toggle{display:flex;margin-top:12px;border:1px solid var(--txt)}
.mode-toggle button{flex:1;padding:8px 6px;font-size:10.5px;background:var(--white);color:var(--txt);border:none;cursor:pointer;letter-spacing:.05em;font-weight:500}
.mode-toggle button:first-child{border-left:1px solid var(--txt)}
.mode-toggle button:hover{background:var(--faint)}

/* APP */
#app{height:100vh;height:100dvh;display:block}
.sidebar{position:fixed;top:0;right:0;width:220px;height:100vh;height:100dvh;z-index:50;background:var(--bg-side);border-left:1px solid var(--txt);display:flex;flex-direction:column;padding:22px 14px;overflow:hidden;transition:background .25s,border-color .25s}
.brand{padding:0 6px 18px;border-bottom:1px solid var(--txt);margin-bottom:18px;flex-shrink:0}
.brand b{display:block;font-size:13px;font-weight:600;letter-spacing:.16em;margin-bottom:4px}
.brand span{display:block;font-size:10px;color:var(--muted);letter-spacing:.06em}
.nav{display:flex;flex-direction:column;gap:0;flex:1;min-height:0;overflow:hidden}
.nav button{display:flex;align-items:center;width:100%;padding:9px 10px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-weight:500;font-size:12px;text-align:right;transition:.12s;border-right:2px solid transparent;padding-right:8px;flex-shrink:0}
.nav button:hover{color:var(--txt);background:var(--faint)}
.nav button.active{color:var(--txt);font-weight:600;border-right-color:var(--accent);background:var(--faint)}
.side-foot{border-top:1px solid var(--txt);padding-top:14px;margin-top:14px;flex-shrink:0}
.user-chip{display:flex;align-items:center;gap:9px;padding:8px 4px;margin-bottom:10px}
.user-chip .av{width:26px;height:26px;border:1px solid var(--txt);display:grid;place-items:center;font-weight:600;font-size:10px;flex:0 0 auto;background:var(--faint)}
.user-chip b{display:block;font-size:11.5px;font-weight:600;line-height:1.25}
.user-chip span{display:block;font-size:9.5px;color:var(--muted);margin-top:2px;letter-spacing:.06em}
.mode-line{display:flex;align-items:center;gap:6px;padding:6px 4px;margin-bottom:8px;font-size:9.5px;color:var(--muted);letter-spacing:.14em;font-weight:500}
.mode-line::before{content:'';width:6px;height:6px;background:var(--txt);flex:0 0 auto}
.mode-line.local::before{background:var(--dim)}
.side-foot .btn{padding:7px;font-size:11px;letter-spacing:.08em}

.main{margin-right:220px;height:100vh;height:100dvh;display:flex;flex-direction:column;min-height:0}
.topbar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:16px 24px;background:var(--bg-top);border-bottom:1px solid var(--txt);z-index:30;transition:background .25s,border-color .25s}
.topbar h2{margin:0;font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.06em}
.icon-btn{width:34px;height:34px;border:1px solid var(--txt);background:var(--white);color:var(--txt);cursor:pointer;display:none;place-items:center;font-size:15px;flex:0 0 auto}
.icon-btn:hover{background:var(--faint)}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.top-actions select{padding:8px 11px;border:1px solid var(--txt);background:var(--white);color:var(--txt);outline:none;font-size:11.5px;max-width:200px;font-variant-numeric:tabular-nums}
.theme-btn{padding:8px 12px;border:1px solid var(--txt);background:var(--white);color:var(--txt);cursor:pointer;font-size:11px;font-weight:500;letter-spacing:.04em;font-family:inherit;transition:.12s;display:inline-flex;align-items:center;gap:6px}
.theme-btn:hover{background:var(--faint)}
.theme-btn::after{content:'▾';font-size:9px;opacity:.7}
.theme-btn::before{content:'';width:12px;height:12px;border-radius:2px;background:linear-gradient(135deg,var(--accent) 0%,var(--accent) 50%,var(--bg-main) 50%,var(--bg-main) 100%);border:1px solid var(--line2)}
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:24px;width:100%;min-width:0}
.overlay{position:fixed;inset:0;background:var(--overlay-bg);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}

/* COMPONENTS */
.grid{display:grid;gap:16px;width:100%}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--white);border:1px solid var(--txt);padding:20px;min-width:0;transition:background .25s,border-color .25s}
body[class*="theme-"] .card{border-color:var(--ctrl-border)}
.card h3{margin:0 0 16px;font-size:10.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;letter-spacing:.16em;padding-bottom:12px;border-bottom:1px solid var(--line)}
.card h3 .dot{width:5px;height:5px;background:var(--txt);flex:0 0 auto}
body[class*="theme-"] .card h3 .dot{background:var(--accent)}
.kpi .v{font-size:32px;font-weight:600;line-height:1;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:10px;margin-top:8px;letter-spacing:.14em;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:10px;white-space:nowrap;font-weight:500;letter-spacing:.06em;border:1px solid transparent}
.st-ok{background:var(--st-ok-bg);color:var(--st-ok-fg);border-color:var(--st-ok-border)}
.st-warn{background:var(--st-warn-bg);color:var(--st-warn-fg);border-color:var(--st-warn-border)}
.st-bad{background:var(--st-bad-bg);color:var(--st-bad-fg);border-color:var(--st-bad-border);border-style:dashed}
.st-gray{background:var(--st-gray-bg);color:var(--st-gray-fg);border-color:var(--st-gray-border)}
.badge-soft{background:var(--faint);color:var(--muted);border-color:var(--line)}
.badge-first{background:var(--badge-first-bg);color:var(--badge-first-fg);border-color:var(--badge-first-bg);letter-spacing:.1em}
.bar-row{display:grid;grid-template-columns:1fr 42px;gap:12px;align-items:center;margin:10px 0}
.bar-row .nm{font-size:11.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .pc{font-size:11px;font-weight:600;text-align:left}
.bar{height:4px;background:var(--faint);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--bar-fill);transition:width .6s cubic-bezier(.2,.9,.3,1)}
.bar.g>i{background:var(--bar-ok)}
.bar.w>i{background:var(--bar-warn)}
.bar.b>i{background:var(--bar-bad)}
.donut-wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center}
.donut{width:150px;height:150px;border-radius:50%;position:relative;display:grid;place-items:center;flex:0 0 auto}
.donut::before{content:'';position:absolute;inset:22px;border-radius:50%;background:var(--white)}
.donut .mid{position:relative;z-index:2;text-align:center}
.donut .mid b{display:block;font-size:26px;font-weight:600;line-height:1;letter-spacing:-.03em}
.donut .mid span{font-size:9.5px;color:var(--muted);margin-top:4px;letter-spacing:.14em;display:block;font-weight:500}
.legend{display:flex;flex-direction:column;gap:10px;min-width:160px}
.legend div{display:flex;align-items:center;gap:10px;font-size:11px}
.legend i{width:8px;height:8px;flex:0 0 auto;border:1px solid var(--line2)}
.legend b{margin-right:auto;font-weight:600}
.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.toolbar input,.toolbar select{padding:9px 11px;border:1px solid var(--txt);background:var(--white);color:var(--txt);outline:none;width:100%;font-size:11.5px;font-variant-numeric:tabular-nums}
.toolbar input:focus,.toolbar select:focus{background:var(--faint)}
.toolbar input::placeholder{color:var(--dim)}
.list{display:grid;gap:10px}
.ctrl{background:var(--white);border:1px solid var(--ctrl-border);padding:14px 16px;cursor:pointer;transition:border-color .12s,background .25s;min-width:0;position:relative}
.ctrl:hover{border-color:var(--ctrl-hover)}
.cc-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px;padding-left:30px}
.cc-no{font-size:10px;color:var(--muted);font-weight:500;margin-right:auto;letter-spacing:.08em}
.cc-title{font-size:12.5px;line-height:1.85;font-weight:500;margin-bottom:8px}
.cc-ev{font-size:11px;line-height:1.85;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-foot{margin-top:12px;display:flex;align-items:center;gap:12px}
.cc-foot .bar{flex:1;margin:0}
.cc-foot b{font-size:10.5px;min-width:38px;text-align:left;font-weight:600}
.del-btn{position:absolute;top:12px;left:12px;width:22px;height:22px;border:1px solid var(--line2);background:var(--white);cursor:pointer;font-size:12px;line-height:1;color:var(--muted);display:grid;place-items:center}
.del-btn:hover{background:var(--faint);border-color:var(--txt);color:var(--txt)}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;flex-wrap:wrap}
.pager .info{color:var(--muted);font-size:10.5px;padding:0 8px;letter-spacing:.06em}
.tbl-wrap{overflow-x:auto;width:100%}
table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:520px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:9.5px;background:var(--th-bg);white-space:nowrap;letter-spacing:.14em;border-bottom:1px solid var(--th-border)}
tbody tr:hover{background:var(--tr-hover)}
tbody td{font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:16px;background:var(--overlay-bg);animation:fade .18s;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{width:min(760px,100%);max-height:88dvh;overflow:auto;border:1px solid var(--txt);background:var(--white);padding:24px;animation:pop .2s ease;margin:auto}
.modal-box h3{margin:0 0 16px;font-size:13px;font-weight:600;line-height:1.9;padding-bottom:12px;border-bottom:1px solid var(--line)}
.kv{margin-bottom:14px}
.kv .k{font-size:9.5px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.14em}
.kv .v{font-size:12px;line-height:1.95;background:var(--faint);padding:11px 13px;border:1px solid var(--line);white-space:pre-wrap}
.close-x{position:sticky;top:0;float:left;background:var(--white);color:var(--txt);border:1px solid var(--txt);width:28px;height:28px;cursor:pointer;font-size:14px;line-height:1}
.close-x:hover{background:var(--faint)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(100px);z-index:400;padding:10px 20px;background:var(--toast-bg);color:var(--white);font-size:11px;font-weight:500;letter-spacing:.08em;transition:transform .3s cubic-bezier(.2,.9,.3,1.15)}
.toast.show{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:48px 16px;color:var(--muted);font-size:11.5px;line-height:1.9;letter-spacing:.04em}
.spin{width:22px;height:22px;border:1.5px solid var(--line);border-top-color:var(--txt);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

.date-field{position:relative}
.date-input{padding-left:36px !important;cursor:pointer;caret-color:transparent}
.date-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none;color:var(--muted)}

.date-picker{position:fixed;inset:0;z-index:600;display:grid;place-items:center;padding:16px;background:var(--overlay-bg);animation:fade .15s}
.date-picker-box{width:min(340px,100%);background:var(--white);border:1px solid var(--txt);padding:20px;animation:pop .2s ease;max-height:92dvh;overflow-y:auto}
.dp-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line);gap:8px}
.dp-title{font-size:12.5px;font-weight:600;letter-spacing:.02em;text-align:center;flex:1;white-space:nowrap}
.dp-nav{display:flex;gap:3px;flex-shrink:0}
.dp-nav button{width:26px;height:26px;border:1px solid var(--line2);background:var(--white);cursor:pointer;font-size:12px;display:grid;place-items:center;color:var(--txt);font-family:inherit}
.dp-nav button:hover{background:var(--faint);border-color:var(--txt)}
.dp-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px}
.dp-weekdays span{text-align:center;font-size:9.5px;color:var(--muted);font-weight:600;padding:4px 0;letter-spacing:.06em}
.dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-day{aspect-ratio:1;border:1px solid transparent;background:var(--white);cursor:pointer;font-size:11.5px;display:grid;place-items:center;font-variant-numeric:tabular-nums;color:var(--txt);font-family:inherit;padding:0}
.dp-day:hover{background:var(--faint);border-color:var(--line2)}
.dp-day.today{font-weight:700;border-color:var(--line2)}
.dp-day.selected{background:var(--accent);color:var(--white);border-color:var(--accent);font-weight:600}
.dp-day.empty{cursor:default;background:transparent;border-color:transparent}
.dp-day.empty:hover{background:transparent;border-color:transparent}
.dp-foot{display:flex;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dp-foot button{flex:1;padding:8px;border:1px solid var(--txt);background:var(--white);cursor:pointer;font-size:11px;font-weight:500;font-family:inherit;color:var(--txt)}
.dp-foot button:hover{background:var(--faint)}
.dp-foot button.primary{background:var(--accent);color:var(--white);border-color:var(--accent)}

.ro-notice{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-size:10px;font-weight:600;letter-spacing:.08em;border:1px solid var(--line2);background:var(--faint);color:var(--muted)}

.user-modal{display:flex;flex-direction:column;max-height:90dvh;padding:0 !important;overflow:hidden}
.um-head{padding:16px 22px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0}
.um-head h3{margin:0 !important;padding:0 !important;border:0 !important;font-size:13px;font-weight:600;flex:1}
.um-head .close-x{position:static !important;float:none !important;margin-right:auto;flex-shrink:0}
.um-body{padding:14px 22px;overflow-y:auto;flex:1;min-height:0}
.um-body .field{margin-bottom:10px}
.um-body .field label{font-size:9.5px;margin-bottom:4px}
.um-body .field input,.um-body .field select{padding:8px 10px;font-size:12px}
.um-foot{padding:10px 22px;border-top:1px solid var(--line);display:flex;gap:8px;flex-shrink:0;background:var(--white)}
.unit-box{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;max-height:180px;overflow-y:auto;padding:2px;border:1px solid var(--line2)}
.unit-check{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid transparent;cursor:pointer;font-size:10.5px;background:var(--white);transition:.1s;line-height:1.3}
.unit-check:hover{background:var(--faint);border-color:var(--line)}
.unit-check.all{grid-column:1/-1;background:var(--faint);border-color:var(--line);font-weight:600}
.unit-check input{cursor:pointer;flex-shrink:0;margin:0}
.unit-check input:disabled{cursor:not-allowed}
.unit-check.disabled{opacity:.5;cursor:not-allowed}
.unit-check.disabled:hover{background:var(--white);border-color:transparent}
input[type=checkbox],input[type=range]{accent-color:var(--accent)}

.info-hint{font-size:10.5px;color:var(--muted);line-height:1.8;margin-top:8px;padding:8px 10px;background:var(--faint);border:1px solid var(--line)}
.info-hint b{color:var(--txt);font-weight:600}

.trend-toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.trend-toolbar select,.trend-toolbar input{padding:9px 11px;border:1px solid var(--txt);background:var(--white);color:var(--txt);outline:none;width:100%;font-size:11.5px;font-variant-numeric:tabular-nums}
.trend-toolbar select:focus,.trend-toolbar input:focus{background:var(--faint)}
.trend-toolbar input::placeholder{color:var(--dim)}

/* ========== THEME SWITCHER POPOVER ========== */
.theme-switcher{position:fixed;z-index:500;background:var(--white);border:1px solid var(--txt);padding:14px;min-width:320px;max-width:calc(100vw - 24px);max-height:80vh;overflow-y:auto;box-shadow:0 20px 50px -15px rgba(0,0,0,.2);animation:pop .18s ease}
body[class*="theme-"] .theme-switcher{border-color:var(--accent);box-shadow:0 20px 50px -15px rgba(0,0,0,.12)}
.ts-head{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.14em;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.ts-opt{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line2);background:var(--white);color:var(--txt);cursor:pointer;font-size:11.5px;font-family:inherit;font-weight:500;transition:.12s;text-align:right}
.ts-opt:hover{border-color:var(--accent);background:var(--faint)}
.ts-opt.active{border-color:var(--accent);background:var(--faint);font-weight:600}
.ts-opt.active .ts-swatch{outline:2px solid var(--accent);outline-offset:1px}
.ts-swatch{width:22px;height:22px;border-radius:4px;border:1px solid var(--line2);flex:0 0 auto}
.ts-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts-opt.active .ts-name::after{content:' ✓';font-size:10px;color:var(--accent);font-weight:700}

@media(max-width:480px){.ts-grid{grid-template-columns:1fr}.theme-switcher{min-width:240px}}

@media(max-width:900px){
  .sidebar{transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.9,.3,1),background .25s;width:240px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-right:0}
  .icon-btn{display:grid}
  .content{padding:16px}
  .topbar{padding:12px 16px}
  .kpi .v{font-size:26px}
  .card{padding:16px}
}
@media(max-width:560px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .cols2{grid-template-columns:1fr}
  .topbar h2{font-size:11.5px}
  .donut{width:130px;height:130px}
  .donut::before{inset:18px}
  .donut .mid b{font-size:22px}
  .modal-box{padding:16px}
  .cc-ev{-webkit-line-clamp:3}
  .content{padding:12px}
  .theme-btn{padding:7px 9px;font-size:10.5px}
}
@media(max-height:520px){
  .sidebar{overflow-y:auto}
  .nav{overflow:visible}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-wrap">
  <div class="bg-anim">
    <div class="bg-grid"></div>
    <div class="rotor rotor-a"></div>
    <div class="rotor rotor-b"></div>
    <div class="rotor rotor-c"></div>
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>
  <div class="login-card">
    <button class="login-theme" id="loginThemeBtn" type="button" title="تغییر تم">تم</button>
    <div class="kashaf">KASHAF — 495</div>
    <div class="kashaf-rule"></div>
    <h1>ورود به سامانه</h1>
    <p class="sub">پایش کنترل‌های امنیت اطلاعات</p>
    <div id="connBox" class="diag">
      <div><b>وضعیت اتصال:</b> <span id="connTxt">در حال بررسی…</span></div>
    </div>
    <form id="loginForm">
      <div class="field"><label>نام کاربری</label>
        <input id="luser" value="ice" required autocomplete="username"></div>
      <div class="field"><label>رمز عبور</label>
        <input id="lpass" type="password" value="ice" required autocomplete="current-password"></div>
      <button class="btn btn-primary btn-full" type="submit" id="loginBtn">ورود</button>
      <div class="err" id="loginErr"></div>
    </form>
    <div class="mode-toggle">
      <button id="retestBtn">بررسی اتصال</button>
      <button id="localModeBtn">حالت محلی</button>
    </div>
    <div class="hint">کاربر پیش‌فرض: <b>ice</b> / رمز: <b>ice</b></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><b>KASHAF 495</b><span>پایش کنترل‌های امنیت</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="user-chip">
        <div class="av" id="avatar">I</div>
        <div style="min-width:0"><b id="uName">—</b><span id="uRole">—</span></div>
      </div>
      <div id="modeIndicator"></div>
      <button class="btn btn-full" id="logoutBtn">خروج از حساب</button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <main class="main">

/* ===== JALALI ===== */
const JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const JALALI_WEEKDAYS = ['ش','ی','د','س','چ','پ','ج'];
function g2j(gy, gm, gd){
  const gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + gdm[gm-1];
  jy += 33*Math.floor(days/12053); days %= 12053;
  jy += 4*Math.floor(days/1461); days %= 1461;
  if (days > 365) { jy += Math.floor((days-1)/365); days = (days-1)%365; }
  const jm = (days < 186) ? 1 + Math.floor(days/31) : 7 + Math.floor((days-186)/30);
  const jd = 1 + ((days < 186) ? (days%31) : ((days-186)%30));
  return [jy, jm, jd];
}
function j2g(jy, jm, jd){
  let gy = (jy <= 979) ? 621 : 1600;
  jy -= (jy <= 979) ? 0 : 979;
  let days = (365*jy) + (Math.floor(jy/33)*8) + Math.floor(((jy%33)+3)/4) + 78 + jd + ((jm<7) ? (jm-1)*31 : ((jm-7)*30)+186);
  gy += 400*Math.floor(days/146097); days %= 146097;
  if (days >= 36525) { days--; gy += 100*Math.floor(days/36524); days %= 36524; if (days >= 365) days++; }
  gy += 4*Math.floor(days/1461); days %= 1461;
  if (days >= 366) { gy += Math.floor((days-1)/365); days = (days-1)%365; }
  let gd = days + 1;
  const sa = [0,31,((gy%4===0 && gy%100!==0) || (gy%400===0)) ? 29 : 28,31,30,31,30,31,31,30,31,30,31];
  let gm; for (gm=1; gm<=12; gm++) { if (gd <= sa[gm]) break; gd -= sa[gm]; }
  return [gy, gm, gd];
}
function isLeapJalali(jy){ return [1,5,9,13,17,22,26,30].includes(jy % 33); }
function jalaliMonthLength(jy, jm){ if(jm<=6) return 31; if(jm<=11) return 30; return isLeapJalali(jy)?30:29; }
function firstWeekdayOfJalaliMonth(jy, jm){
  const [gy, gm, gd] = j2g(jy, jm, 1);
  const d = new Date(gy, gm-1, gd);
  return (d.getDay() + 1) % 7;
}
function todayJalali(){
  const n = new Date();
  const [y,m,d] = g2j(n.getFullYear(), n.getMonth()+1, n.getDate());
  return `${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
}
function parseJalali(s){
  const m = toLatin(String(s||'').trim()).match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  if(y<1200||y>1600||mo<1||mo>12||d<1||d>31) return null;
  if(d > jalaliMonthLength(y, mo)) return null;
  return `${y}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
}
function displayDate(s){ if(!s) return ''; const p = parseJalali(s); return p ? fa(p) : s; }

function openDatePicker(currentValue, onPick){
  const today = todayJalali();
  const parsed = currentValue ? parseJalali(currentValue) : null;

  const host = document.getElementById('datePickerHost');
  function render(){
    const len = jalaliMonthLength(jy, jm);
    const firstWd = firstWeekdayOfJalaliMonth(jy, jm);
    const cells = [];
    for(let i=0; i<firstWd; i++) cells.push(null);
    for(let d=1; d<=len; d++) cells.push(d);
    while(cells.length % 7 !== 0) cells.push(null);
    const daysHtml = cells.map(d => {
      if(d === null) return `<span class="dp-day empty"></span>`;
      const full = `${jy}/${String(jm).padStart(2,'0')}/${String(d).padStart(2,'0')}`;

      if(selected === full) cls.push('selected');
      return `<button type="button" class="${cls.join(' ')}" data-day="${d}">${fa(d)}</button>`;
    }).join('');
    host.innerHTML = `<div class="date-picker" id="dpBg"><div class="date-picker-box">

        <div class="dp-nav"><button type="button" data-nav="py">««</button><button type="button" data-nav="pm">«</button></div>

        <div class="dp-nav"><button type="button" data-nav="nm">»</button><button type="button" data-nav="ny">»»</button></div>
      </div>
      <div class="dp-weekdays">${JALALI_WEEKDAYS.map(w=>`<span>${w}</span>`).join('')}</div>
      <div class="dp-days">${daysHtml}</div>
      <div class="dp-foot">
        <button type="button" data-act="today" class="primary">امروز</button>
        <button type="button" data-act="clear">پاک</button>
        <button type="button" data-act="close">بستن</button>
      </div>
    </div></div>`;
    host.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
      const n = b.dataset.nav;
      if(n === 'py') jy--; if(n === 'ny') jy++;
      if(n === 'pm') { jm--; if(jm<1){ jm=12; jy--; } }
      if(n === 'nm') { jm++; if(jm>12){ jm=1; jy++; } }
      render();
    }));
    host.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => {
      const d = Number(b.dataset.day);
      const full = `${jy}/${String(jm).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
      selected = full; onPick(full); close();
    }));
    host.querySelector('[data-act="today"]').addEventListener('click', () => {
      const p = today.split('/').map(Number);
      jy = p[0]; jm = p[1]; selected = today; onPick(today); close();
    });
    host.querySelector('[data-act="clear"]').addEventListener('click', () => { onPick(null); close(); });
    host.querySelector('[data-act="close"]').addEventListener('click', close);
    host.querySelector('#dpBg').addEventListener('click', e => { if(e.target.id === 'dpBg') close(); });
  }
  function close(){ host.innerHTML = ''; }
  render();
}

      txt.textContent = 'اتصال به سرور برقرار نشد.'; box.className = 'diag err';

function isAdmin(){ return S.user && S.user.role === 'admin'; }
function visibleNav(){ return isAdmin() ? NAV : NAV.filter(n => !n.adminOnly); }
function periodIndex(){ return S.periods.findIndex(p => p.id === S.periodId); }
function isFirstPeriodById(id){ return S.periods.length > 0 && S.periods[0].id === id; }
function isLastPeriodById(id){ return S.periods.length > 0 && S.periods[S.periods.length - 1].id === id; }

function applyUnitAccess(all){
  if(!S.user) return all;
  if(S.user.role === 'admin') return all;
  const allowed = S.user.allowed_units;
  if(allowed === null || allowed === undefined) return all;
  if(!Array.isArray(allowed)) return [];
  if(allowed.length === 0) return [];
  return all.filter(c => allowed.includes(c.owner_unit));
}

/* ===== AUTH ===== */
async function doLogin(username, password){
  const hash = await sha256(password);
  if(MODE==='local'){
    const u = await LocalDB.findUser(username);
    if(!u) throw new Error('کاربر یافت نشد.');
    if(u.password_hash && u.password_hash !== hash) throw new Error('رمز نادرست است.');
    return u;
  }
  let { data, error } = await sb.from('app_users').select('*').eq('username', username).limit(1);
  if(error){
    if(String(error.message).includes('does not exist')) throw new Error('پایگاه داده آماده نیست.');
    if(String(error.message).includes('Failed to fetch')) throw new Error('اتصال به سرور برقرار نشد.');
    throw new Error('خطا در اتصال: '+error.message);
  }
  if(!data||!data.length){
    if(username==='ice'){
      const { data:d2, error:e2 } = await sb.from('app_users').insert({
        username:'ice', password_hash: await sha256('ice'), full_name:'مدیر سامانه', role:'admin'
      }).select().single();
      if(e2) throw new Error('ساخت کاربر پیش‌فرض ناموفق: '+e2.message);
      data = [d2];
    } else throw new Error('کاربر یافت نشد.');
  }
  if(data[0].password_hash !== hash) throw new Error('رمز عبور نادرست است.');
  return data[0];
}
function startSession(user){
  user.allowed_units = getUserUnits(user);
  S.user = user;
  S.periodId = null;
  $('#loginScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#uName').textContent = user.full_name || user.username;
  $('#uRole').textContent = user.role==='admin' ? 'MANAGER' : 'VIEWER';
  $('#avatar').textContent = (user.full_name || user.username).trim().charAt(0).toUpperCase();
  updateModeIndicator();
  bootApp();
}
function logout(){
  S.user = null;
  S.periodId = null;
  $('#app').classList.add('hidden');
  $('#loginScreen').classList.remove('hidden');
  $('#content').innerHTML = '';
  updateConnBox();
}

/* ===== API ===== */
async function apiListControls(){
  if(MODE==='local') return LocalDB.listControls();
  const { data, error } = await sb.from('controls').select('*').order('row_no',{ascending:true});
  if(error) throw new Error('خطا در خواندن کنترل‌ها: '+error.message);
  return data||[];
}
async function apiAddControl(row){
  if(MODE==='local') return LocalDB.addControl(row);
  const { error } = await sb.from('controls').insert(row);
  if(error) throw new Error('خطا در افزودن: '+error.message);
}
async function apiDelControl(id){
  if(MODE==='local') return LocalDB.delControl(id);
  const { error } = await sb.from('controls').delete().eq('id', id);
  if(error) throw new Error('خطا در حذف: '+error.message);
}
async function apiListPeriods(){
  if(MODE==='local') return LocalDB.listPeriods();
  const { data, error } = await sb.from('periods').select('*').order('created_at',{ascending:true});
  if(error) throw new Error('خطا در خواندن دوره‌ها: '+error.message);
  return data||[];
}
async function apiAddPeriod(p){
  if(MODE==='local') return LocalDB.addPeriod(p);
  const { data, error } = await sb.from('periods').insert(p).select().single();
  if(error) throw new Error('خطا: '+error.message);
  return data;
}
async function apiUpdatePeriod(id, patch){
  if(MODE==='local') return LocalDB.updatePeriod(id, patch);
  const { error } = await sb.from('periods').update(patch).eq('id', id);
  if(error) throw new Error('خطا: '+error.message);
}
async function apiDelPeriod(id){
  if(MODE==='local') return LocalDB.delPeriod(id);
  const { error } = await sb.from('periods').delete().eq('id', id);
  if(error) throw new Error('خطا: '+error.message);
}
async function apiListAssessments(pid){
  if(MODE==='local') return LocalDB.listAssessments(pid);
  let q = sb.from('assessments').select('*');
  if(pid) q = q.eq('period_id', pid);
  const { data, error } = await q;
  if(error) throw new Error('خطا در خواندن ارزیابی‌ها: '+error.message);
  return (data||[]).map(mergeAxExtras);
}
async function apiSaveAssessmentFor(periodId, controlId, payload){
  const extraKeys = ['deadline','notes'];
  let attempted = { ...payload };
  const failed = {};
  for(let i = 0; i < 3; i++){
    try{
      let existing = null;
      if(MODE === 'local'){
        const t = LocalDB.tables();
        existing = t.assessments.find(x => x.period_id === periodId && x.control_id === controlId);
        const result = await LocalDB.upsertAssessment({ period_id: periodId, control_id: controlId, ...attempted });
        return result;
      }
      const q = sb.from('assessments').select('*').eq('period_id', periodId).eq('control_id', controlId).limit(1);
      const res = await q;
      if(res.error) throw res.error;
      existing = res.data && res.data[0];
      let data, error;
      if(existing){
        ({ data, error } = await sb.from('assessments').update(attempted).eq('id', existing.id).select().single());
      } else {
        ({ data, error } = await sb.from('assessments').insert({ period_id: periodId, control_id: controlId, ...attempted }).select().single());
      }
      if(error) throw error;
      if(Object.keys(failed).length) setAxExtras(data.id, failed);
      return mergeAxExtras(data);
    } catch(err){
      const msg = String(err.message || '').toLowerCase();
      let removed = false;
      for(const k of extraKeys){
        if(attempted[k] !== undefined && msg.includes(k.toLowerCase())){
          failed[k] = attempted[k];
          delete attempted[k];
          removed = true;
          break;
        }
      }
      if(!removed) throw err;
    }
  }
  throw new Error('خطا در ذخیره ارزیابی');
}

/* ===== LOADERS ===== */
async function loadControls(){
  const all = await apiListControls();
  S.allControls = all;
  S.allUnits = [...new Set(all.map(c=>c.owner_unit).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  S.controls = applyUnitAccess(all);
  S.units = [...new Set(S.controls.map(c=>c.owner_unit).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  S.cats = [...new Set(S.controls.map(c=>c.category).filter(Boolean))];
  S.levels = [...new Set(S.controls.map(c=>c.level).filter(Boolean))];
}
async function loadPeriods(){
  S.periods = await apiListPeriods();
  if(S.periods.length && !S.periods.find(p=>p.id===S.periodId)){
    S.periodId = S.periods[S.periods.length - 1].id;
  }
}
async function loadAssessments(){
  S.assessments = {};
  if(!S.periodId) return;
  const rows = await apiListAssessments(S.periodId);
  rows.forEach(a => S.assessments[a.control_id] = a);
}
async function loadAllAssessments(){
  S.allAssessments = await apiListAssessments(null);
}

function controlStatus(c){
  const a = S.assessments[c.id];
  return normalizeStatus((a && a.status) || c.status || 'عدم پیاده‌سازی');
}
function controlProgress(c){
  const a = S.assessments[c.id];
  if(a && a.progress !== null && a.progress !== undefined && a.progress !== '') return Number(a.progress);
  return statusWeight(controlStatus(c));
}
function assessmentMapFor(pid){
  const m = {};
  S.allAssessments.filter(a=>a.period_id===pid).forEach(a => m[a.control_id]=a);
  return m;
}
function progressWithMap(c, map){
  const a = map[c.id];
  if(a && a.progress !== null && a.progress !== undefined && a.progress !== '') return Number(a.progress);
  return statusWeight((a && a.status) || c.status);
}

/* ===== BOOT ===== */
async function bootApp(){
  const content = $('#content');
  content.innerHTML = `<div class="card"><div class="spin"></div><div class="empty">در حال بارگذاری…</div></div>`;
  try{
    await loadPeriods();
    await loadControls();
    await loadAssessments();
    if(!S.periods.length && isAdmin()) S.view = 'periods';
    renderNav(); renderPeriodSelect(); render();
  }catch(err){
    content.innerHTML = `<div class="card"><h3><span class="dot"></span> خطا در بارگذاری</h3>
      <div class="empty" style="text-align:right">${esc(err.message || err)}</div></div>`;
  }
}
function renderNav(){
  $('#nav').innerHTML = visibleNav().map(n =>
    `<button data-view="${n.id}" class="${S.view===n.id?'active':''}">${n.label}</button>`).join('');
}
function renderPeriodSelect(){
  const sel = $('#globalPeriod');
  if(!S.periods.length){ sel.innerHTML = `<option value="">— بدون دوره —</option>`; sel.disabled = true; return; }
  sel.disabled = false;
  sel.innerHTML = S.periods.map(p =>
    `<option value="${p.id}" ${p.id===S.periodId?'selected':''}>${esc(p.name)}</option>`).join('');
}
function render(){
  const allowedViews = visibleNav().map(n=>n.id);
  if(!allowedViews.includes(S.view)) S.view = 'dashboard';
  $('#pageTitle').textContent = TITLES[S.view] || '';
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view===S.view));
  const c = $('#content');
  switch(S.view){
    case 'dashboard': c.innerHTML = viewDashboard(); break;
    case 'controls':  c.innerHTML = viewControls(); break;
    case 'trend':     c.innerHTML = viewTrend(); break;
    case 'periods':   c.innerHTML = viewPeriods(); break;
    case 'users':     c.innerHTML = viewUsers(); break;
    case 'import':    c.innerHTML = viewImport(); break;
  }
  c.scrollTop = 0;
  bindView();
  if(S.view==='trend') ensureTrendData();
  updateThemeBtn();
}

function viewDashboard(){
  const total = S.controls.length;
  const counts = {'عدم پیاده‌سازی':0,'در حال پیاده‌سازی':0,'پیاده‌سازی کامل':0,'غیر قابل احراز':0};
  let sum = 0;
  S.controls.forEach(c => { counts[normalizeStatus(controlStatus(c))]++; sum += controlProgress(c); });
  const avg = total ? Math.round(sum/total) : 0;
  const byUnit = {};
  S.controls.forEach(c => {
    const u = c.owner_unit || 'نامشخص';
    if(!byUnit[u]) byUnit[u] = { n:0, sum:0, ok:0, doing:0, bad:0 };
    byUnit[u].n++; byUnit[u].sum += controlProgress(c);
    const ns = normalizeStatus(controlStatus(c));
    if(ns==='پیاده‌سازی کامل') byUnit[u].ok++;
    else if(ns==='در حال پیاده‌سازی') byUnit[u].doing++;
    else byUnit[u].bad++;

  const unitRows = Object.entries(byUnit).map(([k,v]) => ({
    name:k, n:v.n, ok:v.ok, doing:v.doing, bad:v.bad, pct: v.n?Math.round(v.sum/v.n):0
  })).sort((a,b)=>b.pct-a.pct);
  const byLevel = {};
  S.controls.forEach(c => {
    const l = c.level || 'نامشخص';
    if(!byLevel[l]) byLevel[l] = { n:0, sum:0 };
    byLevel[l].n++; byLevel[l].sum += controlProgress(c);
  });
  const byCat = {};
  S.controls.forEach(c => {
    const k = c.category || 'نامشخص';
    if(!byCat[k]) byCat[k] = { n:0, sum:0 };
    byCat[k].n++; byCat[k].sum += controlProgress(c);

    name:k, n:v.n, pct: v.n?Math.round(v.sum/v.n):0

  return `<div class="grid" style="gap:16px">
    <div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 20px">
      <span class="badge badge-soft">دوره: ${esc(periodName)}</span>

      <span class="badge badge-soft">${scopeLabel}</span>
      <span class="badge badge-soft" style="margin-right:auto">${MODE==='local'?'محلی':'آنلاین'}</span>
    </div>
    <div class="grid kpis">
      <div class="card kpi"><div class="v">${fa(avg)}٪</div><div class="l">پیشرفت کل</div>
        <div class="bar" style="margin-top:12px"><i style="width:${avg}%"></i></div></div>
      <div class="card kpi"><div class="v">${fa(counts['پیاده‌سازی کامل'])}</div><div class="l">پیاده‌سازی کامل</div></div>
      <div class="card kpi"><div class="v">${fa(counts['در حال پیاده‌سازی'])}</div><div class="l">در حال انجام</div></div>
      <div class="card kpi"><div class="v">${fa(counts['عدم پیاده‌سازی'])}</div><div class="l">عدم پیاده‌سازی</div></div>

        <div class="donut-wrap">
          <div class="donut" style="background:conic-gradient(${grad||'var(--donut-4) 0deg 360deg'})">
            <div class="mid"><b>${fa(total)}</b><span>کنترل</span></div>
          </div>
          <div class="legend">
            ${segs.map(s=>`<div><i style="background:${s.color}"></i>${s.label}<b>${fa(s.val)}</b></div>`).join('')}

      <div class="card">

/* ===== CONTROLS ===== */
function filteredControls(){
  const f = S.filters;
  return S.controls.filter(c => {
    if(f.unit && c.owner_unit!==f.unit) return false;
    if(f.cat && c.category!==f.cat) return false;
    if(f.level && c.level!==f.level) return false;
    if(f.status && normalizeStatus(controlStatus(c))!==f.status) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = `${c.title||''} ${c.evidence||''} ${c.owner_unit||''} ${c.category||''} ${c.row_no||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ===== TREND ===== */
function viewTrend(){
  if(!S.periods.length) return `<div class="card"><div class="empty">دوره‌ای نیست.</div></div>`;
  if(!S._trendLoaded) return `<div class="card"><div class="spin"></div><div class="empty">بارگذاری…</div></div>`;
  const fUnit = S._trendUnit || '__all';
  const fCat = S._trendCat || '__all';
  const fLevel = S._trendLevel || '__all';
  const groupBy = S._trendGroupBy || 'unit';
  const search = (S._trendSearch || '').trim().toLowerCase();
  const page = S._trendPage || 1;
  let ctrlFiltered = S.controls;
  if(fUnit !== '__all') ctrlFiltered = ctrlFiltered.filter(c => c.owner_unit === fUnit);
  if(fCat !== '__all') ctrlFiltered = ctrlFiltered.filter(c => c.category === fCat);
  if(fLevel !== '__all') ctrlFiltered = ctrlFiltered.filter(c => c.level === fLevel);
  if(groupBy === 'control' && search){
    ctrlFiltered = ctrlFiltered.filter(c => (c.title||'').toLowerCase().includes(search));
  }
  const unitOpts = ['<option value="__all">همه واحدها</option>']
    .concat(S.units.map(u=>`<option value="${esc(u)}" ${fUnit===u?'selected':''}>${esc(u)}</option>`)).join('');
  const catOpts = ['<option value="__all">همه دسته‌ها</option>']
    .concat(S.cats.map(u=>`<option value="${esc(u)}" ${fCat===u?'selected':''}>${esc(u)}</option>`)).join('');
  const levelOpts = ['<option value="__all">همه سطوح</option>']
    .concat(S.levels.map(u=>`<option value="${esc(u)}" ${fLevel===u?'selected':''}>${esc(u)}</option>`)).join('');
  const series = S.periods.map(p => {
    const map = assessmentMapFor(p.id);
    const vals = ctrlFiltered.map(c => progressWithMap(c, map));
    return { id:p.id, name:p.name, value: vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0 };
  });
  const groups = {};
  if(groupBy === 'control'){
    ctrlFiltered.forEach(c => {
      groups[c.id] = {
        name: c.title || '',
        meta: { row_no: c.row_no, owner_unit: c.owner_unit, category: c.category, level: c.level },
        controls: [c]
      };
    });
  } else {
    ctrlFiltered.forEach(c => {
      const key = groupBy === 'unit' ? (c.owner_unit || 'نامشخص')
        : groupBy === 'category' ? (c.category || 'نامشخص')
        : (c.level || 'نامشخص');
      if(!groups[key]) groups[key] = { name: key, controls: [] };
      groups[key].controls.push(c);
    });
  }
  const groupsArr = Object.values(groups).map(g => {
    const perPeriod = S.periods.map(p => {
      const map = assessmentMapFor(p.id);
      const vals = g.controls.map(c => progressWithMap(c, map));
      return vals.length ? Math.round(vals.reduce((a,b)=>a+b,0)/vals.length) : 0;
    });
    return { ...g, perPeriod, lastVal: perPeriod[perPeriod.length - 1] || 0 };
  }).sort((a,b) => b.lastVal - a.lastVal);
  const isControlMode = groupBy === 'control';
  const total = groupsArr.length;
  const pages = isControlMode ? Math.max(1, Math.ceil(total / TREND_PAGE_SIZE)) : 1;
  const curPage = Math.min(page, pages);
  const start = (curPage - 1) * TREND_PAGE_SIZE;
  const itemsToShow = isControlMode ? groupsArr.slice(start, start + TREND_PAGE_SIZE) : groupsArr;
  const groupLabel = { unit:'واحد', category:'دسته', level:'سطح', control:'کنترل' }[groupBy];
  const tableHeader = isControlMode
    ? `<tr><th>#</th><th>کنترل</th><th>واحد</th><th>دسته</th><th>سطح</th>
        ${S.periods.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr>`
    : `<tr><th>${groupLabel}</th><th>تعداد</th>
        ${S.periods.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr>`;
  const tableBody = itemsToShow.length
    ? itemsToShow.map(g => {
        if(isControlMode){
          const m = g.meta || {};
          return `<tr>
            <td>${fa(m.row_no ?? '')}</td>
            <td style="font-weight:600;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(g.name)}">${esc(g.name)}</td>
            <td style="font-size:10.5px;color:var(--muted)">${esc(m.owner_unit || '—')}</td>
            <td style="font-size:10.5px;color:var(--muted)">${esc(m.category || '—')}</td>
            <td style="font-size:10.5px;color:var(--muted)">${esc(m.level || '—')}</td>
            ${g.perPeriod.map(v=>`<td style="font-weight:600">${fa(v)}٪</td>`).join('')}
          </tr>`;
        }
        return `<tr>
          <td style="font-weight:600">${esc(g.name)}</td>
          <td>${fa(g.controls.length)}</td>
          ${g.perPeriod.map(v=>`<td style="font-weight:600">${fa(v)}٪</td>`).join('')}
        </tr>`;
      }).join('')
    : `<tr><td colspan="${isControlMode?5+S.periods.length:2+S.periods.length}" class="empty" style="text-align:center;padding:32px">داده‌ای برای نمایش نیست</td></tr>`;
  return `
  <div class="card" style="margin-bottom:16px;padding:16px 20px">
    <div class="trend-toolbar" style="margin-bottom:8px">
      <select id="trendUnit">${unitOpts}</select>
      <select id="trendCat">${catOpts}</select>
      <select id="trendLevel">${levelOpts}</select>
      <select id="trendGroupBy">
        <option value="unit" ${groupBy==='unit'?'selected':''}>گزارش بر اساس: واحد</option>
        <option value="category" ${groupBy==='category'?'selected':''}>گزارش بر اساس: دسته</option>
        <option value="level" ${groupBy==='level'?'selected':''}>گزارش بر اساس: سطح</option>
        <option value="control" ${groupBy==='control'?'selected':''}>گزارش بر اساس: کنترل</option>
      </select>
      ${isControlMode ? `<input id="trendSearch" placeholder="جستجوی عنوان کنترل…" value="${esc(S._trendSearch || '')}">` : ''}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:8px;border-top:1px solid var(--line)">
      <span class="badge badge-soft">${fa(ctrlFiltered.length)} کنترل</span>
      <span class="badge badge-soft">${fa(total)} گروه</span>
      ${isControlMode && pages > 1 ? `<span class="badge badge-soft">صفحه ${fa(curPage)} / ${fa(pages)}</span>` : ''}
      <button class="btn btn-sm" id="trendClearFilters" style="margin-right:auto">پاک کردن فیلترها</button>
    </div>
  </div>
  <div class="card" style="margin-bottom:16px">
    <h3><span class="dot"></span> روند کلی
      ${fUnit!=='__all'?` — ${esc(fUnit)}`:''}
      ${fCat!=='__all'?` — ${esc(fCat)}`:''}
      ${fLevel!=='__all'?` — ${esc(fLevel)}`:''}
    </h3>
    ${lineChart(series)}
  </div>
  <div class="card" style="margin-bottom:16px">
    <h3><span class="dot"></span> جدول پیشرفت (بر اساس ${groupLabel})</h3>
    <div class="tbl-wrap"><table>
      <thead>${tableHeader}</thead>
      <tbody>${tableBody}</tbody>
    </table></div>
    ${isControlMode && pages > 1 ? `
      <div class="pager">
        <button class="btn btn-sm" data-trendpage="1" ${curPage===1?'disabled':''}>«</button>
        <button class="btn btn-sm" data-trendpage="${curPage-1}" ${curPage===1?'disabled':''}>قبلی</button>
        <span class="info">${fa(start+1)}—${fa(Math.min(start+TREND_PAGE_SIZE,total))} از ${fa(total)}</span>
        <button class="btn btn-sm" data-trendpage="${curPage+1}" ${curPage===pages?'disabled':''}>بعدی</button>
        <button class="btn btn-sm" data-trendpage="${pages}" ${curPage===pages?'disabled':''}>»</button>
      </div>` : ''}
  </div>
  <div class="card">
    <h3><span class="dot"></span> سابقه اقدامات</h3>
    ${S.periods.slice().reverse().map(p=>{
      const acts = S.allAssessments.filter(a=>a.period_id===p.id && (a.actions||'').trim());
      const filteredActs = acts.filter(a => {
        const c = S.controls.find(x => x.id === a.control_id);
        if(!c) return false;
        if(fUnit!=='__all' && c.owner_unit !== fUnit) return false;
        if(fCat!=='__all' && c.category !== fCat) return false;
        if(fLevel!=='__all' && c.level !== fLevel) return false;
        return true;
      });
      if(!filteredActs.length) return '';
      return `<div style="margin-bottom:20px">
        <div class="badge badge-soft" style="margin-bottom:10px">${esc(p.name)} — ${fa(filteredActs.length)} اقدام</div>
        ${filteredActs.slice(0,50).map(a=>{
          const c = S.controls.find(x=>x.id===a.control_id);
          if(!c) return '';
          return `<div style="background:var(--faint);border:1px solid var(--line);padding:12px;margin-bottom:8px">
            <div style="font-size:10.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.06em">
              #${fa(c.row_no??'')} — ${esc(c.owner_unit||'')} — ${esc((c.title||'').slice(0,80))}
            </div>
            <div style="font-size:11.5px;line-height:1.9">${esc(a.actions)}</div>
            <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
              ${a.status?`<span class="badge ${statusClass(a.status)}">${esc(normalizeStatus(a.status))}</span>`:''}
              ${a.progress!=null?`<span class="badge badge-soft">${fa(a.progress)}٪</span>`:''}
              ${a.deadline?`<span class="badge badge-soft">مهلت: ${displayDate(a.deadline)}</span>`:''}
              ${a.file_url?`<a class="badge badge-soft" href="${esc(a.file_url)}" target="_blank" rel="noopener">پیوست</a>`:''}
            </div></div>`;
        }).join('')}
      </div>`;
    }).join('') || '<div class="empty">اقدامی ثبت نشده.</div>'}
  </div>`;
}
function lineChart(series){
  if(!series.length) return '<div class="empty">—</div>';
  const W=640, H=240, PAD=44, n=series.length;
  const xs = i => n===1?W/2:PAD+i*(W-2*PAD)/(n-1);
  const ys = v => H-PAD-(v/100)*(H-2*PAD);
  const path = series.map((s,i)=>`${i?'L':'M'}${xs(i).toFixed(1)},${ys(s.value).toFixed(1)}`).join(' ');
  return `<div style="width:100%;overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:340px;height:auto">
    ${[0,25,50,75,100].map(v=>`
      <line x1="${PAD}" y1="${ys(v)}" x2="${W-PAD}" y2="${ys(v)}" style="stroke:var(--line);stroke-width:1"/>
      <text x="${PAD-8}" y="${ys(v)+4}" style="fill:var(--dim);font-size:9px" text-anchor="end">${v}%</text>`).join('')}
    <path d="${path}" style="fill:none;stroke:var(--bar-fill);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"/>
    ${series.map((s,i)=>`
      <circle cx="${xs(i)}" cy="${ys(s.value)}" r="4" style="fill:var(--white);stroke:var(--bar-fill);stroke-width:1.5"/>
      <text x="${xs(i)}" y="${ys(s.value)-12}" style="fill:var(--txt);font-size:10px;font-weight:600" text-anchor="middle">${fa(s.value)}٪</text>
      <text x="${xs(i)}" y="${H-14}" style="fill:var(--muted);font-size:9px" text-anchor="middle">${esc(s.name.length>16?s.name.slice(0,16)+'…':s.name)}</text>`).join('')}
  </svg></div>`;
}

function userAccessText(u){
  if(u.role === 'admin') return 'همه (مدیر)';
  const units = u.allowed_units;
  if(units === null || units === undefined) return 'همه واحدها';
  if(!Array.isArray(units)) return '—';
  if(units.length === 0) return 'بدون دسترسی';
  if(units.length > 2) return units.slice(0,2).join('، ') + ` +${units.length-2}`;
  return units.join('، ');
}
function viewUsers(){
  if(!isAdmin()) return `<div class="card"><div class="empty">دسترسی ندارید.</div></div>`;

function openUserModal(userToEdit = null){
  if(!isAdmin()) return;
  const isEdit = !!userToEdit;
  const units = S.allUnits.length ? S.allUnits : S.units;
  const currentUnits = isEdit ? userToEdit.allowed_units : null;
  const currentRole = isEdit ? userToEdit.role : 'user';
  const treatAll = currentRole === 'admin' || currentUnits === null || currentUnits === undefined;
  const unitChecks = units.length
    ? units.map(u => {
        const checked = !treatAll && Array.isArray(currentUnits) && currentUnits.includes(u) ? 'checked' : '';
        const dis = treatAll ? 'disabled' : '';
        const cls = treatAll ? 'unit-check disabled' : 'unit-check';
        return `<label class="${cls}">
          <input type="checkbox" class="u-unit" value="${esc(u)}" ${checked} ${dis}>
          <span>${esc(u)}</span>
        </label>`;
      }).join('')
    : `<div style="padding:10px;font-size:10.5px;color:var(--dim);text-align:center;grid-column:1/-1">واحدی ثبت نشده</div>`;
  $('#modalHost').innerHTML = `<div class="modal" id="modalBg"><div class="modal-box user-modal">
    <div class="um-head">
      <h3>${isEdit ? 'ویرایش کاربر' : 'افزودن کاربر جدید'}</h3>
      <button class="close-x" id="closeModal">×</button>
    </div>
    <div class="um-body">
      <div class="field"><label>نام کاربری</label>
        <input id="mUser" value="${isEdit ? esc(userToEdit.username) : ''}" ${isEdit ? 'disabled style="background:var(--faint);color:var(--muted)"' : ''} placeholder="username"></div>
      ${!isEdit ? `<div class="field"><label>رمز عبور</label>
        <input id="mPass" type="password" placeholder="رمز"></div>` : ''}
      <div class="field"><label>نام کامل</label>
        <input id="mName" value="${isEdit ? esc(userToEdit.full_name||'') : ''}" placeholder="نام و نام خانوادگی"></div>
      <div class="field"><label>نقش</label>
        <select id="mRole">
          <option value="user" ${currentRole==='user'?'selected':''}>کاربر عادی</option>
          <option value="admin" ${currentRole==='admin'?'selected':''}>مدیر سامانه</option>
        </select></div>
      <div id="unitsBox" style="${currentRole==='admin' ? 'display:none' : ''}">
        <div class="field" style="margin-bottom:0">
          <label>دسترسی به واحدها</label>
          <div class="unit-box">
            <label class="unit-check all">
              <input type="checkbox" id="allUnits" ${treatAll?'checked':''}>
              <span>همه واحدها</span>
            </label>
            ${unitChecks}
          </div>
        </div>
      </div>
    </div>
    <div class="um-foot">
      <button class="btn btn-primary" id="mSave">${isEdit ? 'ذخیره' : 'افزودن'}</button>
      <button class="btn" id="mCancel">انصراف</button>
    </div>
  </div></div>`;
  const close = () => $('#modalHost').innerHTML='';
  $('#closeModal').addEventListener('click', close);
  $('#mCancel').addEventListener('click', close);
  $('#modalBg').addEventListener('click', e => { if(e.target.id==='modalBg') close(); });
  $('#mRole').addEventListener('change', () => {
    $('#unitsBox').style.display = $('#mRole').value === 'admin' ? 'none' : '';
  });
  const allCb = $('#allUnits');
  function refreshDisabled(){
    const all = allCb.checked;
    document.querySelectorAll('.u-unit').forEach(cb => {
      cb.disabled = all;
      if(all) cb.checked = false;
      cb.closest('.unit-check').classList.toggle('disabled', all);
    });
  }
  refreshDisabled();
  allCb.addEventListener('change', refreshDisabled);
  $('#mSave').addEventListener('click', async () => {
    const role = $('#mRole').value;
    const fullName = $('#mName').value.trim();
    let allowedUnits;
    if(role === 'admin'){ allowedUnits = null; }
    else if(allCb.checked){ allowedUnits = null; }
    else { allowedUnits = [...document.querySelectorAll('.u-unit:checked')].map(cb => cb.value); }
    try{
      if(isEdit){
        await updateUserBasic(userToEdit.id, { full_name: fullName, role });
        await saveUserUnits(userToEdit.id, allowedUnits);
        userToEdit.allowed_units = allowedUnits;
        userToEdit.role = role;
        userToEdit.full_name = fullName;
        toast('ذخیره شد');
        if(S.user && S.user.id === userToEdit.id){
          S.user.allowed_units = allowedUnits;
          S.user.role = role;
          S.user.full_name = fullName;
          $('#uName').textContent = fullName || userToEdit.username;
          $('#uRole').textContent = role==='admin' ? 'MANAGER' : 'VIEWER';
          await loadControls();
          render();
          close();
          return;
        }
      } else {
        const username = $('#mUser').value.trim();
        const password = $('#mPass').value.trim();
        if(!username || !password) return toast('نام کاربری و رمز الزامی است');
        const hash = await sha256(password);
        if(MODE==='local'){
          if(await LocalDB.findUser(username)) throw new Error('کاربر تکراری است');
        } else {
          const { data: existing } = await sb.from('app_users').select('id').eq('username', username).limit(1);
          if(existing && existing.length) throw new Error('کاربر تکراری است');
        }
        await createUserRecord({ username, password_hash: hash, full_name: fullName, role }, allowedUnits);
        toast('کاربر اضافه شد');
      }
      close();
      renderUsersList();
    }catch(err){ toast('خطا: '+err.message); }
  });
}

/* ===== EXCEL ===== */
function excelRowToRecord(r){
  const g = (...names) => {
    for(const n of names){
      const key = Object.keys(r).find(k => String(k).trim() === n);
      if(key !== undefined && String(r[key]).trim() !== '') return String(r[key]).trim();
    }
    return '';
  };
  const deadlineRaw = g('آخرین مهلت اجرای اقدام', 'آخرین مهلت', 'مهلت', 'deadline');
  const deadline = deadlineRaw ? (parseJalali(deadlineRaw) || deadlineRaw) : '';
  const progressRaw = g('درصد پیشرفت', 'درصد', 'progress');
  let progress = null;
  if(progressRaw){
    const num = parseInt(toLatin(progressRaw).replace(/[^\d-]/g, ''), 10);
    if(!isNaN(num)) progress = Math.max(0, Math.min(100, num));
  }
  return {
    category: g('دسته') || null,
    level: g('سطح پیشرفتگی') || null,
    title: g('کنترل') || '',
    evidence: g('شواهد') || '',
    status: normalizeStatus(g('وضعیت پیاده‌سازی') || ''),
    owner_unit: g('واحد مسئول رسیدگی') || null,
    actions: g('اقدامات انجام شده تاکنون', 'اقدامات انجام شده', 'اقدامات') || '',
    deadline,
    progress,
    notes: g('توضیحات', 'توضیح', 'یادداشت') || ''
  };
}
function parseSheet(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        res(XLSX.utils.sheet_to_json(ws, { defval:'', raw:false }));
      }catch(err){ rej(err); }
    };
    r.onerror = () => rej(new Error('خواندن فایل ناموفق'));
    r.readAsArrayBuffer(file);
  });
}
function exportPeriodToExcel(periodId){
  const period = S.periods.find(p => p.id === periodId);
  if(!period) return toast('دوره یافت نشد');
  const map = {};
  if(periodId === S.periodId){
    Object.entries(S.assessments).forEach(([cid, a]) => { map[cid] = a; });
  }
  S.allAssessments.filter(a => a.period_id === periodId).forEach(a => {
    if(!map[a.control_id]) map[a.control_id] = mergeAxExtras(a);
  });
  const rows = S.allControls.map((c, i) => {
    const a = map[c.id] || {};
    const prog = (a.progress !== null && a.progress !== undefined && a.progress !== '')
      ? Number(a.progress)
      : statusWeight(a.status || c.status || '');
    return {
      'ردیف': i + 1,
      'دسته': c.category || '',
      'سطح پیشرفتگی': c.level || '',
      'کنترل': c.title || '',
      'شواهد': c.evidence || '',
      'وضعیت پیاده‌سازی': normalizeStatus(a.status || c.status || ''),
      'واحد مسئول رسیدگی': c.owner_unit || '',
      'اقدامات انجام شده تاکنون': a.actions || '',
      'آخرین مهلت اجرای اقدام': a.deadline || '',
      'درصد پیشرفت': prog,
      'توضیحات': a.notes || ''
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [
    { wch: 6 }, { wch: 18 }, { wch: 12 }, { wch: 50 }, { wch: 50 },
    { wch: 18 }, { wch: 25 }, { wch: 40 }, { wch: 18 }, { wch: 10 }, { wch: 30 }
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'کنترل‌ها');
  const safeName = period.name.replace(/[\\/:*?"<>|]/g, '-');
  XLSX.writeFile(wb, `کاشف-${safeName}-${todayJalali().replace(/\//g,'-')}.xlsx`);
  toast('اکسل دانلود شد');
}

    });
    $('#trendClearFilters')?.addEventListener('click', () => {
      S._trendUnit = '__all'; S._trendCat = '__all'; S._trendLevel = '__all';
      S._trendSearch = ''; S._trendPage = 1;
      c.innerHTML = viewTrend(); bindView();
    });
    c.querySelectorAll('[data-trendpage]').forEach(b => b.addEventListener('click', () => {

    }));

      }catch(err){ toast('خطا: '+err.message); }

      S.periodId = b.dataset.selperiod; renderPeriodSelect(); await loadAssessments();

    }));
    c.querySelectorAll('[data-renameperiod]').forEach(b => b.addEventListener('click', async () => {
      const p = S.periods.find(x => x.id === b.dataset.renameperiod);

      const newName = prompt('نام جدید دوره:', p.name);
      if(newName === null) return;

        await apiUpdatePeriod(p.id, { name: trimmed });
        await loadPeriods();
        renderPeriodSelect();
        toast('نام تغییر کرد');
        render();
      }catch(err){ toast('خطا: '+err.message); }

    $('#doExport')?.addEventListener('click', async () => {

      if(!S.allAssessments.length) await loadAllAssessments();
      exportPeriodToExcel(pid);
    });

      const file = $('#xlsFile').files[0]; const log = $('#importLog');
      if(!file) return toast('فایل را انتخاب کنید');
      log.textContent = 'در حال خواندن فایل…';
      try{
        const rows = await parseSheet(file);
        if(!rows.length) throw new Error('فایل خالی است');
        const parsed = rows.map(excelRowToRecord).filter(r => r.title);
        if(!parsed.length) throw new Error('ستون «کنترل» در فایل شناسایی نشد.');
        const isFirstUpload = S.periods.length === 0;
        if(isFirstUpload){
          const periodName = ($('#firstPeriodName')?.value || '').trim() || 'پایه';
          log.textContent = `ایجاد دوره «${periodName}»…`;
          // *** NO DATES for base period ***
          const period = await apiAddPeriod({ name: periodName });
          S.periodId = period.id;
          log.textContent = `ایجاد ${fa(parsed.length)} کنترل…`;
          if(MODE === 'local'){
            await LocalDB.setControls(parsed.map(r => ({
              category: r.category, level: r.level, title: r.title,
              evidence: r.evidence, status: r.status, owner_unit: r.owner_unit
            })));
          } else {
            const del = await sb.from('controls').delete().not('id','is',null);
            if(del.error) throw del.error;
            const CH = 100;
            for(let i = 0; i < parsed.length; i += CH){
              const part = parsed.slice(i, i+CH).map((r,idx) => ({
                row_no: i+idx+1,
                category: r.category, level: r.level, title: r.title,
                evidence: r.evidence, status: r.status, owner_unit: r.owner_unit
              }));
              const { error } = await sb.from('controls').insert(part);
              if(error) throw error;
              log.textContent = `کنترل‌ها: ${fa(Math.min(i+CH, parsed.length))} از ${fa(parsed.length)}`;
            }
          }
          await loadPeriods();
          await loadControls();
          S.periodId = period.id;
          renderPeriodSelect();
          log.textContent = `ثبت ارزیابی دوره پایه…`;
          for(let i = 0; i < parsed.length; i++){
            const r = parsed[i];
            const ctrl = S.allControls.find(c => c.title === r.title);
            if(!ctrl) continue;
            const progress = r.progress !== null ? r.progress : statusWeight(r.status);
            await apiSaveAssessmentFor(period.id, ctrl.id, {
              status: r.status, progress, actions: r.actions, deadline: r.deadline, notes: r.notes,
              updated_by: S.user?.username || '', updated_at: new Date().toISOString()
            });
            if(i % 20 === 0) log.textContent = `ارزیابی: ${fa(i+1)} از ${fa(parsed.length)}`;
          }
          await loadAssessments();
          log.innerHTML = `<span style="color:var(--txt);font-weight:600">✔ دوره پایه با ${fa(parsed.length)} کنترل ایجاد شد.</span>`;
          toast('دوره پایه ایجاد شد');
        } else {
          const targetPid = $('#importPeriod').value;
          if(!targetPid) throw new Error('دوره هدف را انتخاب کنید');
          const targetPeriod = S.periods.find(p => p.id === targetPid);
          if(!targetPeriod) throw new Error('دوره یافت نشد');
          log.textContent = `بارگذاری برای دوره «${targetPeriod.name}»…`;
          let createdCount = 0;
          for(let i = 0; i < parsed.length; i++){
            const r = parsed[i];
            let ctrl = S.allControls.find(c => c.title === r.title);
            if(!ctrl){
              await apiAddControl({
                row_no: S.allControls.length + 1,
                category: r.category, level: r.level, title: r.title,
                evidence: r.evidence, status: r.status, owner_unit: r.owner_unit
              });
              await loadControls();
              ctrl = S.allControls.find(c => c.title === r.title);
              createdCount++;
            }
            if(!ctrl) continue;
            const progress = r.progress !== null ? r.progress : statusWeight(r.status);
            await apiSaveAssessmentFor(targetPid, ctrl.id, {
              status: r.status, progress, actions: r.actions, deadline: r.deadline, notes: r.notes,
              updated_by: S.user?.username || '', updated_at: new Date().toISOString()
            });
            if(i % 20 === 0) log.textContent = `ثبت: ${fa(i+1)} از ${fa(parsed.length)}`;
          }
          S.periodId = targetPid;
          renderPeriodSelect();
          await loadAssessments();
          await loadAllAssessments();
          log.innerHTML = `<span style="color:var(--txt);font-weight:600">✔ ${fa(parsed.length)} ردیف در دوره «${esc(targetPeriod.name)}» ثبت شد${createdCount>0?` — ${fa(createdCount)} کنترل جدید`:''}.</span>`;
          toast('بارگذاری کامل شد');
        }
        render();
      }catch(err){
        log.innerHTML = `<span style="color:var(--txt)">خطا: ${esc(err.message||err)}</span>`;
        toast('خطا در بارگذاری');
      }
    });
  }
}

    <div class="field"><label>متن کنترل</label><textarea id="mTitle"></textarea></div>
    <div class="field"><label>شواهد</label><textarea id="mEvidence"></textarea></div>
    <div class="field"><label>وضعیت پیاده‌سازی</label>

    <div class="field"><label>واحد مسئول رسیدگی</label><input id="mUnit" placeholder="واحد"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button class="btn btn-primary" id="mSave">افزودن</button>
      <button class="btn" id="mCancel">انصراف</button>
    </div>
  </div></div>`;
  const close = () => $('#modalHost').innerHTML='';
  $('#closeModal').addEventListener('click', close);
  $('#mCancel').addEventListener('click', close);
  $('#modalBg').addEventListener('click', e => { if(e.target.id==='modalBg') close(); });
  $('#mSave').addEventListener('click', async () => {
    const title = $('#mTitle').value.trim();
    if(!title) return toast('متن کنترل الزامی است');
    try{
      const row = {
        category: $('#mCat').value.trim() || null,
        level: $('#mLevel').value || null,
        title,
        evidence: $('#mEvidence').value.trim() || '',
        status: normalizeStatus($('#mStatus').value),
        owner_unit: $('#mUnit').value.trim() || null
      };
      if(MODE==='local'){
        await LocalDB.addControl(row);
      } else {
        const maxRow = S.allControls.reduce((m,c)=>Math.max(m, Number(c.row_no)||0), 0);
        const { error } = await sb.from('controls').insert({ row_no: maxRow+1, ...row });
        if(error) throw error;
      }
      await loadControls();
      toast('کنترل اضافه شد'); close(); render();
    }catch(err){ toast('خطا: '+err.message); }
  });
}

  $('#modalHost').innerHTML = `<div class="modal" id="modalBg"><div class="modal-box">
    <button class="close-x" id="closeModal">×</button>
    <h3>#${fa(c.row_no??'')} — ${esc(c.title)}</h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">
      <span class="badge badge-soft">${esc(c.category||'—')}</span>
      <span class="badge badge-soft">سطح: ${esc(c.level||'—')}</span>
      <span class="badge ${statusClass(st)}">${esc(st)}</span>
      <span class="badge badge-soft">${esc(c.owner_unit||'—')}</span>
    </div>
    <div class="kv"><div class="k">متن کنترل</div><div class="v">${esc(c.title)}</div></div>
    <div class="kv"><div class="k">شواهد ارزیابی</div><div class="v">${esc(c.evidence||'—')}</div></div>
    <div class="kv"><div class="k">وضعیت دوره «${esc(periodName)}»</div>
      <div class="v" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="badge ${statusClass(st)}">${esc(st)}</span>
        <div class="bar" style="flex:1;min-width:120px;margin:0"><i style="width:${pr}%"></i></div>
        <b>${fa(pr)}٪</b>
      </div></div>
    ${a.deadline?`<div class="kv"><div class="k">آخرین مهلت اجرای اقدام</div><div class="v">${displayDate(a.deadline)}</div></div>`:''}
    ${a.actions?`<div class="kv"><div class="k">اقدامات انجام شده تاکنون</div><div class="v">${esc(a.actions)}</div></div>`:''}
    ${a.notes?`<div class="kv"><div class="k">توضیحات</div><div class="v">${esc(a.notes)}</div></div>`:''}
    ${a.file_url?`<div class="kv"><div class="k">پیوست</div><div class="v"><a href="${esc(a.file_url)}" target="_blank" rel="noopener">${esc(a.file_name||'دانلود فایل')}</a></div></div>`:''}
  </div></div>`;
  const close = () => $('#modalHost').innerHTML='';
  $('#closeModal').addEventListener('click', close);
  $('#modalBg').addEventListener('click', e => { if(e.target.id==='modalBg') close(); });
}

/* ===== GLOBAL EVENTS ===== */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), err = $('#loginErr');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'در حال بررسی…';
  try{ const u = await doLogin($('#luser').value.trim(), $('#lpass').value); startSession(u); }
  catch(ex){ err.textContent = ex.message || 'ورود ناموفق'; }
  finally{ btn.disabled = false; btn.textContent = 'ورود'; }
});
$('#retestBtn').addEventListener('click', async () => { if(MODE==='local'){ setMode('online'); } else { await testConnection(); } });
$('#localModeBtn').addEventListener('click', () => { setMode('local'); toast('حالت محلی فعال شد'); });
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]'); if(!b) return;
  S.view = b.dataset.view;
  $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show');
  render();
});
$('#globalPeriod').addEventListener('change', async e => {
  S.periodId = e.target.value || null;
  await loadAssessments();
  toast('دوره تغییر کرد'); render();
});
$('#menuBtn').addEventListener('click', () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); });
$('#overlay').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); });
$('#logoutBtn').addEventListener('click', logout);
document.getElementById('themeBtn').addEventListener('click', function(e) { openThemeSwitcher(this, e); });
document.getElementById('loginThemeBtn').addEventListener('click', function(e) { openThemeSwitcher(this, e); });
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){
    $('#sidebar').classList.remove('open');
    $('#overlay').classList.remove('show');
    $('#modalHost').innerHTML='';
    $('#datePickerHost').innerHTML='';
    const ts = document.getElementById('themeSwitcher'); if(ts) ts.remove();
  }
});

updateConnBox();
updateThemeBtn();
</script>
</body>
</html>
