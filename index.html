<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>سامانه پایش کنترل‌های امنیتی | کاشف ۴۹۵</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{--bg:#060a14;--panel:rgba(17,25,42,.86);--line:#1e2b45;--txt:#e9f0ff;--muted:#8ba0c4;--accent:#22d3ee;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--gray:#64748b;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:'Vazirmatn',system-ui,-apple-system,'Segoe UI',sans-serif;background:radial-gradient(1200px 600px at 92% -10%,rgba(124,58,237,.20),transparent 62%),radial-gradient(1000px 520px at -5% 0%,rgba(34,211,238,.13),transparent 62%),var(--bg);color:var(--txt);overflow-x:hidden;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#1e2b45;border-radius:9px}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}
/* login */
.login-wrap{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;z-index:200;padding:16px}
.bg-anim{position:absolute;inset:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
.b1{width:48vw;height:48vw;min-width:320px;min-height:320px;background:#22d3ee;top:-12%;right:-10%;animation:float 19s ease-in-out infinite}
.b2{width:42vw;height:42vw;min-width:300px;min-height:300px;background:#7c3aed;bottom:-14%;left:-8%;animation:float 23s ease-in-out infinite reverse}
.b3{width:34vw;height:34vw;min-width:260px;min-height:260px;background:#f43f5e;top:38%;left:34%;opacity:.30;animation:float 27s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(-7%,9%,0) scale(1.14)}66%{transform:translate3d(9%,-7%,0) scale(.92)}}
.grid-lines{position:absolute;inset:-60%;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:64px 64px;transform:perspective(700px) rotateX(62deg);animation:gridmove 18s linear infinite;opacity:.55}
@keyframes gridmove{to{background-position:0 64px,64px 0}}
.pt{position:absolute;border-radius:50%;background:rgba(34,211,238,.9);box-shadow:0 0 10px rgba(34,211,238,.95);animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(-112vh);opacity:0}}
.login-card{position:relative;z-index:3;width:min(440px,94vw);padding:30px 24px;border-radius:26px;background:rgba(10,16,30,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.13);box-shadow:0 34px 90px rgba(0,0,0,.65);animation:pop .7s cubic-bezier(.2,.9,.3,1.25)}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.95)}to{opacity:1;transform:none}}
.logo{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-size:28px;margin:0 auto 14px;background:linear-gradient(140deg,#22d3ee,#7c3aed);box-shadow:0 12px 34px rgba(124,58,237,.5)}
.login-card h1{font-size:18px;margin:0 0 5px;text-align:center;font-weight:800}
.login-card .sub{margin:0 0 18px;text-align:center;color:var(--muted);font-size:12px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--txt);outline:none;transition:.2s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:#16203a;color:var(--txt);cursor:pointer;font-weight:600;transition:.18s}
.btn:hover{background:#1d2a49}.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,#22d3ee,#7c3aed);border:none;color:#04101e;font-weight:800;box-shadow:0 10px 26px rgba(34,211,238,.28)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-full{width:100%;padding:12px}.btn-sm{padding:7px 12px;border-radius:10px;font-size:12.5px}
.btn-danger{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.4);color:#fca5a5}
.btn-ghost{background:transparent}
.err{color:#fca5a5;font-size:12px;text-align:center;margin-top:10px;min-height:16px;line-height:1.9}
/* diagnostics box */
.diag{margin:14px 0;padding:11px 13px;border-radius:12px;font-size:11.5px;line-height:1.9;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.diag.ok{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08);color:#86efac}
.diag.err{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);color:#fca5a5}
.diag.warn{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.08);color:#fcd34d}
.diag b{color:#fff}
.diag code{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:5px;font-size:10.5px;color:#93c5fd;font-family:monospace}
/* app */
#app{display:flex;min-height:100dvh;width:100%}
.sidebar{width:264px;flex:0 0 264px;height:100dvh;position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0b1120,#070c16);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:18px 13px;gap:8px}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:linear-gradient(140deg,#22d3ee,#7c3aed)}
.brand b{display:block;font-size:13px}.brand span{display:block;font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-weight:600;font-size:13px;text-align:right;transition:.18s}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.nav button.active{background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(124,58,237,.16));color:#fff;border-color:rgba(34,211,238,.32)}
.nav button .ic{font-size:16px;width:22px;text-align:center}
.side-foot{border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.user-chip{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.045);margin-bottom:8px}
.user-chip .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:linear-gradient(140deg,#22d3ee,#7c3aed);color:#04101e;flex:0 0 auto}
.user-chip b{display:block;font-size:12.5px}.user-chip span{display:block;font-size:10.5px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45;opacity:0;pointer-events:none;transition:.3s;backdrop-filter:blur(2px)}
.overlay.show{opacity:1;pointer-events:auto}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;width:100%}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(6,10,20,.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar h2{margin:0;font-size:15px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#131c30;color:var(--txt);cursor:pointer;display:none;place-items:center;font-size:17px;flex:0 0 auto}
.top-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.content{flex:1;padding:18px;width:100%;min-width:0}
.grid{display:grid;gap:14px;width:100%}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;backdrop-filter:blur(10px);min-width:0}
.card h3{margin:0 0 14px;font-size:13px;font-weight:800;color:#cfe0ff;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.kpi{position:relative;overflow:hidden}.kpi .v{font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1.15}
.kpi .l{color:var(--muted);font-size:12px;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11.5px;border:1px solid transparent;white-space:nowrap;font-weight:600}
.st-ok{background:rgba(34,197,94,.14);color:#4ade80;border-color:rgba(34,197,94,.36)}
.st-warn{background:rgba(245,158,11,.14);color:#fbbf24;border-color:rgba(245,158,11,.36)}
.st-bad{background:rgba(239,68,68,.14);color:#f87171;border-color:rgba(239,68,68,.36)}
.st-gray{background:rgba(100,116,139,.18);color:#94a3b8;border-color:rgba(100,116,139,.36)}
.badge-soft{background:rgba(255,255,255,.055);color:#a9bcdb;border-color:rgba(255,255,255,.09)}
.bar-row{display:grid;grid-template-columns:1fr 48px;gap:10px;align-items:center;margin:9px 0}
.bar-row .nm{font-size:12.5px;color:#c3d3ee;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .pc{font-size:12px;font-weight:800;text-align:left;color:var(--accent)}
.bar{height:9px;border-radius:99px;background:#16203a;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#22d3ee,#7c3aed);transition:width .7s}
.bar.g>i{background:linear-gradient(90deg,#22c55e,#16a34a)}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.donut{width:160px;height:160px;border-radius:50%;position:relative;display:grid;place-items:center;flex:0 0 auto}
.donut::before{content:'';position:absolute;inset:24px;border-radius:50%;background:#0b1120;box-shadow:inset 0 0 22px rgba(0,0,0,.6)}
.donut .mid{position:relative;z-index:2;text-align:center}
.donut .mid b{display:block;font-size:26px;font-weight:900;line-height:1}
.donut .mid span{font-size:11px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:9px;min-width:150px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#c3d3ee}
.legend i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}.legend b{margin-right:auto;color:#fff;font-weight:800}
.toolbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.toolbar input,.toolbar select{padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:#0f1728;color:var(--txt);outline:none;width:100%}
.toolbar input:focus,.toolbar select:focus{border-color:var(--accent)}
.list{display:grid;gap:11px}
.ctrl{background:linear-gradient(180deg,rgba(20,29,49,.92),rgba(13,20,34,.92));border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.2s;min-width:0}
.ctrl:hover{border-color:rgba(34,211,238,.5);transform:translateY(-2px)}
.cc-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.cc-no{font-size:11px;color:var(--muted);font-weight:800;background:rgba(255,255,255,.05);padding:2px 8px;border-radius:7px;margin-right:auto}
.cc-title{font-size:13px;line-height:2;font-weight:700;margin-bottom:8px}
.cc-ev{font-size:12px;line-height:2;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cc-foot{margin-top:11px;display:flex;align-items:center;gap:10px}.cc-foot .bar{flex:1}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.pager .info{color:var(--muted);font-size:12.5px}
.as-item{background:linear-gradient(180deg,rgba(20,29,49,.92),rgba(13,20,34,.92));border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}
.as-item .t{font-size:13px;font-weight:700;line-height:1.95;margin-bottom:10px}
.as-item .t .n{color:var(--accent);font-weight:900;margin-left:6px}
.as-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.as-grid label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.as-grid select,.as-grid input{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:#0f1728;color:var(--txt);outline:none}
input[type=range]{width:100%;accent-color:#22d3ee;margin-top:8px}
textarea{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:#0f1728;color:var(--txt);outline:none;resize:vertical;min-height:66px;line-height:1.9}
input[type=file]{width:100%;padding:8px;border-radius:10px;border:1px dashed var(--line);background:rgba(255,255,255,.03);color:var(--muted);font-size:12px;cursor:pointer}
.as-foot{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.saved{color:#4ade80;font-size:12px;font-weight:700}
.tbl-wrap{overflow-x:auto;width:100%}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid rgba(255,255,255,.055)}
th{color:var(--muted);font-weight:700;font-size:11.5px;background:rgba(255,255,255,.03);white-space:nowrap}
tbody tr:hover{background:rgba(255,255,255,.03)}
.modal{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:16px;background:rgba(2,6,14,.78);backdrop-filter:blur(6px)}
.modal-box{width:min(820px,100%);max-height:88dvh;overflow:auto;border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,#101a2c,#0a1220);padding:22px;box-shadow:0 40px 100px rgba(0,0,0,.75)}
.modal-box h3{margin:0 0 14px;font-size:15px;font-weight:800;line-height:2}
.kv{margin-bottom:14px}.kv .k{font-size:11.5px;color:var(--muted);margin-bottom:5px}
.kv .v{font-size:13px;line-height:2.1;background:rgba(255,255,255,.035);padding:11px 13px;border-radius:11px;border:1px solid rgba(255,255,255,.05)}
.close-x{position:sticky;top:0;float:left;background:rgba(239,68,68,.16);color:#fca5a5;border:1px solid rgba(239,68,68,.35);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:16px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);z-index:400;padding:12px 22px;border-radius:13px;background:#12203a;border:1px solid var(--line);color:#fff;font-size:13px;font-weight:700;box-shadow:0 18px 50px rgba(0,0,0,.6);transition:transform .35s}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:rgba(34,197,94,.5);background:#0f2b1c}
.toast.err{border-color:rgba(239,68,68,.5);background:#2b1114}
.empty{text-align:center;padding:44px 16px;color:var(--muted);font-size:13px;line-height:2}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.14);border-top-color:#22d3ee;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.mode-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;background:rgba(34,197,94,.14);color:#4ade80;border:1px solid rgba(34,197,94,.35)}
.mode-pill.local{background:rgba(245,158,11,.14);color:#fbbf24;border-color:rgba(245,158,11,.35)}
@media(max-width:900px){.sidebar{position:fixed;top:0;right:0;height:100dvh;transform:translateX(100%);transition:transform .32s;box-shadow:-24px 0 70px rgba(0,0,0,.7);width:280px;flex-basis:280px}.sidebar.open{transform:translateX(0)}.icon-btn{display:grid}.content{padding:13px}.topbar{padding:10px 13px}.kpi .v{font-size:24px}.card{padding:14px}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.cols2{grid-template-columns:1fr}.topbar h2{font-size:13.5px}.donut{width:140px;height:140px}.donut::before{inset:20px}.modal-box{padding:16px}}
</style>
</head>

<div id="loginScreen" class="login-wrap">
  <div class="bg-anim">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>

<div id="app" class="hidden">

  <div class="overlay" id="overlay"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn">☰</button>
      <h2 id="pageTitle">داشبورد</h2>

    <div class="content" id="content"></div>
  </main>
</div>

<div id="modalHost"></div>

<script>
/* =========================================================

const SUPABASE_URL = 'https://qtpybadjaczlkzkbbcge.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GUfLjO0eaIx_LYNZgfIKzw_GcUsKjHC';
const BUCKET = 'assessment-files';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fa = n => String(n ?? '').replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

function toast(msg, type='ok'){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show '+type;
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.className='toast '+type, 2600);
}
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function normalizeStatus(s){
  s = String(s||'');
  if(s.includes('عدم')) return 'عدم پیاده‌سازی';
  if(s.includes('غیر قابل')) return 'غیر قابل احراز';
  if(s.includes('در حال')) return 'در حال پیاده‌سازی';
  if(s.includes('پیاده')) return 'پیاده‌سازی';
  return 'عدم پیاده‌سازی';
}
function statusWeight(s){
  const n = normalizeStatus(s);
  if(n === 'پیاده‌سازی') return 100;
  if(n === 'در حال پیاده‌سازی') return 50;
  return 0;
}
function statusClass(s){
  const n = normalizeStatus(s);
  if(n === 'پیاده‌سازی') return 'st-ok';
  if(n === 'در حال پیاده‌سازی') return 'st-warn';
  if(n === 'غیر قابل احراز') return 'st-gray';
  return 'st-bad';
}

/* =========================================================
   LOCAL DATABASE (fallback)
========================================================= */
const LS = {
  read(k){ try { return JSON.parse(localStorage.getItem('kashaf_'+k) || 'null'); } catch(e){ return null; } },
  write(k,v){ localStorage.setItem('kashaf_'+k, JSON.stringify(v)); }
};

function uuid(){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
  const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);
});}

const LocalDB = {
  tables(){
    const t = LS.read('tables') || { users:[], controls:[], periods:[], assessments:[] };
    if(!t.users || !t.users.length){
      t.users = [{ id:uuid(), username:'ice', password_hash:null, full_name:'مدیر سامانه', role:'admin' }];
      LS.write('tables', t);
      // precompute hash async
      sha256('ice').then(h => {
        const x = LS.read('tables') || t;
        x.users[0].password_hash = h;
        LS.write('tables', x);
      });
    }
    return t;
  },
  save(t){ LS.write('tables', t); },
  async findUser(username){
    const t = this.tables();
    return t.users.find(u => u.username === username) || null;
  },
  async addUser(u){ const t = this.tables(); t.users.push(u); this.save(t); },
  async delUser(id){ const t = this.tables(); t.users = t.users.filter(u=>u.id!==id); this.save(t); },
  async listUsers(){ return this.tables().users; },

  async listControls(){ return this.tables().controls; },
  async setControls(rows){
    const t = this.tables();
    t.controls = rows.map(r => ({ id: uuid(), ...r }));
    // wipe assessments that reference removed controls
    const ids = new Set(t.controls.map(c=>c.id));
    t.assessments = t.assessments.filter(a => ids.has(a.control_id));
    this.save(t);
  },
  async wipeControls(){ const t = this.tables(); t.controls=[]; t.assessments=[]; this.save(t); },

  async listPeriods(){ return this.tables().periods; },
  async addPeriod(p){ const t = this.tables(); const row = { id:uuid(), created_at:new Date().toISOString(), ...p }; t.periods.push(row); this.save(t); return row; },
  async delPeriod(id){ const t=this.tables(); t.periods=t.periods.filter(p=>p.id!==id); t.assessments=t.assessments.filter(a=>a.period_id!==id); this.save(t); },

  async listAssessments(pid){
    const t = this.tables();
    return pid ? t.assessments.filter(a=>a.period_id===pid) : t.assessments;
  },
  async upsertAssessment(a){
    const t = this.tables();
    const i = t.assessments.findIndex(x => x.period_id===a.period_id && x.control_id===a.control_id);
    if(i >= 0) t.assessments[i] = { ...t.assessments[i], ...a };
    else t.assessments.push({ id:uuid(), created_at:new Date().toISOString(), ...a });
    this.save(t);
    return t.assessments.find(x => x.period_id===a.period_id && x.control_id===a.control_id);
  }
};

/* =========================================================
   CONNECTION TEST
========================================================= */
async function testConnection(){
  const box = $('#connBox');
  const txt = document.getElementById('connTxt');
  if(!box || !txt || MODE === 'local') return;
  txt.textContent = 'در حال بررسی…';
  box.className = 'diag';

  if(!sb){
    txt.innerHTML = 'کتابخانه Supabase بارگذاری نشد.';
    box.className = 'diag err'; return;
  }

  const controller = new AbortController();
  const timer = setTimeout(()=> controller.abort(), 9000);
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_users?select=id&limit=1`, {
      method: 'GET',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
      signal: controller.signal
    });
    clearTimeout(timer);

    if(res.ok){
      txt.innerHTML = '✅ اتصال به Supabase برقرار است.';
      box.className = 'diag ok';
      return true;
    }
    // Try to read error body
    let body = '';
    try{ body = await res.text(); }catch(e){}
    if(res.status === 404 || (body && body.includes('does not exist'))){
      txt.innerHTML = '⚠️ اتصال برقرار شد ولی <b>جداول ساخته نشده‌اند</b>. اسکریپت SQL را در Supabase اجرا کنید.';
      box.className = 'diag warn';
    } else if(res.status === 401 || res.status === 403){
      txt.innerHTML = '⚠️ کلید Supabase نامعتبر است.';
      box.className = 'diag err';
    } else {
      txt.innerHTML = `⚠️ پاسخ سرور: ${res.status} <code>${esc(body.slice(0,120))}</code>`;
      box.className = 'diag warn';
    }
  }catch(err){
    clearTimeout(timer);
    const msg = String(err && err.message || err);
    if(msg.includes('abort') || msg.includes('timeout') || msg.includes('Failed to fetch') || msg.includes('NetworkError')){
      txt.innerHTML = `❌ <b>اتصال به Supabase برقرار نشد</b>.<br>
        علت‌های محتمل: (۱) پروژه در داشبورد Supabase <b>Paused</b> است → Restore کنید،
        یا (۲) دسترسی به <code>supabase.co</code> در شبکه مختل است (مثلاً فیلترینگ داخل ایران).
        <br>می‌توانید فعلاً روی «حالت محلی» بزنید و بدون اینترنت از سامانه استفاده کنید.`;
      box.className = 'diag err';
    } else {
      txt.innerHTML = `❌ خطا: ${esc(msg)}`;
      box.className = 'diag err';
    }
  }
}

/* =========================================================
   LOGIN
========================================================= */
async function doLogin(username, password){
  const hash = await sha256(password);
  if(MODE === 'local'){
    const u = await LocalDB.findUser(username);
    if(!u) throw new Error('کاربر یافت نشد (حالت محلی).');
    if(u.password_hash && u.password_hash !== hash) throw new Error('رمز نادرست است.');
    return u;
  }
  // Supabase path
  let { data, error } = await sb.from('app_users').select('*').eq('username', username).limit(1);
  if(error){
    if(String(error.message).includes('does not exist')){
      throw new Error('جدول app_users وجود ندارد. اسکریپت SQL را در Supabase اجرا کنید.');
    }
    if(String(error.message).includes('Failed to fetch')){
      throw new Error('اتصال به Supabase برقرار نشد. پروژه Paused است یا شبکه مسدود است.');
    }
    throw new Error('خطا در اتصال: ' + error.message);
  }
  if(!data || !data.length){
    if(username === 'ice'){
      // bootstrap default user
      const { data:d2, error:e2 } = await sb.from('app_users').insert({
        username:'ice', password_hash: await sha256('ice'), full_name:'مدیر سامانه', role:'admin'
      }).select().single();
      if(e2) throw new Error('ساخت کاربر پیش‌فرض ناموفق: ' + e2.message);
      data = [d2];
    } else throw new Error('کاربر یافت نشد.');
  }
  if(data[0].password_hash !== hash) throw new Error('رمز عبور نادرست است.');
  return data[0];
}

/* =========================================================
   DATA LAYER (abstraction over Supabase/Local)
========================================================= */
async function apiListControls(){
  if(MODE === 'local') return LocalDB.listControls();
  const { data, error } = await sb.from('controls').select('*').order('row_no',{ascending:true});
  if(error) throw new Error('خطا در خواندن کنترل‌ها: ' + error.message);
  return data || [];
}
async function apiListPeriods(){
  if(MODE === 'local') return LocalDB.listPeriods();
  const { data, error } = await sb.from('periods').select('*').order('created_at',{ascending:true});
  if(error) throw new Error('خطا در خواندن دوره‌ها: ' + error.message);
  return data || [];
}
async function apiListAssessments(pid){
  if(MODE === 'local') return LocalDB.listAssessments(pid);
  let q = sb.from('assessments').select('*');
  if(pid) q = q.eq('period_id', pid);
  const { data, error } = await q;
  if(error) throw new Error('خطا در خواندن ارزیابی‌ها: ' + error.message);
  return data || [];
}
async function apiSaveAssessment(controlId, payload){
  if(MODE === 'local'){
    return LocalDB.upsertAssessment({ period_id:S.periodId, control_id:controlId, ...payload });
  }
  const existing = S.assessments[controlId];
  if(existing){
    const { data, error } = await sb.from('assessments').update(payload).eq('id', existing.id).select().single();
    if(error) throw new Error(error.message);
    return data;
  }
  const { data, error } = await sb.from('assessments').insert({ period_id:S.periodId, control_id:controlId, ...payload }).select().single();
  if(error) throw new Error(error.message);
  return data;
}
async function apiUpload(file, controlId){
  if(MODE === 'local'){
    // convert to data URL (small files only)
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res({ url:r.result, name:file.name });
      r.onerror = () => rej(new Error('خواندن فایل ممکن نشد'));
      r.readAsDataURL(file);
    });
  }
  const safe = file.name.replace(/[^\w.\-آ-ی]/g, '_');
  const path = `${S.periodId}/${controlId}/${Date.now()}_${safe}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { upsert:true });
  if(error) throw new Error('آپلود فایل ناموفق: ' + error.message);
  const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
  return { url: data.publicUrl, name: file.name };
}

async function loadControls(){
  S.controls = await apiListControls();
  S.units = [...new Set(S.controls.map(c=>c.owner_unit).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  S.cats  = [...new Set(S.controls.map(c=>c.category).filter(Boolean))];
  S.levels= [...new Set(S.controls.map(c=>c.level).filter(Boolean))];
}
async function loadPeriods(){
  S.periods = await apiListPeriods();
  if(S.periods.length && !S.periods.find(p=>p.id===S.periodId)){
    S.periodId = S.periods[0].id;
  }
}
async function loadAssessments(){
  S.assessments = {};
  if(!S.periodId) return;
  const rows = await apiListAssessments(S.periodId);
  rows.forEach(a => S.assessments[a.control_id] = a);
}
async function loadAllAssessments(){
  S.allAssessments = await apiListAssessments(null);
}

/* =========================================================
   DERIVED
========================================================= */
function controlStatus(c){
  const a = S.assessments[c.id];
  return (a && a.status) || c.status || '—';
}
function controlProgress(c){
  const a = S.assessments[c.id];
  if(a && a.progress !== null && a.progress !== undefined && a.progress !== '') return Number(a.progress);
  return statusWeight(controlStatus(c));
}
function assessmentMapFor(pid){
  const m = {};
  S.allAssessments.filter(a=>a.period_id===pid).forEach(a => m[a.control_id]=a);
  return m;
}
function progressWithMap(c, map){
  const a = map[c.id];
  if(a && a.progress !== null && a.progress !== undefined && a.progress !== '') return Number(a.progress);
  return statusWeight((a && a.status) || c.status);
}

  S.controls.forEach(c => { counts[normalizeStatus(controlStatus(c))]++; sum += controlProgress(c); });
  const avg = total ? Math.round(sum/total) : 0;

  const byUnit = {};
  S.controls.forEach(c => {
    const u = c.owner_unit || 'نامشخص';
    if(!byUnit[u]) byUnit[u] = { n:0, sum:0, ok:0, doing:0, bad:0 };
    byUnit[u].n++; byUnit[u].sum += controlProgress(c);

========================================================= */
function filteredControls(){
  const f = S.filters;
  return S.controls.filter(c => {
    if(f.unit && c.owner_unit!==f.unit) return false;
    if(f.cat && c.category!==f.cat) return false;
    if(f.level && c.level!==f.level) return false;
    if(f.status && normalizeStatus(controlStatus(c))!==f.status) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = `${c.title||''} ${c.evidence||''} ${c.owner_unit||''} ${c.category||''} ${c.row_no||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function viewTrend(){

        }).join('');
        return `<tr><td style="font-weight:700">${esc(u)}</td>${cells}</tr>`;
      }).join('')}</tbody>
    </table></div>

  <div class="card">

    ${S.periods.slice().reverse().map(p=>{
      const acts = S.allAssessments.filter(a=>a.period_id===p.id && (a.actions||'').trim());

          const c = S.controls.find(x=>x.id===a.control_id);
          return `<div style="background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:11px;padding:11px;margin-bottom:8px">
            <div style="font-size:12px;color:#a9bcdb;margin-bottom:5px">

              ${a.status?`<span class="badge ${statusClass(a.status)}">${esc(normalizeStatus(a.status))}</span>`:''}

        }).join('')}
      </div>`;
    }).join('') || '<div class="empty">اقدامی ثبت نشده.</div>'}
  </div>`;
}
function lineChart(series){
  if(!series.length) return '<div class="empty">—</div>';
  const W=640, H=240, PAD=38, n=series.length;
  const xs = i => n===1?W/2:PAD+i*(W-2*PAD)/(n-1);
  const ys = v => H-PAD-(v/100)*(H-2*PAD);
  const path = series.map((s,i)=>`${i?'L':'M'}${xs(i).toFixed(1)},${ys(s.value).toFixed(1)}`).join(' ');
  const area = `${path} L${xs(n-1).toFixed(1)},${H-PAD} L${xs(0).toFixed(1)},${H-PAD} Z`;
  return `<div style="width:100%;overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:340px;height:auto">
    <defs>
      <linearGradient id="gline" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#22d3ee" stop-opacity=".38"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#7c3aed"/>
      </linearGradient>
    </defs>
    ${[0,25,50,75,100].map(v=>`
      <line x1="${PAD}" y1="${ys(v)}" x2="${W-PAD}" y2="${ys(v)}" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
      <text x="${PAD-8}" y="${ys(v)+4}" fill="#5b6b8c" font-size="10" text-anchor="end">${v}%</text>`).join('')}
    <path d="${area}" fill="url(#gline)"/>
    <path d="${path}" fill="none" stroke="url(#stroke)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${series.map((s,i)=>`
      <circle cx="${xs(i)}" cy="${ys(s.value)}" r="5" fill="#0b1120" stroke="#22d3ee" stroke-width="2.5"/>
      <text x="${xs(i)}" y="${ys(s.value)-13}" fill="#e9f0ff" font-size="11" font-weight="700" text-anchor="middle">${fa(s.value)}٪</text>
      <text x="${xs(i)}" y="${H-12}" fill="#8ba0c4" font-size="10" text-anchor="middle">${esc(s.name.length>16?s.name.slice(0,16)+'…':s.name)}</text>`).join('')}
  </svg></div>`;
}

function bindView(){
  const c = $('#content');
  if(S.view==='controls'){
    const rebind = () => { c.innerHTML = viewControls(); bindView(); };
    $('#fQ')?.addEventListener('input', e => { S.filters.q = e.target.value; S.page = 1; c.innerHTML = viewControls(); bindView(); const el = $('#fQ'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); });
    $('#fUnit')?.addEventListener('change', e => { S.filters.unit = e.target.value; S.page = 1; rebind(); });
    $('#fStatus')?.addEventListener('change', e => { S.filters.status = e.target.value; S.page = 1; rebind(); });
    $('#fCat')?.addEventListener('change', e => { S.filters.cat = e.target.value; S.page = 1; rebind(); });
    $('#fLevel')?.addEventListener('change', e => { S.filters.level = e.target.value; S.page = 1; rebind(); });
    $('#fSize')?.addEventListener('change', e => { S.pageSize = Number(e.target.value); S.page = 1; rebind(); });
    $('#clearFilters')?.addEventListener('click', () => { S.filters = {q:'',unit:'',status:'',cat:'',level:''}; S.page = 1; rebind(); });
    c.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => { S.page = Number(b.dataset.page); rebind(); window.scrollTo({top:0,behavior:'smooth'}); }));
    c.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openControlModal(el.dataset.open)));
  }
  if(S.view==='assess'){
    $('#asUnit')?.addEventListener('change', e => { S.assessUnit = e.target.value; c.innerHTML = viewAssess(); bindView(); });
    c.querySelectorAll('.as-item').forEach(item => {
      const cid = item.dataset.cid;
      const range = item.querySelector('.a-range');
      const pval = item.querySelector('.p-val');
      const statusSel = item.querySelector('.a-status');
      range.addEventListener('input', () => { pval.textContent = fa(range.value)+'٪'; });
      statusSel.addEventListener('change', () => { const w = statusWeight(statusSel.value); range.value = w; pval.textContent = fa(w)+'٪'; });
      item.querySelector('.a-save').addEventListener('click', async ev => {
        const btn = ev.currentTarget; btn.disabled = true; btn.textContent = 'در حال ذخیره…';
        try{
          const payload = {
            status: statusSel.value,
            progress: Number(range.value),
            actions: item.querySelector('.a-actions').value.trim(),
            updated_by: S.user?.username || '',
            updated_at: new Date().toISOString()
          };
          const fi = item.querySelector('.a-file');
          if(fi.files && fi.files[0]){
            const up = await apiUpload(fi.files[0], cid);
            payload.file_url = up.url; payload.file_name = up.name;
          }
          const saved = await apiSaveAssessment(cid, payload);
          S.assessments[cid] = saved;
          const s = item.querySelector('.saved'); s.style.display = 'inline'; setTimeout(()=>s.style.display='none', 2000);
          toast('ذخیره شد ✔','ok');
        }catch(err){ toast('خطا: '+err.message,'err'); }
        finally{ btn.disabled = false; btn.textContent = '💾 ذخیره'; }
      });
    });
  }
  if(S.view==='trend'){
    $('#trendUnit')?.addEventListener('change', e => { S._trendUnit = e.target.value; c.innerHTML = viewTrend(); bindView(); });
  }
  if(S.view==='periods'){
    $('#addPeriod')?.addEventListener('click', async () => {
      const name = ($('#pName').value||'').trim();
      if(!name) return toast('نام دوره را وارد کنید','err');
      try{
        let row;
        if(MODE==='local'){
          row = await LocalDB.addPeriod({ name, start_date:$('#pStart').value||null, end_date:$('#pEnd').value||null });
        } else {
          const { data, error } = await sb.from('periods').insert({ name, start_date:$('#pStart').value||null, end_date:$('#pEnd').value||null }).select().single();
          if(error) throw error; row = data;
        }
        await loadPeriods();
        S.periodId = row.id;
        renderPeriodSelect(); await loadAssessments();
        toast('دوره ایجاد شد ✔','ok');
        c.innerHTML = viewPeriods(); bindView();
      }catch(err){ toast('خطا: '+err.message,'err'); }
    });
    c.querySelectorAll('[data-selperiod]').forEach(b => b.addEventListener('click', async () => {
      S.periodId = b.dataset.selperiod; renderPeriodSelect(); await loadAssessments();
      toast('دوره انتخاب شد','ok'); c.innerHTML = viewPeriods(); bindView();
    }));
    c.querySelectorAll('[data-delperiod]').forEach(b => b.addEventListener('click', async () => {
      if(!confirm('حذف دوره و ارزیابی‌های آن؟')) return;
      try{
        if(MODE==='local') await LocalDB.delPeriod(b.dataset.delperiod);
        else { const { error } = await sb.from('periods').delete().eq('id', b.dataset.delperiod); if(error) throw error; }
        await loadPeriods(); if(!S.periods.find(p=>p.id===S.periodId)) S.periodId = S.periods[0]?.id || null;
        renderPeriodSelect(); await loadAssessments();
        toast('حذف شد','ok'); c.innerHTML = viewPeriods(); bindView();
      }catch(err){ toast('خطا: '+err.message,'err'); }
    }));
  }
  if(S.view==='users'){
    renderUsersList().then(() => {
      document.querySelectorAll('[data-deluser]').forEach(b => b.addEventListener('click', async () => {
        if(!confirm('حذف کاربر؟')) return;
        try{
          if(MODE==='local') await LocalDB.delUser(b.dataset.deluser);
          else { const { error } = await sb.from('app_users').delete().eq('id', b.dataset.deluser); if(error) throw error; }
          toast('حذف شد','ok'); renderUsersList();
        }catch(err){ toast('خطا: '+err.message,'err'); }
      }));
    });
    $('#addUser')?.addEventListener('click', async () => {
      const u = ($('#nuUser').value||'').trim(), p = ($('#nuPass').value||'').trim(), n = ($('#nuName').value||'').trim(), r = $('#nuRole').value;
      if(!u || !p) return toast('نام کاربری و رمز الزامی است','err');
      try{
        const hash = await sha256(p);
        if(MODE==='local'){
          if(await LocalDB.findUser(u)) throw new Error('کاربر تکراری است');
          await LocalDB.addUser({ id:uuid(), username:u, password_hash:hash, full_name:n, role:r });
        } else {
          const { error } = await sb.from('app_users').insert({ username:u, password_hash:hash, full_name:n, role:r });
          if(error) throw error;
        }
        toast('کاربر اضافه شد ✔','ok');
        $('#nuUser').value = ''; $('#nuPass').value = ''; $('#nuName').value = '';
        renderUsersList();
      }catch(err){ toast('خطا: '+err.message,'err'); }
    });
  }
  if(S.view==='import'){
    $('#wipeControls')?.addEventListener('click', async () => {
      if(!confirm('همه کنترل‌ها و ارزیابی‌های مرتبط حذف شوند؟')) return;
      try{
        if(MODE==='local') await LocalDB.wipeControls();
        else { const { error } = await sb.from('controls').delete().not('id','is',null); if(error) throw error; }
        await loadControls(); toast('حذف شد','ok'); c.innerHTML = viewImport(); bindView();
      }catch(err){ toast('خطا: '+err.message,'err'); }
    });
    $('#doImport')?.addEventListener('click', async () => {
      const file = $('#xlsFile').files[0]; const log = $('#importLog');
      if(!file) return toast('فایل را انتخاب کنید','err');
      log.textContent = 'در حال خواندن…';
      try{
        const rows = await parseSheet(file);
        if(!rows.length) throw new Error('فایل خالی است');
        const mapped = rows.map(r => {
          const g = (...names) => {
            for(const n of names){
              const key = Object.keys(r).find(k => String(k).trim()===n);
              if(key!==undefined && String(r[key]).trim()!=='') return String(r[key]).trim();
            }
            return '';
          };
          return {
            row_no: Number(g('ردیف'))||null,
            category: g('دسته')||null,
            level: g('سطح پیشرفتگی')||null,
            title: g('کنترل')||'',
            evidence: g('شواهد')||'',
            status: g('وضعیت پیاده‌سازی')||null,
            owner_unit: g('واحد مسئول رسیدگی')||null
          };
        }).filter(x=>x.title);
        if(!mapped.length) throw new Error('ستون‌ها شناسایی نشدند.');
        log.textContent = `${fa(mapped.length)} رکورد. در حال بارگذاری…`;
        if(MODE==='local'){
          await LocalDB.setControls(mapped);
        } else {
          const del = await sb.from('controls').delete().not('id','is',null);
          if(del.error) throw del.error;
          const CH = 100;
          for(let i = 0; i < mapped.length; i += CH){
            const part = mapped.slice(i, i+CH);
            const { error } = await sb.from('controls').insert(part);
            if(error) throw error;
            log.textContent = `${fa(Math.min(i+CH, mapped.length))} از ${fa(mapped.length)}`;
          }
        }
        await loadControls();
        log.innerHTML = `<span style="color:#4ade80;font-weight:700">✔ ${fa(mapped.length)} کنترل بارگذاری شد.</span>`;
        toast('بارگذاری کامل شد ✔','ok'); render();
      }catch(err){
        log.innerHTML = `<span style="color:#f87171">خطا: ${esc(err.message||err)}</span>`;
        toast('خطا در بارگذاری','err');
      }
    });
  }
}
function parseSheet(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        res(XLSX.utils.sheet_to_json(ws, { defval:'', raw:false }));
      }catch(err){ rej(err); }
    };
    r.onerror = () => rej(new Error('خواندن فایل ناموفق'));
    r.readAsArrayBuffer(file);
  });
}

/* =========================================================
   MODAL
========================================================= */
function openControlModal(id){
  const c = S.controls.find(x=>x.id===id); if(!c) return;
  const a = S.assessments[c.id] || {};
  const st = controlStatus(c), pr = controlProgress(c);
  const periodName = (S.periods.find(p=>p.id===S.periodId)||{}).name || '—';
  $('#modalHost').innerHTML = `<div class="modal" id="modalBg"><div class="modal-box">
    <button class="close-x" id="closeModal">✕</button>
    <h3>#${fa(c.row_no??'')} — ${esc(c.title)}</h3>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">
      <span class="badge badge-soft">${esc(c.category||'—')}</span>
      <span class="badge badge-soft">سطح: ${esc(c.level||'—')}</span>
      <span class="badge ${statusClass(st)}">${esc(normalizeStatus(st))}</span>
      <span class="badge badge-soft">${esc(c.owner_unit||'—')}</span>
    </div>
    <div class="kv"><div class="k">متن کنترل</div><div class="v">${esc(c.title)}</div></div>
    <div class="kv"><div class="k">شواهد ارزیابی</div><div class="v">${esc(c.evidence||'—')}</div></div>
    <div class="kv"><div class="k">وضعیت دوره «${esc(periodName)}»</div>
      <div class="v" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="badge ${statusClass(st)}">${esc(normalizeStatus(st))}</span>
        <div class="bar" style="flex:1;min-width:120px"><i style="width:${pr}%"></i></div>
        <b style="color:#22d3ee">${fa(pr)}٪</b>
      </div></div>
    ${a.actions?`<div class="kv"><div class="k">اقدامات این دوره</div><div class="v">${esc(a.actions)}</div></div>`:''}
    ${a.file_url?`<div class="kv"><div class="k">پیوست</div><div class="v"><a href="${esc(a.file_url)}" target="_blank" rel="noopener">📎 ${esc(a.file_name||'دانلود')}</a></div></div>`:''}
    <button class="btn btn-primary btn-full" id="goAssess" style="margin-top:8px">✏️ فرم ارزیابی این واحد</button>
  </div></div>`;
  const close = () => $('#modalHost').innerHTML = '';
  $('#closeModal').addEventListener('click', close);
  $('#modalBg').addEventListener('click', e => { if(e.target.id==='modalBg') close(); });
  $('#goAssess').addEventListener('click', () => { S.assessUnit = c.owner_unit||''; S.view = 'assess'; close(); render(); });
}

/* =========================================================
   GLOBAL EVENTS
========================================================= */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), err = $('#loginErr');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'در حال بررسی…';
  try{
    const u = await doLogin($('#luser').value.trim(), $('#lpass').value);
    startSession(u);
  }catch(ex){ err.textContent = ex.message || 'ورود ناموفق'; }
  finally{ btn.disabled = false; btn.textContent = 'ورود به سامانه'; }
});

$('#retestBtn').addEventListener('click', async () => {
  if(MODE==='local'){ setMode('supabase'); } else { await testConnection(); }
});
$('#localModeBtn').addEventListener('click', () => {
  setMode('local');
  toast('حالت محلی فعال — داده‌ها در مرورگر ذخیره می‌شوند','ok');
});
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]'); if(!b) return;
  S.view = b.dataset.view;
  $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show');
  render();
});
$('#globalPeriod').addEventListener('change', async e => {
  S.periodId = e.target.value || null;
  await loadAssessments();
  toast('دوره تغییر کرد','ok'); render();
});
$('#menuBtn').addEventListener('click', () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); });
$('#overlay').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); });
$('#logoutBtn').addEventListener('click', logout);
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); $('#modalHost').innerHTML=''; }
});

/* particles */
(function(){
  const host = document.getElementById('particles'); if(!host) return;
  for(let i=0;i<34;i++){
    const p = document.createElement('span'); p.className = 'pt';
    const sz = (Math.random()*3+1.5).toFixed(1);
    p.style.width = sz+'px'; p.style.height = sz+'px';
    p.style.left = (Math.random()*100)+'%'; p.style.top = (Math.random()*100+20)+'%';
    p.style.animationDuration = (Math.random()*14+11)+'s';
    p.style.animationDelay = (-Math.random()*22)+'s';
    p.style.opacity = (Math.random()*.55+.25);
    host.appendChild(p);
  }
})();

updateConnBox();
