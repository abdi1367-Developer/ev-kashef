<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>کاشف ۴۹۵ | پایش کنترل‌های امنیتی</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
:root{
  --white:#ffffff;
  --bg:#fafafa;
  --line:#e4e4e7;
  --line2:#d4d4d8;
  --txt:#09090b;
  --txt2:#3f3f46;
  --muted:#71717a;
  --dim:#a1a1aa;
  --faint:#f4f4f5;
  --black:#18181b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:'Vazirmatn',system-ui,-apple-system,sans-serif;
  background:var(--white);color:var(--txt);
  font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:0}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
::-webkit-scrollbar-track{background:transparent}
a{color:var(--txt);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
.hidden{display:none!important}

/* ============ LOGIN ============ */
.login-wrap{
  position:fixed;inset:0;display:grid;place-items:center;
  overflow:hidden;z-index:200;padding:16px;
  background:var(--white);
}
.bg-anim{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(var(--faint) 1px,transparent 1px),
    linear-gradient(90deg,var(--faint) 1px,transparent 1px);
  background-size:48px 48px;
  opacity:.8;
}
.rotor{
  position:absolute;border:1px solid var(--faint);
  top:50%;left:50%;pointer-events:none;
}
.rotor-a{
  width:56vmin;height:56vmin;
  transform:translate(-50%,-50%) rotate(0deg);
  animation:rot 180s linear infinite;
}
.rotor-b{
  width:34vmin;height:34vmin;
  border-style:dashed;border-color:var(--line);
  transform:translate(-50%,-50%) rotate(0deg);
  animation:rot 240s linear infinite reverse;
}
.rotor-c{
  width:80vmin;height:80vmin;
  border-color:var(--faint);
  transform:translate(-50%,-50%) rotate(0deg);
  animation:rot 320s linear infinite;
}
@keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}

.login-card{
  position:relative;z-index:3;
  width:min(380px,94vw);
  padding:36px 28px 28px;
  background:var(--white);
  border:1px solid var(--txt);
  box-shadow:none;
  animation:pop .5s ease;
}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.kashaf{
  font-size:11px;font-weight:600;
  letter-spacing:.32em;
  color:var(--txt);
  text-align:center;
  text-transform:uppercase;
  margin-bottom:14px;
}
.kashaf-rule{height:1px;background:var(--txt);margin-bottom:22px}
.login-card h1{
  font-size:15px;font-weight:600;
  margin:0 0 4px;text-align:center;
  letter-spacing:.02em;
}
.login-card .sub{
  margin:0 0 26px;text-align:center;
  color:var(--muted);font-size:11.5px;
  letter-spacing:.02em;
}

.field{margin-bottom:14px}
.field label{
  display:block;font-size:10px;
  color:var(--muted);margin-bottom:6px;
  letter-spacing:.15em;font-weight:500;
}
.field input{
  width:100%;padding:10px 12px;
  border:1px solid var(--txt);
  background:var(--white);color:var(--txt);
  outline:none;font-size:13px;
  border-radius:0;
  font-variant-numeric:tabular-nums;
}
.field input:focus{background:var(--faint)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border:1px solid var(--txt);
  background:var(--white);color:var(--txt);
  cursor:pointer;font-weight:500;font-size:12.5px;
  transition:background .12s,color .12s;
  border-radius:0;
  letter-spacing:.02em;
}
.btn:hover{background:var(--faint)}
.btn:active{background:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--txt);color:var(--white);border-color:var(--txt)}
.btn-primary:hover{background:var(--txt2);border-color:var(--txt2)}
.btn-full{width:100%;padding:12px}
.btn-sm{padding:6px 10px;font-size:11.5px}
.btn-danger{background:var(--white);color:var(--txt);border-color:var(--txt)}

.err{color:var(--txt);font-size:11.5px;text-align:center;margin-top:10px;min-height:14px;letter-spacing:.02em;font-weight:500}
.diag{
  margin:0 0 16px;padding:9px 11px;
  border:1px solid var(--line);
  background:var(--faint);
  font-size:10.5px;line-height:1.7;
  color:var(--muted);
  letter-spacing:.02em;
}
.diag.ok{background:var(--white);border-color:var(--txt)}
.diag.err{background:var(--white);border-color:var(--txt);border-style:dashed}
.diag.warn{background:var(--white);border-color:var(--line2)}
.diag b{color:var(--txt);font-weight:600}
.diag code{background:var(--white);padding:1px 4px;font-family:'Vazirmatn',monospace;font-size:10px;border:1px solid var(--line)}

.hint{
  text-align:center;color:var(--dim);
  font-size:10.5px;margin-top:16px;
  letter-spacing:.06em;
  padding-top:16px;
  border-top:1px solid var(--line);
}
.hint b{color:var(--txt);font-weight:600}

.mode-toggle{
  display:flex;gap:0;margin-top:12px;
  border:1px solid var(--txt);
}
.mode-toggle button{
  flex:1;padding:8px 6px;font-size:10.5px;
  background:var(--white);color:var(--txt);
  border:none;cursor:pointer;
  letter-spacing:.05em;font-weight:500;
}
.mode-toggle button:first-child{border-left:1px solid var(--txt)}
.mode-toggle button:hover{background:var(--faint)}

/* ============ APP ============ */
#app{display:flex;min-height:100dvh;width:100%;background:var(--white)}

.sidebar{
  width:220px;flex:0 0 220px;
  height:100dvh;position:sticky;top:0;z-index:50;
  background:var(--white);
  border-left:1px solid var(--txt);
  display:flex;flex-direction:column;
  padding:22px 14px;
  overflow:hidden;
}
.brand{
  padding:0 6px 18px;
  border-bottom:1px solid var(--txt);
  margin-bottom:18px;
  flex-shrink:0;
}
.brand b{
  display:block;font-size:13px;
  font-weight:600;color:var(--txt);
  letter-spacing:.16em;
  margin-bottom:4px;
}
.brand span{
  display:block;font-size:10px;
  color:var(--muted);letter-spacing:.06em;
}
.nav{display:flex;flex-direction:column;gap:0;flex:1;min-height:0;overflow:hidden}
.nav button{
  display:flex;align-items:center;
  width:100%;padding:9px 10px;
  border:none;background:transparent;
  color:var(--muted);
  cursor:pointer;font-weight:500;
  font-size:12px;text-align:right;
  transition:background .12s,color .12s;
  border-radius:0;
  flex-shrink:0;
  letter-spacing:.02em;
  border-right:2px solid transparent;
  padding-right:8px;
}
.nav button:hover{color:var(--txt);background:var(--faint)}
.nav button.active{
  color:var(--txt);
  font-weight:600;
  border-right:2px solid var(--txt);
  background:var(--faint);
}

.side-foot{
  border-top:1px solid var(--txt);
  padding-top:14px;margin-top:14px;
  flex-shrink:0;
}
.user-chip{
  display:flex;align-items:center;gap:9px;
  padding:8px 4px;margin-bottom:10px;
}
.user-chip .av{
  width:26px;height:26px;
  border:1px solid var(--txt);
  display:grid;place-items:center;
  font-weight:600;font-size:10px;
  color:var(--txt);flex:0 0 auto;
  letter-spacing:.02em;
}
.user-chip b{
  display:block;font-size:11.5px;
  color:var(--txt);font-weight:600;
  line-height:1.25;letter-spacing:.02em;
}
.user-chip span{
  display:block;font-size:9.5px;
  color:var(--muted);margin-top:2px;
  letter-spacing:.06em;
}
.mode-line{
  display:flex;align-items:center;gap:6px;
  padding:6px 4px;margin-bottom:8px;
  font-size:9.5px;color:var(--muted);
  letter-spacing:.14em;font-weight:500;
}
.mode-line::before{
  content:'';width:6px;height:6px;
  background:var(--txt);flex:0 0 auto;
}
.mode-line.local::before{background:var(--dim)}
.side-foot .btn{
  padding:7px;font-size:11px;
  letter-spacing:.08em;font-weight:500;
}

.overlay{
  position:fixed;inset:0;background:rgba(9,9,11,.32);
  z-index:45;opacity:0;pointer-events:none;
  transition:opacity .2s;
}
.overlay.show{opacity:1;pointer-events:auto}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;width:100%}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:16px 24px;
  background:var(--white);
  border-bottom:1px solid var(--txt);
}
.topbar h2{
  margin:0;font-size:13px;
  font-weight:600;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;
  letter-spacing:.06em;
  color:var(--txt);
}
.icon-btn{
  width:34px;height:34px;
  border:1px solid var(--txt);
  background:var(--white);color:var(--txt);
  cursor:pointer;display:none;place-items:center;
  font-size:15px;flex:0 0 auto;
  border-radius:0;
}
.icon-btn:hover{background:var(--faint)}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.top-actions select{
  padding:8px 11px;
  border:1px solid var(--txt);
  background:var(--white);color:var(--txt);
  outline:none;font-size:11.5px;
  border-radius:0;letter-spacing:.02em;
  max-width:200px;
  font-variant-numeric:tabular-nums;
}
.content{flex:1;padding:24px;width:100%;min-width:0}

/* ============ COMPONENTS ============ */
.grid{display:grid;gap:16px;width:100%}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

.card{
  background:var(--white);
  border:1px solid var(--txt);
  padding:20px;min-width:0;
  border-radius:0;
}
.card h3{
  margin:0 0 16px;font-size:10.5px;
  font-weight:600;color:var(--muted);
  display:flex;align-items:center;gap:8px;
  letter-spacing:.16em;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.card h3 .dot{
  width:5px;height:5px;background:var(--txt);flex:0 0 auto;
}

.kpi .v{
  font-size:32px;font-weight:600;
  line-height:1;color:var(--txt);
  letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.kpi .l{
  color:var(--muted);font-size:10px;
  margin-top:8px;letter-spacing:.14em;
  font-weight:500;
}

.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 8px;font-size:10px;
  white-space:nowrap;font-weight:500;
  letter-spacing:.06em;
  border-radius:0;
  border:1px solid transparent;
}
.st-ok{background:var(--txt);color:var(--white);border-color:var(--txt)}
.st-warn{background:var(--white);color:var(--txt);border-color:var(--txt)}
.st-bad{background:var(--white);color:var(--muted);border-color:var(--line2);border-style:dashed}
.st-gray{background:transparent;color:var(--dim);border-color:var(--line)}
.badge-soft{background:var(--faint);color:var(--muted);border-color:var(--line)}

.bar-row{display:grid;grid-template-columns:1fr 42px;gap:12px;align-items:center;margin:10px 0}
.bar-row .nm{
  font-size:11.5px;color:var(--txt);font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  letter-spacing:.02em;
}
.bar-row .pc{
  font-size:11px;font-weight:600;text-align:left;
  color:var(--txt);
  font-variant-numeric:tabular-nums;
}
.bar{
  height:4px;background:var(--faint);
  overflow:hidden;margin-top:6px;border-radius:0;
}
.bar>i{
  display:block;height:100%;background:var(--txt);
  transition:width .6s cubic-bezier(.2,.9,.3,1);
}

.donut-wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center}
.donut{
  width:150px;height:150px;border-radius:50%;
  position:relative;display:grid;place-items:center;flex:0 0 auto;
}
.donut::before{
  content:'';position:absolute;inset:22px;
  border-radius:50%;background:var(--white);
}
.donut .mid{position:relative;z-index:2;text-align:center}
.donut .mid b{
  display:block;font-size:26px;font-weight:600;
  line-height:1;color:var(--txt);
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.donut .mid span{
  font-size:9.5px;color:var(--muted);
  margin-top:4px;letter-spacing:.14em;
  display:block;font-weight:500;
}
.legend{display:flex;flex-direction:column;gap:10px;min-width:160px}
.legend div{
  display:flex;align-items:center;gap:10px;
  font-size:11px;color:var(--txt);
  letter-spacing:.02em;
}
.legend i{
  width:8px;height:8px;flex:0 0 auto;
  border-radius:0;
  border:1px solid var(--txt);
}
.legend b{
  margin-right:auto;color:var(--txt);
  font-weight:600;font-variant-numeric:tabular-nums;
}

.toolbar{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:8px;margin-bottom:14px;
}
.toolbar input,.toolbar select{
  padding:9px 11px;
  border:1px solid var(--txt);
  background:var(--white);color:var(--txt);
  outline:none;width:100%;font-size:11.5px;
  border-radius:0;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
}
.toolbar input:focus,.toolbar select:focus{background:var(--faint)}
.toolbar input::placeholder{color:var(--dim);letter-spacing:.02em}

.list{display:grid;gap:10px}
.ctrl{
  background:var(--white);
  border:1px solid var(--line2);
  padding:14px 16px;
  cursor:pointer;transition:border-color .12s;min-width:0;
  border-radius:0;
}
.ctrl:hover{border-color:var(--txt)}
.cc-head{
  display:flex;align-items:center;gap:6px;
  flex-wrap:wrap;margin-bottom:10px;
}
.cc-no{
  font-size:10px;color:var(--muted);
  font-weight:500;margin-right:auto;
  letter-spacing:.08em;
  font-variant-numeric:tabular-nums;
}
.cc-title{
  font-size:12.5px;line-height:1.85;
  font-weight:500;margin-bottom:8px;
  color:var(--txt);letter-spacing:.01em;
}
.cc-ev{
  font-size:11px;line-height:1.85;
  color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;
  letter-spacing:.01em;
}
.cc-foot{
  margin-top:12px;display:flex;align-items:center;gap:12px;
}
.cc-foot .bar{flex:1;margin:0}
.cc-foot b{
  font-size:10.5px;color:var(--txt);
  min-width:38px;text-align:left;
  font-weight:600;
  font-variant-numeric:tabular-nums;
}

.pager{
  display:flex;align-items:center;justify-content:center;
  gap:8px;margin-top:20px;flex-wrap:wrap;
}
.pager .info{
  color:var(--muted);font-size:10.5px;
  padding:0 8px;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;
}

.as-item{
  background:var(--white);
  border:1px solid var(--line2);
  padding:16px;margin-bottom:10px;
  border-radius:0;
}
.as-item .t{
  font-size:12.5px;font-weight:500;
  line-height:1.9;margin-bottom:12px;
  color:var(--txt);letter-spacing:.01em;
}
.as-item .t .n{
  color:var(--muted);font-weight:600;
  margin-left:6px;font-size:11px;
  font-variant-numeric:tabular-nums;
  letter-spacing:.06em;
}
.as-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;margin-bottom:10px;
}
.as-grid label{
  display:block;font-size:10px;
  color:var(--muted);margin-bottom:5px;
  font-weight:500;letter-spacing:.12em;
}
.as-grid select,.as-grid input{
  width:100%;padding:8px 10px;
  border:1px solid var(--txt);
  background:var(--white);color:var(--txt);
  outline:none;font-size:11.5px;
  border-radius:0;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;
}
.as-grid select:focus,.as-grid input:focus{background:var(--faint)}
input[type=range]{
  width:100%;accent-color:var(--txt);
  margin-top:8px;border-radius:0;
}
textarea{
  width:100%;padding:10px 12px;
  border:1px solid var(--txt);
  background:var(--white);color:var(--txt);
  outline:none;resize:vertical;
  min-height:66px;line-height:1.8;
  font-size:11.5px;border-radius:0;
  letter-spacing:.01em;
}
textarea:focus{background:var(--faint)}
input[type=file]{
  width:100%;padding:7px;
  border:1px dashed var(--line2);
  background:var(--white);color:var(--muted);
  font-size:10.5px;cursor:pointer;
  border-radius:0;letter-spacing:.02em;
}
.as-foot{
  display:flex;align-items:center;gap:10px;
  margin-top:12px;flex-wrap:wrap;
}
.saved{
  color:var(--txt);font-size:10.5px;
  font-weight:600;letter-spacing:.12em;
}

.tbl-wrap{overflow-x:auto;width:100%}
table{
  width:100%;border-collapse:collapse;
  font-size:11.5px;min-width:520px;
}
th,td{
  padding:10px 12px;text-align:right;
  border-bottom:1px solid var(--line);
  letter-spacing:.02em;
}
th{
  color:var(--muted);font-weight:600;
  font-size:9.5px;background:var(--faint);
  white-space:nowrap;letter-spacing:.14em;
  border-bottom:1px solid var(--txt);
}
tbody tr:hover{background:var(--faint)}
tbody td{font-variant-numeric:tabular-nums}

.modal{
  position:fixed;inset:0;z-index:300;
  display:grid;place-items:center;padding:16px;
  background:rgba(9,9,11,.4);
  animation:fade .18s;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{
  width:min(760px,100%);max-height:88dvh;overflow:auto;
  border:1px solid var(--txt);
  background:var(--white);
  padding:24px;
  border-radius:0;
  animation:pop .2s ease;
}
.modal-box h3{
  margin:0 0 16px;font-size:13px;
  font-weight:600;line-height:1.9;
  color:var(--txt);letter-spacing:.01em;
  padding-bottom:12px;
  border-bottom:1px solid var(--line);
}
.kv{margin-bottom:14px}
.kv .k{
  font-size:9.5px;color:var(--muted);
  margin-bottom:6px;font-weight:600;
  letter-spacing:.14em;
}
.kv .v{
  font-size:12px;line-height:1.95;
  background:var(--faint);
  padding:11px 13px;
  border:1px solid var(--line);
  border-radius:0;letter-spacing:.01em;
}
.close-x{
  position:sticky;top:0;float:left;
  background:var(--white);color:var(--txt);
  border:1px solid var(--txt);
  width:28px;height:28px;
  cursor:pointer;font-size:14px;
  border-radius:0;line-height:1;
}
.close-x:hover{background:var(--faint)}

.toast{
  position:fixed;bottom:22px;left:50%;
  transform:translateX(-50%) translateY(100px);
  z-index:400;padding:10px 20px;
  background:var(--txt);color:var(--white);
  font-size:11px;font-weight:500;
  letter-spacing:.08em;
  border-radius:0;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.15);
}
.toast.show{transform:translateX(-50%) translateY(0)}

.empty{
  text-align:center;padding:48px 16px;
  color:var(--muted);font-size:11.5px;
  line-height:1.9;letter-spacing:.04em;
}
.spin{
  width:22px;height:22px;
  border:1.5px solid var(--line);
  border-top-color:var(--txt);
  border-radius:50%;
  animation:sp .8s linear infinite;
  margin:0 auto 12px;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============ RESPONSIVE ============ */
@media(max-width:900px){
  .sidebar{
    position:fixed;top:0;right:0;
    height:100dvh;
    transform:translateX(100%);
    transition:transform .26s cubic-bezier(.2,.9,.3,1);
    width:240px;flex-basis:240px;
    z-index:55;
  }
  .sidebar.open{transform:translateX(0)}
  .icon-btn{display:grid}
  .content{padding:16px}
  .topbar{padding:12px 16px}
  .kpi .v{font-size:26px}
  .card{padding:16px}

<script>
const SUPABASE_URL = 'https://qtpybadjaczlkzkbbcge.supabase.co';
const SUPABASE_KEY = 'sb_publishable_GUfLjO0eaIx_LYNZgfIKzw_GcUsKjHC';
const BUCKET = 'assessment-files';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fa = n => String(n ?? '').replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

function toast(msg, type='ok'){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show';
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.className='toast', 2400);
}
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function normalizeStatus(s){
  s = String(s||'');
  if(s.includes('عدم')) return 'عدم پیاده‌سازی';
  if(s.includes('غیر قابل')) return 'غیر قابل احراز';
  if(s.includes('در حال')) return 'در حال پیاده‌سازی';
  if(s.includes('پیاده')) return 'پیاده‌سازی';
  return 'عدم پیاده‌سازی';
}
function statusWeight(s){
  const n = normalizeStatus(s);
  if(n === 'پیاده‌سازی') return 100;
  if(n === 'در حال پیاده‌سازی') return 50;
  return 0;
}
function statusClass(s){
  const n = normalizeStatus(s);
  if(n === 'پیاده‌سازی') return 'st-ok';
  if(n === 'در حال پیاده‌سازی') return 'st-warn';
  if(n === 'غیر قابل احراز') return 'st-gray';
  return 'st-bad';
}

const MODE_KEY = 'kashaf_mode';
let MODE = localStorage.getItem(MODE_KEY) || 'supabase';
let sb = null;
if(window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function setMode(m){
  MODE = m;
  localStorage.setItem(MODE_KEY, m);
  updateModeIndicator();
  updateConnBox();
}
function updateModeIndicator(){
  const el = $('#modeIndicator');
  if(!el) return;
  el.innerHTML = MODE === 'local'
    ? `<div class="mode-line local">LOCAL</div>`
    : `<div class="mode-line">SUPABASE</div>`;
}
function updateConnBox(){
  const box = $('#connBox');
  if(!box) return;
  if(MODE === 'local'){
    box.className = 'diag warn';
    box.innerHTML = `<div><b>حالت محلی فعال</b><br>داده‌ها در مرورگر ذخیره می‌شوند.</div>`;
  } else {
    box.innerHTML = `<div><b>وضعیت اتصال:</b> <span id="connTxt">در حال بررسی…</span></div>`;
    testConnection();
  }
}

const LS = {
  read(k){ try { return JSON.parse(localStorage.getItem('kashaf_'+k) || 'null'); } catch(e){ return null; } },
  write(k,v){ localStorage.setItem('kashaf_'+k, JSON.stringify(v)); }
};
function uuid(){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
  const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16);
});}

const LocalDB = {
  tables(){
    const t = LS.read('tables') || { users:[], controls:[], periods:[], assessments:[] };
    if(!t.users || !t.users.length){
      t.users = [{ id:uuid(), username:'ice', password_hash:null, full_name:'مدیر سامانه', role:'admin' }];
      LS.write('tables', t);
      sha256('ice').then(h => {
        const x = LS.read('tables') || t;
        x.users[0].password_hash = h;
        LS.write('tables', x);
      });
    }
    return t;
  },
  save(t){ LS.write('tables', t); },
  async findUser(u){ return this.tables().users.find(x => x.username === u) || null; },
  async addUser(u){ const t = this.tables(); t.users.push(u); this.save(t); },
  async delUser(id){ const t = this.tables(); t.users = t.users.filter(u=>u.id!==id); this.save(t); },
  async listUsers(){ return this.tables().users; },
  async listControls(){ return this.tables().controls; },
  async setControls(rows){
    const t = this.tables();
    t.controls = rows.map(r => ({ id: uuid(), ...r }));
    const ids = new Set(t.controls.map(c=>c.id));
    t.assessments = t.assessments.filter(a => ids.has(a.control_id));
    this.save(t);
  },
  async wipeControls(){ const t = this.tables(); t.controls=[]; t.assessments=[]; this.save(t); },
  async listPeriods(){ return this.tables().periods; },
  async addPeriod(p){ const t = this.tables(); const row = { id:uuid(), created_at:new Date().toISOString(), ...p }; t.periods.push(row); this.save(t); return row; },
  async delPeriod(id){ const t=this.tables(); t.periods=t.periods.filter(p=>p.id!==id); t.assessments=t.assessments.filter(a=>a.period_id!==id); this.save(t); },
  async listAssessments(pid){
    const t = this.tables();
    return pid ? t.assessments.filter(a=>a.period_id===pid) : t.assessments;
  },
  async upsertAssessment(a){
    const t = this.tables();
    const i = t.assessments.findIndex(x => x.period_id===a.period_id && x.control_id===a.control_id);
    if(i >= 0) t.assessments[i] = { ...t.assessments[i], ...a };
    else t.assessments.push({ id:uuid(), created_at:new Date().toISOString(), ...a });
    this.save(t);
    return t.assessments.find(x => x.period_id===a.period_id && x.control_id===a.control_id);
  }
};

async function testConnection(){
  const box = $('#connBox');
  const txt = document.getElementById('connTxt');
  if(!box || !txt || MODE === 'local') return;
  txt.textContent = 'در حال بررسی…';
  box.className = 'diag';
  if(!sb){ txt.textContent = 'کتابخانه بارگذاری نشد.'; box.className = 'diag err'; return; }
  const controller = new AbortController();
  const timer = setTimeout(()=> controller.abort(), 9000);
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_users?select=id&limit=1`, {
      method: 'GET',
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
      signal: controller.signal
    });
    clearTimeout(timer);
    if(res.ok){ txt.textContent = 'متصل — پایگاه داده در دسترس است.'; box.className = 'diag ok'; return true; }
    let body = ''; try{ body = await res.text(); }catch(e){}
    if(res.status === 404 || (body && body.includes('does not exist'))){
      txt.textContent = 'اتصال برقرار شد ولی جداول ساخته نشده‌اند. اسکریپت SQL را اجرا کنید.';
      box.className = 'diag warn';
    } else {
      txt.textContent = `پاسخ سرور: ${res.status}`; box.className = 'diag warn';
    }
  }catch(err){
    clearTimeout(timer);
    const msg = String(err && err.message || err);
    if(msg.includes('abort') || msg.includes('Failed to fetch') || msg.includes('NetworkError')){
      txt.textContent = 'اتصال برقرار نشد. پروژه Paused است یا شبکه مسدود است.';
      box.className = 'diag err';
    } else {
      txt.textContent = 'خطا: ' + msg;
      box.className = 'diag err';
    }
  }
}

const S = {
  user:null, controls:[], periods:[], periodId:null,
  assessments:{}, allAssessments:[], units:[], cats:[], levels:[],
  view:'dashboard', page:1, pageSize:12,
  filters:{q:'',unit:'',status:'',cat:'',level:''},
  assessUnit:'', _trendLoaded:false
};
const NAV = [
  { id:'dashboard', label:'داشبورد' },
  { id:'controls',  label:'کنترل‌ها' },
  { id:'assess',    label:'ارزیابی دوره' },
  { id:'trend',     label:'روند پیشرفت' },
  { id:'periods',   label:'مدیریت دوره‌ها' },
  { id:'users',     label:'کاربران' },
  { id:'import',    label:'ورود داده' }
];
const TITLES = Object.fromEntries(NAV.map(n=>[n.id,n.label]));

async function doLogin(username, password){
  const hash = await sha256(password);
  if(MODE === 'local'){
    const u = await LocalDB.findUser(username);
    if(!u) throw new Error('کاربر یافت نشد.');
    if(u.password_hash && u.password_hash !== hash) throw new Error('رمز نادرست است.');
    return u;
  }
  let { data, error } = await sb.from('app_users').select('*').eq('username', username).limit(1);
  if(error){
    if(String(error.message).includes('does not exist'))
      throw new Error('جدول app_users وجود ندارد.');
    if(String(error.message).includes('Failed to fetch'))
      throw new Error('اتصال به Supabase برقرار نشد.');
    throw new Error('خطا در اتصال: ' + error.message);
  }
  if(!data || !data.length){
    if(username === 'ice'){
      const { data:d2, error:e2 } = await sb.from('app_users').insert({
        username:'ice', password_hash: await sha256('ice'), full_name:'مدیر سامانه', role:'admin'
      }).select().single();
      if(e2) throw new Error('ساخت کاربر پیش‌فرض ناموفق: ' + e2.message);
      data = [d2];
    } else throw new Error('کاربر یافت نشد.');
  }
  if(data[0].password_hash !== hash) throw new Error('رمز عبور نادرست است.');
  return data[0];
}

function startSession(user){
  S.user = user;
  $('#loginScreen').classList.add('hidden');

  $('#uName').textContent = user.full_name || user.username;

  bootApp();
}
function logout(){
  S.user = null;
  $('#app').classList.add('hidden');
  $('#loginScreen').classList.remove('hidden');
  $('#content').innerHTML = '';
  updateConnBox();
}

async function apiListControls(){
  if(MODE === 'local') return LocalDB.listControls();
  const { data, error } = await sb.from('controls').select('*').order('row_no',{ascending:true});
  if(error) throw new Error('خطا در خواندن کنترل‌ها: ' + error.message);
  return data || [];
}
async function apiListPeriods(){
  if(MODE === 'local') return LocalDB.listPeriods();
  const { data, error } = await sb.from('periods').select('*').order('created_at',{ascending:true});
  if(error) throw new Error('خطا در خواندن دوره‌ها: ' + error.message);
  return data || [];
}
async function apiListAssessments(pid){
  if(MODE === 'local') return LocalDB.listAssessments(pid);
  let q = sb.from('assessments').select('*');
  if(pid) q = q.eq('period_id', pid);
  const { data, error } = await q;
  if(error) throw new Error('خطا در خواندن ارزیابی‌ها: ' + error.message);
  return data || [];
}
async function apiSaveAssessment(controlId, payload){
  if(MODE === 'local'){
    return LocalDB.upsertAssessment({ period_id:S.periodId, control_id:controlId, ...payload });
  }
  const existing = S.assessments[controlId];
  if(existing){
    const { data, error } = await sb.from('assessments').update(payload).eq('id', existing.id).select().single();
    if(error) throw new Error(error.message);
    return data;
  }
  const { data, error } = await sb.from('assessments').insert({ period_id:S.periodId, control_id:controlId, ...payload }).select().single();
  if(error) throw new Error(error.message);
  return data;
}
async function apiUpload(file, controlId){
  if(MODE === 'local'){
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res({ url:r.result, name:file.name });
      r.onerror = () => rej(new Error('خواندن فایل ممکن نشد'));
      r.readAsDataURL(file);
    });
  }
  const safe = file.name.replace(/[^\w.\-آ-ی]/g, '_');
  const path = `${S.periodId}/${controlId}/${Date.now()}_${safe}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { upsert:true });
  if(error) throw new Error('آپلود فایل ناموفق: ' + error.message);
  const { data } = sb.storage.from(BUCKET).getPublicUrl(path);
  return { url: data.publicUrl, name: file.name };
}

async function loadControls(){
  S.controls = await apiListControls();
  S.units = [...new Set(S.controls.map(c=>c.owner_unit).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  S.cats  = [...new Set(S.controls.map(c=>c.category).filter(Boolean))];
  S.levels= [...new Set(S.controls.map(c=>c.level).filter(Boolean))];
}
async function loadPeriods(){
  S.periods = await apiListPeriods();
  if(S.periods.length && !S.periods.find(p=>p.id===S.periodId)){
    S.periodId = S.periods[0].id;
  }
}
async function loadAssessments(){
  S.assessments = {};
  if(!S.periodId) return;
  const rows = await apiListAssessments(S.periodId);
  rows.forEach(a => S.assessments[a.control_id] = a);
}
async function loadAllAssessments(){
  S.allAssessments = await apiListAssessments(null);
}

function controlStatus(c){
  const a = S.assessments[c.id];
  return (a && a.status) || c.status || '—';
}
function controlProgress(c){
  const a = S.assessments[c.id];
  if(a && a.progress !== null && a.progress !== undefined && a.progress !== '') return Number(a.progress);
  return statusWeight(controlStatus(c));
}
function assessmentMapFor(pid){
  const m = {};
  S.allAssessments.filter(a=>a.period_id===pid).forEach(a => m[a.control_id]=a);
  return m;
}
function progressWithMap(c, map){
  const a = map[c.id];
  if(a && a.progress !== null && a.progress !== undefined && a.progress !== '') return Number(a.progress);
  return statusWeight((a && a.status) || c.status);
}

async function bootApp(){
  const content = $('#content');
  content.innerHTML = `<div class="card"><div class="spin"></div><div class="empty">در حال بارگذاری…</div></div>`;
  try{
    await loadPeriods();
    await loadControls();
    await loadAssessments();
    if(!S.periods.length) S.view = 'periods';
    renderNav(); renderPeriodSelect(); render();
  }catch(err){
    content.innerHTML = `<div class="card">
      <h3><span class="dot" style="background:var(--txt)"></span> خطا در بارگذاری</h3>
      <div class="empty" style="text-align:right">${esc(err.message || err)}</div>
    </div>`;
  }
}

function renderNav(){
  $('#nav').innerHTML = NAV.map(n =>
    `<button data-view="${n.id}" class="${S.view===n.id?'active':''}">${n.label}</button>`).join('');
}
function renderPeriodSelect(){
  const sel = $('#globalPeriod');
  if(!S.periods.length){ sel.innerHTML = `<option value="">— بدون دوره —</option>`; sel.disabled = true; return; }
  sel.disabled = false;
  sel.innerHTML = S.periods.map(p =>
    `<option value="${p.id}" ${p.id===S.periodId?'selected':''}>${esc(p.name)}</option>`).join('');
}
function render(){
  $('#pageTitle').textContent = TITLES[S.view] || '';
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view===S.view));
  const c = $('#content');
  switch(S.view){
    case 'dashboard': c.innerHTML = viewDashboard(); break;

    case 'assess':    c.innerHTML = viewAssess(); break;
    case 'trend':     c.innerHTML = viewTrend(); break;
    case 'periods':   c.innerHTML = viewPeriods(); break;
    case 'users':     c.innerHTML = viewUsers(); break;
    case 'import':    c.innerHTML = viewImport(); break;
  }
  bindView();
  if(S.view==='trend') ensureTrendData();
}

function viewDashboard(){
  const total = S.controls.length;
  const counts = {'پیاده‌سازی':0,'در حال پیاده‌سازی':0,'عدم پیاده‌سازی':0,'غیر قابل احراز':0};
  let sum = 0;
  S.controls.forEach(c => { counts[normalizeStatus(controlStatus(c))]++; sum += controlProgress(c); });
  const avg = total ? Math.round(sum/total) : 0;

  const byUnit = {};
  S.controls.forEach(c => {
    const u = c.owner_unit || 'نامشخص';
    if(!byUnit[u]) byUnit[u] = { n:0, sum:0, ok:0, doing:0, bad:0 };
    byUnit[u].n++; byUnit[u].sum += controlProgress(c);
    const ns = normalizeStatus(controlStatus(c));
    if(ns==='پیاده‌سازی') byUnit[u].ok++;
    else if(ns==='در حال پیاده‌سازی') byUnit[u].doing++;
    else byUnit[u].bad++;
  });
  const unitRows = Object.entries(byUnit).map(([k,v]) => ({
    name:k, n:v.n, ok:v.ok, doing:v.doing, bad:v.bad, pct: v.n?Math.round(v.sum/v.n):0
  })).sort((a,b)=>b.pct-a.pct);

  const byLevel = {};
  S.controls.forEach(c => {
    const l = c.level || 'نامشخص';
    if(!byLevel[l]) byLevel[l] = { n:0, sum:0 };
    byLevel[l].n++; byLevel[l].sum += controlProgress(c);
  });

  const byCat = {};
  S.controls.forEach(c => {
    const k = c.category || 'نامشخص';
    if(!byCat[k]) byCat[k] = { n:0, sum:0 };
    byCat[k].n++; byCat[k].sum += controlProgress(c);
  });
  const catRows = Object.entries(byCat).map(([k,v]) => ({
    name:k, n:v.n, pct: v.n?Math.round(v.sum/v.n):0
  })).sort((a,b)=>b.pct-a.pct);

  const segs = [
    {label:'پیاده‌سازی', val:counts['پیاده‌سازی'], color:'#18181b'},
    {label:'در حال', val:counts['در حال پیاده‌سازی'], color:'#71717a'},
    {label:'عدم پیاده‌سازی', val:counts['عدم پیاده‌سازی'], color:'#d4d4d8'},
    {label:'غیر قابل احراز', val:counts['غیر قابل احراز'], color:'#f4f4f5'}
  ];
  let acc = 0;
  const grad = segs.map(s => {
    const from = total?acc/total*360:0; acc += s.val;
    const to = total?acc/total*360:0;
    return `${s.color} ${from}deg ${to}deg`;
  }).join(',');

  const periodName = (S.periods.find(p=>p.id===S.periodId)||{}).name || 'بدون دوره';

  return `<div class="grid" style="gap:16px">
    <div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px 20px">
      <span class="badge badge-soft">دوره: ${esc(periodName)}</span>
      <span class="badge badge-soft">کنترل: ${fa(total)}</span>
      <span class="badge badge-soft">واحد: ${fa(unitRows.length)}</span>
      <span class="badge badge-soft" style="margin-right:auto">${MODE==='local'?'LOCAL':'SUPABASE'}</span>

function filteredControls(){
  const f = S.filters;
  return S.controls.filter(c => {
    if(f.unit && c.owner_unit!==f.unit) return false;
    if(f.cat && c.category!==f.cat) return false;
    if(f.level && c.level!==f.level) return false;
    if(f.status && normalizeStatus(controlStatus(c))!==f.status) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = `${c.title||''} ${c.evidence||''} ${c.owner_unit||''} ${c.category||''} ${c.row_no||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function lineChart(series){
  if(!series.length) return '<div class="empty">—</div>';
  const W=640, H=240, PAD=44, n=series.length;
  const xs = i => n===1?W/2:PAD+i*(W-2*PAD)/(n-1);
  const ys = v => H-PAD-(v/100)*(H-2*PAD);
  const path = series.map((s,i)=>`${i?'L':'M'}${xs(i).toFixed(1)},${ys(s.value).toFixed(1)}`).join(' ');
  return `<div style="width:100%;overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:340px;height:auto">
    ${[0,25,50,75,100].map(v=>`
      <line x1="${PAD}" y1="${ys(v)}" x2="${W-PAD}" y2="${ys(v)}" stroke="#e4e4e7" stroke-width="1"/>
      <text x="${PAD-8}" y="${ys(v)+4}" fill="#a1a1aa" font-size="9" text-anchor="end">${v}%</text>`).join('')}
    <path d="${path}" fill="none" stroke="#18181b" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    ${series.map((s,i)=>`
      <circle cx="${xs(i)}" cy="${ys(s.value)}" r="4" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
      <text x="${xs(i)}" y="${ys(s.value)-12}" fill="#09090b" font-size="10" font-weight="600" text-anchor="middle">${fa(s.value)}٪</text>
      <text x="${xs(i)}" y="${H-14}" fill="#71717a" font-size="9" text-anchor="middle">${esc(s.name.length>16?s.name.slice(0,16)+'…':s.name)}</text>`).join('')}
  </svg></div>`;
}

  if(S.view==='controls'){
    const rebind = () => { c.innerHTML = viewControls(); bindView(); };
    $('#fQ')?.addEventListener('input', e => { S.filters.q = e.target.value; S.page = 1; c.innerHTML = viewControls(); bindView(); const el = $('#fQ'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); });
    $('#fUnit')?.addEventListener('change', e => { S.filters.unit = e.target.value; S.page = 1; rebind(); });
    $('#fStatus')?.addEventListener('change', e => { S.filters.status = e.target.value; S.page = 1; rebind(); });
    $('#fCat')?.addEventListener('change', e => { S.filters.cat = e.target.value; S.page = 1; rebind(); });
    $('#fLevel')?.addEventListener('change', e => { S.filters.level = e.target.value; S.page = 1; rebind(); });
    $('#fSize')?.addEventListener('change', e => { S.pageSize = Number(e.target.value); S.page = 1; rebind(); });
    $('#clearFilters')?.addEventListener('click', () => { S.filters = {q:'',unit:'',status:'',cat:'',level:''}; S.page = 1; rebind(); });
    c.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => { S.page = Number(b.dataset.page); rebind(); window.scrollTo({top:0,behavior:'smooth'}); }));
    c.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openControlModal(el.dataset.open)));
  }
  if(S.view==='assess'){
    $('#asUnit')?.addEventListener('change', e => { S.assessUnit = e.target.value; c.innerHTML = viewAssess(); bindView(); });
    c.querySelectorAll('.as-item').forEach(item => {
      const cid = item.dataset.cid;
      const range = item.querySelector('.a-range');
      const pval = item.querySelector('.p-val');
      const statusSel = item.querySelector('.a-status');
      range.addEventListener('input', () => { pval.textContent = fa(range.value)+'٪'; });
      statusSel.addEventListener('change', () => { const w = statusWeight(statusSel.value); range.value = w; pval.textContent = fa(w)+'٪'; });
      item.querySelector('.a-save').addEventListener('click', async ev => {
        const btn = ev.currentTarget; btn.disabled = true; btn.textContent = 'ذخیره…';
        try{
          const payload = {
            status: statusSel.value,
            progress: Number(range.value),
            actions: item.querySelector('.a-actions').value.trim(),
            updated_by: S.user?.username || '',
            updated_at: new Date().toISOString()
          };
          const fi = item.querySelector('.a-file');
          if(fi.files && fi.files[0]){
            const up = await apiUpload(fi.files[0], cid);
            payload.file_url = up.url; payload.file_name = up.name;
          }
          const saved = await apiSaveAssessment(cid, payload);
          S.assessments[cid] = saved;
          const s = item.querySelector('.saved'); s.style.display = 'inline'; setTimeout(()=>s.style.display='none', 2000);
          toast('ذخیره شد');
        }catch(err){ toast('خطا: '+err.message); }
        finally{ btn.disabled = false; btn.textContent = 'ذخیره'; }
      });
    });
  }
  if(S.view==='trend'){
    $('#trendUnit')?.addEventListener('change', e => { S._trendUnit = e.target.value; c.innerHTML = viewTrend(); bindView(); });
  }
  if(S.view==='periods'){
    $('#addPeriod')?.addEventListener('click', async () => {
      const name = ($('#pName').value||'').trim();
      if(!name) return toast('نام دوره را وارد کنید');
      try{
        let row;
        if(MODE==='local'){
          row = await LocalDB.addPeriod({ name, start_date:$('#pStart').value||null, end_date:$('#pEnd').value||null });
        } else {
          const { data, error } = await sb.from('periods').insert({ name, start_date:$('#pStart').value||null, end_date:$('#pEnd').value||null }).select().single();
          if(error) throw error; row = data;
        }
        await loadPeriods();
        S.periodId = row.id;
        renderPeriodSelect(); await loadAssessments();
        toast('دوره ایجاد شد');
        c.innerHTML = viewPeriods(); bindView();
      }catch(err){ toast('خطا: '+err.message); }
    });
    c.querySelectorAll('[data-selperiod]').forEach(b => b.addEventListener('click', async () => {
      S.periodId = b.dataset.selperiod; renderPeriodSelect(); await loadAssessments();
      toast('دوره انتخاب شد'); c.innerHTML = viewPeriods(); bindView();
    }));
    c.querySelectorAll('[data-delperiod]').forEach(b => b.addEventListener('click', async () => {
      if(!confirm('حذف دوره و ارزیابی‌های آن؟')) return;
      try{
        if(MODE==='local') await LocalDB.delPeriod(b.dataset.delperiod);
        else { const { error } = await sb.from('periods').delete().eq('id', b.dataset.delperiod); if(error) throw error; }
        await loadPeriods(); if(!S.periods.find(p=>p.id===S.periodId)) S.periodId = S.periods[0]?.id || null;
        renderPeriodSelect(); await loadAssessments();
        toast('حذف شد'); c.innerHTML = viewPeriods(); bindView();
      }catch(err){ toast('خطا: '+err.message); }
    }));
  }
  if(S.view==='users'){
    renderUsersList().then(() => {
      document.querySelectorAll('[data-deluser]').forEach(b => b.addEventListener('click', async () => {
        if(!confirm('حذف کاربر؟')) return;
        try{
          if(MODE==='local') await LocalDB.delUser(b.dataset.deluser);
          else { const { error } = await sb.from('app_users').delete().eq('id', b.dataset.deluser); if(error) throw error; }
          toast('حذف شد'); renderUsersList();
        }catch(err){ toast('خطا: '+err.message); }
      }));
    });
    $('#addUser')?.addEventListener('click', async () => {
      const u = ($('#nuUser').value||'').trim(), p = ($('#nuPass').value||'').trim(), n = ($('#nuName').value||'').trim(), r = $('#nuRole').value;
      if(!u || !p) return toast('نام کاربری و رمز الزامی است');
      try{
        const hash = await sha256(p);
        if(MODE==='local'){
          if(await LocalDB.findUser(u)) throw new Error('کاربر تکراری است');
          await LocalDB.addUser({ id:uuid(), username:u, password_hash:hash, full_name:n, role:r });
        } else {
          const { error } = await sb.from('app_users').insert({ username:u, password_hash:hash, full_name:n, role:r });
          if(error) throw error;
        }
        toast('کاربر اضافه شد');
        $('#nuUser').value = ''; $('#nuPass').value = ''; $('#nuName').value = '';
        renderUsersList();
      }catch(err){ toast('خطا: '+err.message); }
    });
  }
  if(S.view==='import'){
    $('#wipeControls')?.addEventListener('click', async () => {
      if(!confirm('همه کنترل‌ها و ارزیابی‌های مرتبط حذف شوند؟')) return;
      try{
        if(MODE==='local') await LocalDB.wipeControls();
        else { const { error } = await sb.from('controls').delete().not('id','is',null); if(error) throw error; }
        await loadControls(); toast('حذف شد'); c.innerHTML = viewImport(); bindView();
      }catch(err){ toast('خطا: '+err.message); }
    });
    $('#doImport')?.addEventListener('click', async () => {
      const file = $('#xlsFile').files[0]; const log = $('#importLog');
      if(!file) return toast('فایل را انتخاب کنید');
      log.textContent = 'در حال خواندن…';
      try{
        const rows = await parseSheet(file);
        if(!rows.length) throw new Error('فایل خالی است');
        const mapped = rows.map(r => {
          const g = (...names) => {
            for(const n of names){
              const key = Object.keys(r).find(k => String(k).trim()===n);
              if(key!==undefined && String(r[key]).trim()!=='') return String(r[key]).trim();
            }
            return '';
          };
          return {
            row_no: Number(g('ردیف'))||null,
            category: g('دسته')||null,
            level: g('سطح پیشرفتگی')||null,
            title: g('کنترل')||'',
            evidence: g('شواهد')||'',
            status: g('وضعیت پیاده‌سازی')||null,
            owner_unit: g('واحد مسئول رسیدگی')||null
          };
        }).filter(x=>x.title);
        if(!mapped.length) throw new Error('ستون‌ها شناسایی نشدند.');
        log.textContent = `${fa(mapped.length)} رکورد. بارگذاری…`;
        if(MODE==='local'){
          await LocalDB.setControls(mapped);
        } else {
          const del = await sb.from('controls').delete().not('id','is',null);
          if(del.error) throw del.error;
          const CH = 100;
          for(let i = 0; i < mapped.length; i += CH){
            const part = mapped.slice(i, i+CH);
            const { error } = await sb.from('controls').insert(part);
            if(error) throw error;
            log.textContent = `${fa(Math.min(i+CH, mapped.length))} از ${fa(mapped.length)}`;
          }
        }
        await loadControls();
        log.innerHTML = `<span style="color:var(--txt);font-weight:600">بارگذاری کامل شد — ${fa(mapped.length)} کنترل</span>`;
        toast('بارگذاری کامل شد'); render();
      }catch(err){
        log.innerHTML = `<span style="color:var(--txt)">خطا: ${esc(err.message||err)}</span>`;
        toast('خطا در بارگذاری');
      }
    });
  }
}
function parseSheet(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        res(XLSX.utils.sheet_to_json(ws, { defval:'', raw:false }));
      }catch(err){ rej(err); }
    };
    r.onerror = () => rej(new Error('خواندن فایل ناموفق'));
    r.readAsArrayBuffer(file);
  });
}

function openControlModal(id){
  const c = S.controls.find(x=>x.id===id); if(!c) return;
  const a = S.assessments[c.id] || {};
  const st = controlStatus(c), pr = controlProgress(c);
  const periodName = (S.periods.find(p=>p.id===S.periodId)||{}).name || '—';
  $('#modalHost').innerHTML = `<div class="modal" id="modalBg"><div class="modal-box">
    <button class="close-x" id="closeModal">×</button>
    <h3>#${fa(c.row_no??'')} — ${esc(c.title)}</h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">
      <span class="badge badge-soft">${esc(c.category||'—')}</span>
      <span class="badge badge-soft">سطح: ${esc(c.level||'—')}</span>
      <span class="badge ${statusClass(st)}">${esc(normalizeStatus(st))}</span>
      <span class="badge badge-soft">${esc(c.owner_unit||'—')}</span>
    </div>
    <div class="kv"><div class="k">متن کنترل</div><div class="v">${esc(c.title)}</div></div>
    <div class="kv"><div class="k">شواهد ارزیابی</div><div class="v">${esc(c.evidence||'—')}</div></div>
    <div class="kv"><div class="k">وضعیت دوره «${esc(periodName)}»</div>
      <div class="v" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="badge ${statusClass(st)}">${esc(normalizeStatus(st))}</span>
        <div class="bar" style="flex:1;min-width:120px;margin:0"><i style="width:${pr}%"></i></div>
        <b>${fa(pr)}٪</b>
      </div></div>
    ${a.actions?`<div class="kv"><div class="k">اقدامات این دوره</div><div class="v">${esc(a.actions)}</div></div>`:''}
    ${a.file_url?`<div class="kv"><div class="k">پیوست</div><div class="v"><a href="${esc(a.file_url)}" target="_blank" rel="noopener">${esc(a.file_name||'دانلود فایل')}</a></div></div>`:''}
    <button class="btn btn-primary btn-full" id="goAssess" style="margin-top:8px">فرم ارزیابی این واحد</button>
  </div></div>`;
  const close = () => $('#modalHost').innerHTML = '';
  $('#closeModal').addEventListener('click', close);
  $('#modalBg').addEventListener('click', e => { if(e.target.id==='modalBg') close(); });
  $('#goAssess').addEventListener('click', () => { S.assessUnit = c.owner_unit||''; S.view = 'assess'; close(); render(); });
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), err = $('#loginErr');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'در حال بررسی…';
  try{
    const u = await doLogin($('#luser').value.trim(), $('#lpass').value);
    startSession(u);
  }catch(ex){ err.textContent = ex.message || 'ورود ناموفق'; }
  finally{ btn.disabled = false; btn.textContent = 'ورود'; }
});

$('#retestBtn').addEventListener('click', async () => {
  if(MODE==='local'){ setMode('supabase'); } else { await testConnection(); }
});
$('#localModeBtn').addEventListener('click', () => {
  setMode('local');
  toast('حالت محلی فعال شد');
});
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]'); if(!b) return;
  S.view = b.dataset.view;
  $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show');
  render();
});
$('#globalPeriod').addEventListener('change', async e => {
  S.periodId = e.target.value || null;
  await loadAssessments();
  toast('دوره تغییر کرد'); render();
});
$('#menuBtn').addEventListener('click', () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); });
$('#overlay').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); });
$('#logoutBtn').addEventListener('click', logout);
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); $('#modalHost').innerHTML=''; }
});

updateConnBox();
</script>
