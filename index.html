*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;height:100dvh;overflow:hidden}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg-main);color:var(--txt);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;transition:background .25s,color .25s}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2)}
a{color:var(--txt);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
.hidden{display:none!important}
.login-wrap{position:fixed;inset:0;overflow-y:auto;z-index:200;padding:24px 16px;background:var(--bg-main);display:flex;flex-direction:column}
.bg-anim{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(var(--faint) 1px,transparent 1px),linear-gradient(90deg,var(--faint) 1px,transparent 1px);background-size:48px 48px;opacity:.8}
.rotor{position:absolute;border:1px solid var(--faint);top:50%;left:50%;pointer-events:none}
.rotor-a{width:56vmin;height:56vmin;animation:rot 180s linear infinite}
.rotor-b{width:34vmin;height:34vmin;border-style:dashed;border-color:var(--line);animation:rot 240s linear infinite reverse}
.rotor-c{width:80vmin;height:80vmin;animation:rot 320s linear infinite}
@keyframes rot{to{transform:translate(-50%,-50%) rotate(360deg)}}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.b1{width:44vw;height:44vw;min-width:300px;min-height:300px;background:var(--blob-1);top:-10%;right:-8%;animation:float 19s ease-in-out infinite}
.b2{width:38vw;height:38vw;min-width:280px;min-height:280px;background:var(--blob-2);bottom:-12%;left:-8%;animation:float 23s ease-in-out infinite reverse}
.b3{width:30vw;height:30vw;min-width:240px;height:30vw;background:var(--blob-3);top:42%;left:38%;opacity:.4;animation:float 27s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(-7%,9%,0) scale(1.1)}66%{transform:translate3d(9%,-7%,0) scale(.95)}}
.login-stack{margin:auto 0;width:100%;max-width:400px;align-self:center;display:flex;flex-direction:column;gap:22px;position:relative;z-index:3;animation:pop .5s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.login-logos{display:flex;align-items:center;justify-content:center;gap:24px;padding:4px 8px;flex-wrap:wrap}
.login-logo{height:52px;width:auto;max-width:130px;object-fit:contain;display:block}
.login-logo-mid{height:68px;max-width:150px}
.login-card{position:relative;padding:36px 28px 26px;background:var(--white);border:1px solid var(--txt);width:100%}
.login-theme{position:absolute;top:12px;left:12px;padding:5px 10px;border:1px solid var(--txt);background:transparent;color:var(--txt);cursor:pointer;font-size:10px;font-weight:500;letter-spacing:.06em;font-family:inherit}
.login-theme:hover{background:var(--faint)}
.kashaf{font-size:11px;font-weight:600;letter-spacing:.32em;text-align:center;text-transform:uppercase;margin-bottom:14px}
.kashaf-rule{height:1px;background:var(--txt);margin-bottom:22px}
.login-card h1{font-size:15px;font-weight:600;margin:0 0 4px;text-align:center}
.login-card .sub{margin:0 0 26px;text-align:center;color:var(--muted);font-size:11.5px}
.field{margin-bottom:14px}
.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px;letter-spacing:.15em;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--txt);background:var(--white);color:var(--txt);outline:none;font-size:13px;border-radius:0;font-variant-numeric:tabular-nums}
.field input:focus,.field select:focus,.field textarea:focus{background:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:1px solid var(--txt);background:var(--white);color:var(--txt);cursor:pointer;font-weight:500;font-size:12.5px;transition:.12s;border-radius:0}
.btn:hover{background:var(--faint)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--txt);color:var(--white);border-color:var(--txt)}
.btn-primary:hover{background:var(--txt2);border-color:var(--txt2)}
.btn-danger{background:transparent;color:var(--delta-neg);border-color:var(--delta-neg)}
.btn-danger:hover{background:rgba(185,28,28,.08)}
.btn-full{width:100%;padding:12px}
.btn-sm{padding:6px 10px;font-size:11.5px}
.err{color:var(--txt);font-size:11.5px;text-align:center;margin-top:10px;min-height:14px;font-weight:500}
.diag{margin:0 0 16px;padding:9px 11px;border:1px solid var(--line);background:var(--faint);font-size:10.5px;line-height:1.7;color:var(--muted)}
.diag.ok{background:var(--white);border-color:var(--txt)}
.diag.err{background:var(--white);border-color:var(--txt);border-style:dashed}
.diag.warn{background:var(--white);border-color:var(--line2)}
.diag b{color:var(--txt);font-weight:600}
.mode-toggle{display:flex;margin-top:12px;border:1px solid var(--txt)}
.mode-toggle button{flex:1;padding:8px 6px;font-size:10.5px;background:var(--white);color:var(--txt);border:none;cursor:pointer;letter-spacing:.05em;font-weight:500}
.mode-toggle button:first-child{border-left:1px solid var(--txt)}
.mode-toggle button:hover{background:var(--faint)}
#app{height:100vh;height:100dvh;display:block}
.sidebar{position:fixed;top:0;right:0;width:220px;height:100vh;height:100dvh;z-index:50;background:var(--bg-side);border-left:1px solid var(--txt);display:flex;flex-direction:column;padding:22px 14px;overflow:hidden}
.brand{padding:0 6px 18px;border-bottom:1px solid var(--txt);margin-bottom:18px;flex-shrink:0}
.brand b{display:block;font-size:13px;font-weight:600;letter-spacing:.16em;margin-bottom:4px}
.brand span{display:block;font-size:10px;color:var(--muted);letter-spacing:.06em}
.nav{display:flex;flex-direction:column;gap:0;flex:1;min-height:0;overflow:hidden}

async function sha256(str){ const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''); }

const JALALI_MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const JALALI_WEEKDAYS = ['ش','ی','د','س','چ','پ','ج'];
function g2j(gy, gm, gd){
  const gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
  let jy = (gy <= 1600) ? 0 : 979; gy -= (gy <= 1600) ? 621 : 1600;
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365*gy) + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) - 80 + gd + gdm[gm-1];
  jy += 33*Math.floor(days/12053); days %= 12053; jy += 4*Math.floor(days/1461); days %= 1461;
  if (days > 365) { jy += Math.floor((days-1)/365); days = (days-1)%365; }
  const jm = (days < 186) ? 1 + Math.floor(days/31) : 7 + Math.floor((days-186)/30);
  const jd = 1 + ((days < 186) ? (days%31) : ((days-186)%30));
  return [jy, jm, jd];
}
function j2g(jy, jm, jd){
  let gy = (jy <= 979) ? 621 : 1600; jy -= (jy <= 979) ? 0 : 979;
  let days = (365*jy) + (Math.floor(jy/33)*8) + Math.floor(((jy%33)+3)/4) + 78 + jd + ((jm<7) ? (jm-1)*31 : ((jm-7)*30)+186);
  gy += 400*Math.floor(days/146097); days %= 146097;
  if (days >= 36525) { days--; gy += 100*Math.floor(days/36524); days %= 36524; if (days >= 365) days++; }
  gy += 4*Math.floor(days/1461); days %= 1461;
  if (days >= 366) { gy += Math.floor((days-1)/365); days = (days-1)%365; }
  let gd = days + 1;
  const sa = [0,31,((gy%4===0 && gy%100!==0) || (gy%400===0)) ? 29 : 28,31,30,31,30,31,31,30,31,30,31];
  let gm; for (gm=1; gm<=12; gm++) { if (gd <= sa[gm]) break; gd -= sa[gm]; }
  return [gy, gm, gd];
}
function isLeapJalali(jy){ return [1,5,9,13,17,22,26,30].includes(jy % 33); }
function jalaliMonthLength(jy, jm){ if(jm<=6) return 31; if(jm<=11) return 30; return isLeapJalali(jy)?30:29; }
function firstWeekdayOfJalaliMonth(jy, jm){ const [gy,gm,gd]=j2g(jy,jm,1); const d=new Date(gy,gm-1,gd); return (d.getDay()+1)%7; }
function todayJalali(){ const n=new Date(); const [y,m,d]=g2j(n.getFullYear(),n.getMonth()+1,n.getDate()); return `${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')}`; }
function parseJalali(s){
  const m = toLatin(String(s||'').trim()).match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(!m) return null;
  const y=+m[1],mo=+m[2],d=+m[3];
  if(y<1200||y>1600||mo<1||mo>12||d<1||d>31) return null;
  if(d > jalaliMonthLength(y, mo)) return null;
  return `${y}/${String(mo).padStart(2,'0')}/${String(d).padStart(2,'0')}`;
}
function displayDate(s){ if(!s) return ''; const p = parseJalali(s); return p ? fa(p) : s; }

function openDatePicker(currentValue, onPick){

const STATUS_OPTS = ['پیاده‌سازی','در حال پیاده‌سازی','عدم پیاده‌سازی','غیر قابل احراز'];
function normalizeStatus(s){
  s = String(s||'').trim();
  if(!s) return 'عدم پیاده‌سازی';
  if(s.includes('غیر قابل')) return 'غیر قابل احراز';
  if(s.includes('عدم')) return 'عدم پیاده‌سازی';
  if(s.includes('در حال')) return 'در حال پیاده‌سازی';
  if(s.includes('کامل')) return 'پیاده‌سازی';
  if(s === 'پیاده‌سازی') return 'پیاده‌سازی';
  if(s.includes('پیاده')) return 'پیاده‌سازی';
  return 'عدم پیاده‌سازی';
}
function statusFromProgress(p){ p = Number(p)||0; if(p<=0) return 'عدم پیاده‌سازی'; if(p>=100) return 'پیاده‌سازی'; return 'در حال پیاده‌سازی'; }

  if(s === 'ثبت نشده' || s === '—' || !s) return 'st-gray';

}

const LocalDB = {

  async wipeAllControls(){ const t=this.tables(); t.controls=[]; t.assessments=[]; this.save(t); },
  async listPeriods(){ return this.tables().periods; },
  async addPeriod(p){ const t=this.tables(); const row={id:uuid(),created_at:new Date().toISOString(),...p}; t.periods.push(row); this.save(t); return row; },
  async delPeriod(id){ const t=this.tables(); t.periods=t.periods.filter(p=>p.id!==id); t.assessments=t.assessments.filter(a=>a.period_id!==id); this.save(t); },
  async updatePeriod(id,patch){ const t=this.tables(); const p=t.periods.find(x=>x.id===id); if(p){ Object.assign(p,patch); this.save(t); } },
  async listAssessments(pid){ const t=this.tables(); return pid?t.assessments.filter(a=>a.period_id===pid):t.assessments; },
  async upsertAssessmentsBulk(items){
    const t=this.tables();
    items.forEach(a => {
      const i=t.assessments.findIndex(x=>x.period_id===a.period_id && x.control_id===a.control_id);
      if(i>=0) t.assessments[i]={...t.assessments[i],...a};
      else t.assessments.push({id:uuid(),created_at:new Date().toISOString(),...a});
    });
    this.save(t);
  },
  async wipePeriodAssessments(pid){
    const t=this.tables();
    t.assessments = t.assessments.filter(a => a.period_id !== pid);
    this.save(t);
  }
};

async function testConnection(){
  const box = $('#connBox'); const txt = document.getElementById('connTxt');
  if(!box||!txt||MODE==='local') return;
  txt.textContent='در حال بررسی…'; box.className='diag';
  if(!sb){ txt.textContent='سامانه آماده نیست.'; box.className='diag err'; return; }
  const ctrl = new AbortController(); const timer = setTimeout(()=>ctrl.abort(), 9000);
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/app_users?select=id&limit=1`, { method:'GET', headers:{ 'apikey':SUPABASE_KEY, 'Authorization':`Bearer ${SUPABASE_KEY}` }, signal:ctrl.signal });
    clearTimeout(timer);
    if(res.ok){ txt.textContent='متصل — سرور در دسترس است.'; box.className='diag ok'; return true; }
    let body=''; try{ body=await res.text(); }catch(e){}
    if(res.status===404 || (body && body.includes('does not exist'))){ txt.textContent='اتصال برقرار شد ولی جداول آماده نیستند.'; box.className='diag warn'; }
    else { txt.textContent=`پاسخ سرور: ${res.status}`; box.className='diag warn'; }
  }catch(err){
    clearTimeout(timer);
    const msg = String(err&&err.message||err);
    if(msg.includes('abort') || msg.includes('Failed to fetch') || msg.includes('NetworkError')){ txt.textContent='اتصال به سرور برقرار نشد.'; box.className='diag err'; }
    else { txt.textContent='خطا: '+msg; box.className='diag err'; }
  }
}

async function apiSaveAssessmentsBulk(periodId, items){
  if(MODE==='local'){
    return LocalDB.upsertAssessmentsBulk(items.map(it => ({ period_id: periodId, ...it })));
  }
  const existingRes = await sb.from('assessments').select('id, control_id').eq('period_id', periodId);
  if(existingRes.error) throw existingRes.error;
  const existingMap = new Map((existingRes.data||[]).map(r => [r.control_id, r.id]));

  const toInsert = [];
  const toUpdate = [];
  items.forEach(it => {
    const payload = { period_id: periodId, ...it };
    const id = existingMap.get(it.control_id);
    if(id){ toUpdate.push({ id, ...payload }); }
    else { toInsert.push(payload); }
  });

  const CH = 200;
  for(let i = 0; i < toInsert.length; i += CH){
    const part = toInsert.slice(i, i+CH);
    const { error } = await sb.from('assessments').insert(part);
    if(error) throw new Error('خطا در درج: ' + error.message);
  }
  for(let i = 0; i < toUpdate.length; i += CH){
    const part = toUpdate.slice(i, i+CH).map(({id, ...rest}) => rest);
    const { error } = await sb.from('assessments').upsert(part, { onConflict: 'period_id,control_id' });
    if(error) throw new Error('خطا در به‌روزرسانی: ' + error.message);
  }
}

// ═══════════════════════════════════════════════════════════════
// محاسبه پیشرفت هر کنترل در یک دوره — بدون carry-forward بین دوره‌ها
// پیش‌فرض بر اساس وضعیت: پیاده‌سازی=۱۰۰ / عدم=۰ / در حال=۱۰ / غیرقابل=null
// ═══════════════════════════════════════════════════════════════
function calculateControlProgressDetail(c, periodId, map){
  const a = map ? map[c.id] : null;
  // ۱) اگر درصد صریح ثبت شده، همان ملاک است
  if(a && a.progress !== null && a.progress !== undefined && a.progress !== ''){
    const p = Number(a.progress);
    if(!isNaN(p)) return { value: Math.max(0, Math.min(100, p)), reason: 'explicit' };
  }
  // ۲) وگرنه از وضعیت استخراج می‌کنیم (هم برای دوره پایه، هم دوره‌های بعد)
  const statusSrc = (a && a.status) || (isFirstPeriodById(periodId) ? (c.status || '') : '');
  const st = normalizeStatus(statusSrc);
  if(st === 'غیر قابل احراز') return { value: null, reason: 'excluded' };
  if(st === 'پیاده‌سازی') return { value: 100, reason: 'status' };
  if(st === 'عدم پیاده‌سازی') return { value: 0, reason: 'status' };
  if(st === 'در حال پیاده‌سازی') return { value: 10, reason: 'status' };
  // اگر هیچ داده‌ای نیست
  return { value: null, reason: 'nodata' };
}

function controlProgress(c){
  const r = calculateControlProgressDetail(c, S.periodId, S.assessments);
  return r.value;
}
function controlStatus(c){
  const a = S.assessments[c.id];
  // اولویت: وضعیت صریح ثبت‌شده
  if(a && a.status) return normalizeStatus(a.status);
  // اگر درصد صریح ثبت شده
  const pr = controlProgress(c);
  if(pr !== null) return statusFromProgress(pr);
  // اگر دوره پایه و وضعیت کنترل موجود
  if(isFirstPeriodById(S.periodId) && c.status) return normalizeStatus(c.status);
  return 'ثبت نشده';
}

// ═══════════════════════════════════════════════════════════════
// میانگین تجمعی — هر دوره مستقل، بدون carry-forward
// ═══════════════════════════════════════════════════════════════
function computeAggregateSeries(controls, periods, allMaps){
  if(!periods.length) return [];
  return periods.map(p => {
    let sum = 0, count = 0;
    controls.forEach(c => {
      const r = calculateControlProgressDetail(c, p.id, allMaps[p.id]);
      if(r.reason === 'excluded') return; // غیرقابل احراز از میانگین حذف
      if(r.value === null) return;       // بدون داده از میانگین حذف
      sum += r.value; count++;
    });
    return count > 0 ? Math.round(sum / count) : null;
  });
}

function currentCumulativeProgress(controls){
  const idx = periodIndex();
  if(idx < 0) return null;
  const periodsUpTo = S.periods.slice(0, idx + 1);
  const allMaps = getAllMaps();
  const series = computeAggregateSeries(controls, periodsUpTo, allMaps);
  return series.length ? series[series.length - 1] : null;
}

function viewDashboard(){
  const total = S.controls.length;
  if(total === 0){
    return `<div class="grid" style="gap:16px">
      <div class="card" style="text-align:center;padding:48px 24px">
        <div style="font-size:15px;font-weight:600;margin-bottom:8px">هیچ کنترلی برای این دوره ثبت نشده است</div>
        <div class="empty" style="padding:16px">برای شروع، از تب «ورود/خروج داده» فایل اکسل را بارگذاری کنید.</div>
        ${isAdmin() ? `<button class="btn btn-primary" onclick="S.view='import';render();">رفتن به ورود داده</button>` : ''}
      </div>
    </div>`;
  }
  const counts = {'عدم پیاده‌سازی':0,'در حال پیاده‌سازی':0,'پیاده‌سازی':0,'غیر قابل احراز':0,'ثبت نشده':0};
  S.controls.forEach(c => {
    const st = controlStatus(c);
    if(counts[st] !== undefined) counts[st]++;
    else counts['ثبت نشده']++;
  });
  const avg = currentCumulativeProgress(S.controls);
  const byUnit = {};
  S.controls.forEach(c => {
    const u = c.owner_unit || 'نامشخص';
    if(!byUnit[u]) byUnit[u] = { n:0, ok:0, doing:0, bad:0, unverifiable:0, empty:0, controls:[] };
    byUnit[u].n++; byUnit[u].controls.push(c);
    const st = controlStatus(c);
    if(st==='پیاده‌سازی') byUnit[u].ok++;
    else if(st==='در حال پیاده‌سازی') byUnit[u].doing++;
    else if(st==='عدم پیاده‌سازی') byUnit[u].bad++;
    else if(st==='غیر قابل احراز') byUnit[u].unverifiable++;
    else byUnit[u].empty++;
  });
  const allMaps = getAllMaps();
  const idx = periodIndex();
  const periodsUpTo = S.periods.slice(0, idx + 1);
  const unitRows = Object.entries(byUnit).map(([k,v]) => {
    const series = computeAggregateSeries(v.controls, periodsUpTo, allMaps);
    const pct = series.length ? series[series.length - 1] : null;
    return { name:k, n:v.n, ok:v.ok, doing:v.doing, bad:v.bad, unverifiable:v.unverifiable, empty:v.empty, pct };
  }).sort((a,b) => (b.pct||0) - (a.pct||0));
  const byLevel = {};
  S.controls.forEach(c => {
    const l = c.level || 'نامشخص';
    if(!byLevel[l]) byLevel[l] = { n:0, controls:[] };
    byLevel[l].n++; byLevel[l].controls.push(c);
  });
  const byCat = {};
  S.controls.forEach(c => {
    const k = c.category || 'نامشخص';
    if(!byCat[k]) byCat[k] = { n:0, controls:[] };
    byCat[k].n++; byCat[k].controls.push(c);
  });
  const catRows = Object.entries(byCat).map(([k,v]) => {
    const series = computeAggregateSeries(v.controls, periodsUpTo, allMaps);
    const pct = series.length ? series[series.length - 1] : null;
    return { name:k, n:v.n, pct };
  }).sort((a,b) => (b.pct||0) - (a.pct||0));
  const segs = [
    {label:'پیاده‌سازی', val:counts['پیاده‌سازی'], color:'var(--donut-1)'},

  const periodName = (S.periods.find(p=>p.id===S.periodId)||{}).name || 'بدون دوره';

function renderProgressComparison(){
  if(S.periods.length < 2) return '';
  if(S.controls.length === 0) return '';
  const allMaps = getAllMaps();
  const overallSeries = computeAggregateSeries(S.controls, S.periods, allMaps);
  const unitRows = S.units.map(unit => {
    const controls = S.controls.filter(c => c.owner_unit === unit);
    const series = computeAggregateSeries(controls, S.periods, allMaps);
    return { name: unit, series, count: controls.length };
  }).filter(r => r.series.some(v => v !== null));
  const catRows = S.cats.map(cat => {
    const controls = S.controls.filter(c => c.category === cat);
    const series = computeAggregateSeries(controls, S.periods, allMaps);
    return { name: cat, series, count: controls.length };
  }).filter(r => r.series.some(v => v !== null));
  function renderCell(val, prevVal){
    if(val === null || val === undefined) return `<td class="null">—</td>`;
    let deltaHtml = '';
    if(prevVal !== null && prevVal !== undefined){
      const d = val - prevVal;
      if(d !== 0){
        const arrow = d > 0 ? '▲' : '▼';
        deltaHtml = `<div class="cell-delta" style="color:${d > 0 ? 'var(--delta-pos)' : 'var(--delta-neg)'}">${arrow} ${fa(Math.abs(d))}٪</div>`;
      }
    }
    return `<td><div class="cell-val">${fa(val)}٪</div>${deltaHtml}</td>`;
  }
  const colgroup = `<colgroup><col style="width:200px;"><col style="width:60px;">${S.periods.map(()=>'<col>').join('')}</colgroup>`;
  const overallTable = `<div class="card" style="margin-bottom:16px">
    <h3><span class="dot"></span> مقایسه پیشرفت کل در دوره‌ها</h3>
    <div class="tbl-wrap"><table class="cmp-table">${colgroup}
      <thead><tr><th>مجموع</th><th>تعداد</th>${S.periods.map(p => `<th>${esc(p.name)}</th>`).join('')}</tr></thead>
      <tbody><tr><td style="font-weight:700">مجموع کل</td><td>${fa(S.controls.length)}</td>${S.periods.map((p, i) => renderCell(overallSeries[i], i > 0 ? overallSeries[i-1] : null)).join('')}</tr></tbody>
    </table></div>
  </div>`;
  const unitTable = unitRows.length ? `<div class="card" style="margin-bottom:16px">
    <h3><span class="dot"></span> مقایسه پیشرفت واحدها در دوره‌ها</h3>
    <div class="tbl-wrap"><table class="cmp-table">${colgroup}
      <thead><tr><th>واحد</th><th>تعداد</th>${S.periods.map(p => `<th>${esc(p.name)}</th>`).join('')}</tr></thead>
      <tbody>${unitRows.map(row => `<tr><td style="font-weight:600">${esc(row.name)}</td><td style="font-size:10px;color:var(--muted)">${fa(row.count)}</td>${S.periods.map((p, i) => renderCell(row.series[i], i > 0 ? row.series[i-1] : null)).join('')}</tr>`).join('')}</tbody>
    </table></div>
  </div>` : '';
  const catTable = catRows.length ? `<div class="card">
    <h3><span class="dot"></span> مقایسه پیشرفت دسته‌ها در دوره‌ها</h3>
    <div class="tbl-wrap"><table class="cmp-table">${colgroup}
      <thead><tr><th>دسته</th><th>تعداد</th>${S.periods.map(p => `<th>${esc(p.name)}</th>`).join('')}</tr></thead>
      <tbody>${catRows.map(row => `<tr><td style="font-weight:600">${esc(row.name)}</td><td style="font-size:10px;color:var(--muted)">${fa(row.count)}</td>${S.periods.map((p, i) => renderCell(row.series[i], i > 0 ? row.series[i-1] : null)).join('')}</tr>`).join('')}</tbody>
    </table></div>
  </div>` : '';
  return overallTable + unitTable + catTable;
}

function filteredControls(){
  const f = S.filters;
  return S.controls.filter(c => {
    if(f.unit && c.owner_unit!==f.unit) return false;
    if(f.cat && c.category!==f.cat) return false;
    if(f.level && c.level!==f.level) return false;
    if(f.status && controlStatus(c)!==f.status) return false;
    if(f.q){
      const q = f.q.toLowerCase();
      const hay = `${c.title||''} ${c.evidence||''} ${c.owner_unit||''} ${c.category||''} ${c.row_no||''}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function getStatusInPeriod(c, periodId, map){
  const a = map ? map[c.id] : null;
  if(a && a.status) return normalizeStatus(a.status);
  const r = calculateControlProgressDetail(c, periodId, map);
  if(r.reason === 'excluded') return 'غیر قابل احراز';
  if(r.value !== null) return statusFromProgress(r.value);
  if(isFirstPeriodById(periodId) && c.status) return normalizeStatus(c.status);
  return null;
}
function getChangedControls(allMaps){
  if(!S.periods.length) return [];
  return S.controls.map(c => {
    const statuses = S.periods.map(p => ({ period: p, status: getStatusInPeriod(c, p.id, allMaps[p.id]), assessment: allMaps[p.id] ? allMaps[p.id][c.id] : null }));
    const baseStatus = statuses[0].status;
    if(!baseStatus || baseStatus === 'غیر قابل احراز') return null;
    const hasChange = statuses.slice(1).some(s => s.status && s.status !== baseStatus && s.status !== 'غیر قابل احراز');
    if(!hasChange) return null;
    let latestAssessment = null, latestStatus = baseStatus, latestPeriod = S.periods[0];
    for(let i = statuses.length - 1; i >= 0; i--){
      if(statuses[i].assessment){ latestAssessment = statuses[i].assessment; latestStatus = statuses[i].status || baseStatus; latestPeriod = statuses[i].period; break; }
    }
    const transitions = [];
    let prevStatus = baseStatus, prevPeriodName = S.periods[0].name;
    statuses.slice(1).forEach(s => {
      if(s.status && s.status !== prevStatus && s.status !== 'غیر قابل احراز'){
        transitions.push({ from: prevStatus, to: s.status, fromPeriod: prevPeriodName, toPeriod: s.period.name });
        prevStatus = s.status; prevPeriodName = s.period.name;
      }
    });
    return { control: c, baseStatus, latestStatus, latestAssessment, latestPeriod, statuses, transitions };
  }).filter(Boolean);
}
function viewTrend(){
  if(!S.periods.length) return `<div class="card"><div class="empty">دوره‌ای نیست.</div></div>`;
  if(S.controls.length === 0) return `<div class="card"><div class="empty">داده‌ای برای نمایش وجود ندارد</div></div>`;
  if(!S._trendLoaded) return `<div class="card"><div class="spin"></div><div class="empty">بارگذاری…</div></div>`;
  const fUnit = S._trendUnit || '__all';
  const fCat = S._trendCat || '__all';
  const fLevel = S._trendLevel || '__all';
  const groupBy = S._trendGroupBy || 'unit';
  const search = (S._trendSearch || '').trim().toLowerCase();
  const page = S._trendPage || 1;
  let ctrlFiltered = S.controls;
  if(fUnit !== '__all') ctrlFiltered = ctrlFiltered.filter(c => c.owner_unit === fUnit);
  if(fCat !== '__all') ctrlFiltered = ctrlFiltered.filter(c => c.category === fCat);
  if(fLevel !== '__all') ctrlFiltered = ctrlFiltered.filter(c => c.level === fLevel);
  if(groupBy === 'control' && search){ ctrlFiltered = ctrlFiltered.filter(c => (c.title||'').toLowerCase().includes(search)); }
  const unitOpts = ['<option value="__all">همه واحدها</option>'].concat(S.units.map(u=>`<option value="${esc(u)}" ${fUnit===u?'selected':''}>${esc(u)}</option>`)).join('');
  const catOpts = ['<option value="__all">همه دسته‌ها</option>'].concat(S.cats.map(u=>`<option value="${esc(u)}" ${fCat===u?'selected':''}>${esc(u)}</option>`)).join('');
  const levelOpts = ['<option value="__all">همه سطوح</option>'].concat(S.levels.map(u=>`<option value="${esc(u)}" ${fLevel===u?'selected':''}>${esc(u)}</option>`)).join('');
  const allMaps = getAllMaps();
  const series = computeAggregateSeries(ctrlFiltered, S.periods, allMaps).map((v, i) => ({ id: S.periods[i].id, name: S.periods[i].name, value: v }));
  const groups = {};
  if(groupBy === 'control'){
    ctrlFiltered.forEach(c => { groups[c.id] = { name: c.title || '', meta: { row_no: c.row_no, owner_unit: c.owner_unit, category: c.category, level: c.level }, controls: [c] }; });
  } else {
    ctrlFiltered.forEach(c => {
      const key = groupBy === 'unit' ? (c.owner_unit || 'نامشخص') : groupBy === 'category' ? (c.category || 'نامشخص') : (c.level || 'نامشخص');
      if(!groups[key]) groups[key] = { name: key, controls: [] };
      groups[key].controls.push(c);
    });
  }
  const groupsArr = Object.values(groups).map(g => {
    const series = computeAggregateSeries(g.controls, S.periods, allMaps);
    return { ...g, series, lastVal: series.filter(v => v !== null).slice(-1)[0] || 0 };
  }).sort((a,b) => b.lastVal - a.lastVal);
  const isControlMode = groupBy === 'control';
  const effPageSize = PRINT_MODE ? Math.max(groupsArr.length, 1) : TREND_PAGE_SIZE;
  const total = groupsArr.length;
  const pages = isControlMode ? Math.max(1, Math.ceil(total / effPageSize)) : 1;
  const curPage = Math.min(page, pages);
  const start = (curPage - 1) * effPageSize;
  const itemsToShow = isControlMode ? groupsArr.slice(start, start + effPageSize) : groupsArr;
  const groupLabel = { unit:'واحد', category:'دسته', level:'سطح', control:'کنترل' }[groupBy];
  const tableHeader = isControlMode
    ? `<tr><th>#</th><th>کنترل</th><th>واحد</th><th>دسته</th><th>سطح</th>${S.periods.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr>`
    : `<tr><th>${groupLabel}</th><th>تعداد</th>${S.periods.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr>`;
  const tableBody = itemsToShow.length
    ? itemsToShow.map(g => {
        const cells = g.series.map(v => `<td style="font-weight:600">${v !== null ? fa(v)+'٪' : '<span style="color:var(--dim)">—</span>'}</td>`).join('');
        if(isControlMode){

function lineChart(series){
  const validSeries = series.filter(s => s.value !== null && s.value !== undefined);
  if(!validSeries.length) return '<div class="empty">داده‌ای برای نمایش روند نیست</div>';
  const W=640, H=240, PAD=44, n=series.length;
  const xs = i => n===1?W/2:PAD+i*(W-2*PAD)/(n-1);
  const ys = v => H-PAD-(v/100)*(H-2*PAD);
  const points = series.map((s, i) => s.value !== null ? `${xs(i).toFixed(1)},${ys(s.value).toFixed(1)}` : null);
  let path = ''; let started = false;
  points.forEach(pt => { if(pt === null) return; path += (started ? 'L' : 'M') + pt; started = true; });
  return `<div style="width:100%;overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:340px;height:auto">
    ${[0,25,50,75,100].map(v=>`<line x1="${PAD}" y1="${ys(v)}" x2="${W-PAD}" y2="${ys(v)}" style="stroke:var(--line);stroke-width:1"/><text x="${PAD-8}" y="${ys(v)+4}" style="fill:var(--dim);font-size:9px" text-anchor="end">${v}%</text>`).join('')}
    ${path ? `<path d="${path}" style="fill:none;stroke:var(--bar-fill);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"/>` : ''}
    ${series.map((s,i)=> s.value !== null ? `<circle cx="${xs(i)}" cy="${ys(s.value)}" r="4" style="fill:var(--white);stroke:var(--bar-fill);stroke-width:1.5"/><text x="${xs(i)}" y="${ys(s.value)-12}" style="fill:var(--txt);font-size:10px;font-weight:600" text-anchor="middle">${fa(s.value)}٪</text><text x="${xs(i)}" y="${H-14}" style="fill:var(--muted);font-size:9px" text-anchor="middle">${esc(s.name.length>16?s.name.slice(0,16)+'…':s.name)}</text>` : `<text x="${xs(i)}" y="${H-14}" style="fill:var(--dim);font-size:9px" text-anchor="middle">${esc(s.name.length>16?s.name.slice(0,16)+'…':s.name)}</text>`).join('')}
  </svg></div>`;
}

// خواندن اکسل — تشخیص خودکار ردیف سرستون
// ═══════════════════════════════════════════════════════════════
const COLS = { category: 0, level: 1, title: 2, evidence: 3, status: 4, owner_unit: 5, actions: 6, resolve_date: 7, progress: 8, notes: 9 };
function isHeaderRow(arr){
  if(!arr) return false;
  const joined = arr.map(v => String(v ?? '').trim()).join(' ');
  // اگر یکی از این کلیدواژه‌ها در ردیف باشد، سرستون است
  return /کنترل|عنوان|شواهد|وضعیت|واحد|دسته|سطح|اقدامات|پیشرفت|توضیحات|ردیف/i.test(joined);
}
function parseSheet(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => {
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:false, cellText:true});
        if(!wb.SheetNames || !wb.SheetNames.length) throw new Error('هیچ شیتی در فایل نیست');
        const ws = wb.Sheets[wb.SheetNames[0]];
        const aoa = XLSX.utils.sheet_to_json(ws, { defval:'', raw:false, header:1, blankrows:false});
        if(!aoa.length) throw new Error('فایل خالی است');
        // تشخیص خودکار سرستون
        let dataRows = aoa;
        if(isHeaderRow(aoa[0])){
          dataRows = aoa.slice(1);
        }
        res(dataRows);
      }catch(err){ rej(err); }
    };
    r.onerror = () => rej(new Error('خواندن فایل ناموفق'));
    r.readAsArrayBuffer(file);
  });
}
function cellStr(arr, idx){ if(!arr) return ''; const v = arr[idx]; return v === null || v === undefined ? '' : String(v).trim(); }
function excelRowArrToRecord(arr){
  const title = cellStr(arr, COLS.title);
  if(!title) return null;
  const statusRaw = cellStr(arr, COLS.status);
  const resolveRaw = cellStr(arr, COLS.resolve_date);
  const resolve_date = resolveRaw ? (parseJalali(resolveRaw) || resolveRaw) : '';
  const progressRaw = cellStr(arr, COLS.progress);
  let progress = null;
  if(progressRaw){ const num = parseInt(toLatin(progressRaw).replace(/[^\d-]/g, ''), 10); if(!isNaN(num)) progress = Math.max(0, Math.min(100, num)); }
  return {
    category: cellStr(arr, COLS.category) || null,
    level: cellStr(arr, COLS.level) || null,
    title,
    evidence: cellStr(arr, COLS.evidence) || '',
    status: statusRaw ? normalizeStatus(statusRaw) : null,
    owner_unit: cellStr(arr, COLS.owner_unit) || null,
    actions: cellStr(arr, COLS.actions) || '',
    resolve_date,
    deadline: '',
    progress,
    notes: cellStr(arr, COLS.notes) || ''
  };
}

function exportPeriodToExcel(periodId){
  const period = S.periods.find(p => p.id === periodId);
  if(!period) return toast('دوره یافت نشد');
  if(S.allControls.length === 0){
    return toast('داده‌ای برای خروجی وجود ندارد');
  }
  const map = {};
  S.allAssessments.filter(a => a.period_id === periodId).forEach(a => { if(!map[a.control_id]) map[a.control_id] = mergeAxExtras(a); });
  const rows = S.allControls.map((c, i) => {
    const a = map[c.id] || {};
    return {
      'ردیف': i + 1, 'دسته': c.category || '', 'سطح پیشرفتگی': c.level || '', 'کنترل': c.title || '', 'شواهد': c.evidence || '',
      'وضعیت پیاده‌سازی': a.status ? normalizeStatus(a.status) : (c.status || ''),
      'واحد مسئول رسیدگی': a.owner_unit || c.owner_unit || '',
      'اقدامات انجام شده': a.actions || '',
      'تاریخ رفع عدم انطباق': a.resolve_date || '',
      'درصد پیشرفت تاکنون': (a.progress !== null && a.progress !== undefined && a.progress !== '') ? Number(a.progress) : '',
      'توضیحات': a.notes || ''
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:6},{wch:18},{wch:12},{wch:50},{wch:50},{wch:18},{wch:25},{wch:40},{wch:18},{wch:18},{wch:30}];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'کنترل‌ها');
  const safeName = period.name.replace(/[\\/:*?"<>|]/g, '-');
  XLSX.writeFile(wb, `کاشف-${safeName}-${todayJalali().replace(/\//g,'-')}.xlsx`);
  toast('اکسل دانلود شد');
}

        catch(err){ toast('خطا: '+err.message); }

  }
  if(S.view==='import' && admin){
    $('#addCtrlFromImport')?.addEventListener('click', () => openAddControlModal());
    $('#wipeCurrentPeriod')?.addEventListener('click', async () => {
      const targetPid = $('#importPeriod')?.value || S.periodId;
      if(!targetPid) return toast('دوره‌ای انتخاب نشده');
      const p = S.periods.find(x => x.id === targetPid);
      if(!confirm(`همه ارزیابی‌های دوره «${p?.name || ''}» حذف شوند؟ (کنترل‌ها و سایر دوره‌ها حفظ می‌شوند)`)) return;
      try{
        await apiWipePeriodAssessments(targetPid);
        await loadAllAssessments();
        await loadAssessments();
        toast('ارزیابی‌های دوره حذف شد');
        render();
      }catch(err){ toast('خطا: '+err.message); }
    });
    $('#wipeAllData')?.addEventListener('click', async () => {
      if(!confirm('⚠️ این عملیات تمام داده‌های وارد‌شده (کنترل‌ها، ارزیابی‌ها و دوره‌ها) را حذف می‌کند. کاربران و تنظیمات حفظ می‌شوند. آیا مطمئن هستید؟')) return;
      if(!confirm('تأیید نهایی: همه داده‌های وارد‌شده پاک شوند؟')) return;
      try{
        if(MODE === 'local'){
          const t = LocalDB.tables();
          t.controls = [];
          t.assessments = [];
          t.periods = [];
          LocalDB.save(t);
        } else {
          await apiWipeAllControls();
          const { error } = await sb.from('periods').delete().not('id','is',null);
          if(error) throw error;
        }
        S.controls = [];
        S.allControls = [];
        S.assessments = {};
        S.allAssessments = [];
        S.periods = [];

        S.units = []; S.allUnits = []; S.cats = []; S.levels = [];

      if(!pid) return toast('دوره را انتخاب کنید');

      exportPeriodToExcel(pid);
    });
    $('#doImport')?.addEventListener('click', async () => {
      const file = $('#xlsFile').files[0]; const log = $('#importLog');
      if(!file) return toast('فایل را انتخاب کنید');
      const pg = $('#importProgress'); pg.classList.add('show');
      const ipTitle = $('#ipTitle'), ipPct = $('#ipPct'), ipBar = $('#ipBar');
      const ipTotal = $('#ipTotal'), ipOk = $('#ipOk'), ipErr = $('#ipErr'), ipEmpty = $('#ipEmpty'), ipLog = $('#ipLog');
      ipTitle.textContent = 'در حال آماده‌سازی…';
      ipPct.textContent = '0%'; ipBar.style.width = '0%';
      ipTotal.textContent = '0'; ipOk.textContent = '0'; ipErr.textContent = '0'; ipEmpty.textContent = '0';
      ipLog.textContent = ''; log.textContent = '';
      const logLine = (msg) => {
        const t = new Date();
        const ts = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`;
        ipLog.textContent = `[${ts}] ${msg}\n` + ipLog.textContent;
      };
      const setProgress = (done, total, title) => {
        const pct = total > 0 ? Math.round(done / total * 100) : 0;
        ipBar.style.width = pct + '%'; ipPct.textContent = pct + '%';
        if(title) ipTitle.textContent = title;
      };
      try{
        logLine('شروع خواندن فایل…');
        ipTitle.textContent = 'در حال خواندن فایل اکسل…';
        const rowsArr = await parseSheet(file);
        logLine(`تعداد ${rowsArr.length} ردیف داده خوانده شد.`);
        if(!rowsArr.length) throw new Error('فایل هیچ داده‌ای ندارد.');
        const parsed = [];
        for(let i = 0; i < rowsArr.length; i++){
          const r = excelRowArrToRecord(rowsArr[i]);
          if(r) parsed.push(r);
        }
        logLine(`پس از پردازش: ${parsed.length} کنترل معتبر.`);
        if(!parsed.length) throw new Error('هیچ ردیف معتبری با عنوان کنترل پیدا نشد.');
        const isFirstUpload = S.periods.length === 0;
        if(isFirstUpload){
          ipTitle.textContent = 'ایجاد دوره پایه…';
          const periodName = ($('#firstPeriodName')?.value || '').trim() || 'پایه';
          const period = await apiAddPeriod({ name: periodName });
          S.periodId = period.id;
          logLine(`دوره «${periodName}» ایجاد شد.`);
          ipTitle.textContent = `درج ${parsed.length} کنترل…`;
          setProgress(0, parsed.length, ipTitle.textContent);
          const CH = 200;
          const rowsToAdd = parsed.map((r, idx) => ({ row_no: idx + 1, category: r.category, level: r.level, title: r.title, evidence: r.evidence, status: r.status || 'عدم پیاده‌سازی', owner_unit: r.owner_unit }));
          if(MODE === 'local'){
            await LocalDB.addControlsBulk(rowsToAdd);
            setProgress(parsed.length, parsed.length);
          } else {
            for(let i = 0; i < rowsToAdd.length; i += CH){
              const part = rowsToAdd.slice(i, i+CH);
              const { error } = await sb.from('controls').insert(part);
              if(error) throw error;
              setProgress(Math.min(i+CH, rowsToAdd.length), rowsToAdd.length, `درج کنترل‌ها: ${Math.min(i+CH, rowsToAdd.length)} از ${rowsToAdd.length}`);
            }
          }
          await loadPeriods(); await loadControls();
          S.periodId = period.id; renderPeriodSelect();
          ipTitle.textContent = 'ثبت ارزیابی دوره پایه…';
          ipTotal.textContent = parsed.length;
          setProgress(0, parsed.length, ipTitle.textContent);
          const titleMap = new Map();
          S.allControls.forEach(ctrl => titleMap.set((ctrl.title||'').trim(), ctrl));
          const bulkItems = [];
          for(let i = 0; i < parsed.length; i++){
            const r = parsed[i];
            const ctrl = titleMap.get((r.title||'').trim());
            if(!ctrl){ setProgress(i+1, parsed.length); continue; }
            const baseStatus = r.status || 'عدم پیاده‌سازی';
            // اگر درصد خالی بود، از وضعیت محاسبه کن (۱۰۰/۰/۱۰)
            const computedProgress = r.progress !== null ? r.progress : progressFromStatusValue(baseStatus);
            bulkItems.push({
              control_id: ctrl.id,
              status: baseStatus, progress: computedProgress,
              actions: r.actions, deadline: r.deadline, resolve_date: r.resolve_date, notes: r.notes,
              owner_unit: r.owner_unit || ctrl.owner_unit,
              updated_by: S.user?.username || '',
              updated_at: new Date().toISOString()
            });
            if(i % 20 === 0) setProgress(i+1, parsed.length, `آماده‌سازی: ${i+1} از ${parsed.length}`);
          }
          ipOk.textContent = '0';
          const CH2 = 100;
          for(let i = 0; i < bulkItems.length; i += CH2){
            const part = bulkItems.slice(i, i+CH2);
            try{
              await apiSaveAssessmentsBulk(period.id, part);
              ipOk.textContent = String(Number(ipOk.textContent) + part.length);
            }catch(e){ ipErr.textContent = String(Number(ipErr.textContent) + part.length); logLine('خطا در بلوک: '+e.message); }
            setProgress(Math.min(i+CH2, bulkItems.length), bulkItems.length, `ثبت ارزیابی: ${Math.min(i+CH2, bulkItems.length)} از ${bulkItems.length}`);
            await new Promise(r2 => setTimeout(r2, 0));
          }
          await loadAllAssessments(); await loadAssessments();
          const savedCount = Number(ipOk.textContent);
          ipTitle.textContent = `✔ دوره پایه با ${savedCount} ارزیابی ایجاد شد`;
          ipPct.textContent = '100%'; ipBar.style.width = '100%';
          log.innerHTML = `<span style="color:var(--txt);font-weight:600">✔ دوره پایه با ${fa(savedCount)} ارزیابی ایجاد شد.</span>`;
          toast('دوره پایه ایجاد شد');
        } else {
          const targetPid = $('#importPeriod').value;
          if(!targetPid) throw new Error('دوره هدف را انتخاب کنید');
          const targetPeriod = S.periods.find(p => p.id === targetPid);
          if(!targetPeriod) throw new Error('دوره یافت نشد');
          ipTitle.textContent = `بارگذاری برای دوره «${targetPeriod.name}»…`;
          const excelMap = new Map();
          parsed.forEach(r => { const key = (r.title||'').trim(); if(key) excelMap.set(key, r); });
          logLine(`${excelMap.size} عنوان یکتا در اکسل.`);
          let createdCount = 0;
          const existingTitles = new Set(S.allControls.map(c => (c.title||'').trim()));
          const newControlsToAdd = [];
          for(const [title, r] of excelMap){
            if(!existingTitles.has(title)){
              newControlsToAdd.push({ category: r.category, level: r.level, title: r.title, evidence: r.evidence, status: r.status || 'عدم پیاده‌سازی', owner_unit: r.owner_unit });
              existingTitles.add(title);
            }
          }
          if(newControlsToAdd.length){
            ipTitle.textContent = `افزودن ${newControlsToAdd.length} کنترل جدید…`;
            const CH = 200;
            for(let i = 0; i < newControlsToAdd.length; i += CH){
              const part = newControlsToAdd.slice(i, i+CH).map((r,idx) => ({ ...r, row_no: S.allControls.length + i + idx + 1 }));
              if(MODE === 'local'){ await LocalDB.addControlsBulk(part); }
              else { const { error } = await sb.from('controls').insert(part); if(error) throw error; }
              setProgress(Math.min(i+CH, newControlsToAdd.length), newControlsToAdd.length);
            }
            createdCount = newControlsToAdd.length;
            await loadControls();
            logLine(`${createdCount} کنترل جدید اضافه شد.`);
          }
          const allControls = S.allControls; const total = allControls.length;
          ipTotal.textContent = total;
          setProgress(0, total, `آماده‌سازی ${total} ارزیابی…`);
          let emptyFromExcel = 0;
          const titleMap = new Map();
          allControls.forEach(ctrl => titleMap.set((ctrl.title||'').trim(), ctrl));
          const bulkItems = [];
          for(let i = 0; i < allControls.length; i++){
            const ctrl = allControls[i];
            const key = (ctrl.title || '').trim();
            const r = excelMap.get(key);
            if(!r) emptyFromExcel++;
            const baseStatus = r ? r.status : null;
            // محاسبه درصد: اگر صریح بود همان، وگرنه از وضعیت (۱۰۰/۰/۱۰)
            const computedProgress = r ? (r.progress !== null ? r.progress : (baseStatus ? progressFromStatusValue(baseStatus) : null)) : null;
            bulkItems.push({
              control_id: ctrl.id,
              status: baseStatus, progress: computedProgress,
              actions: r ? (r.actions || '') : '',
              deadline: r ? (r.deadline || '') : '',
              resolve_date: r ? (r.resolve_date || '') : '',
              notes: r ? (r.notes || '') : '',
              owner_unit: r ? (r.owner_unit || ctrl.owner_unit) : ctrl.owner_unit,
              updated_by: S.user?.username || '',
              updated_at: new Date().toISOString()
            });
            if(i % 30 === 0) setProgress(i+1, total, `آماده‌سازی: ${i+1} از ${total}`);
          }
          ipEmpty.textContent = String(emptyFromExcel);
          ipOk.textContent = '0'; ipErr.textContent = '0';
          const CH2 = 100;
          for(let i = 0; i < bulkItems.length; i += CH2){
            const part = bulkItems.slice(i, i+CH2);
            try{
              await apiSaveAssessmentsBulk(targetPid, part);
              ipOk.textContent = String(Number(ipOk.textContent) + part.length);
            }catch(e){ ipErr.textContent = String(Number(ipErr.textContent) + part.length); logLine('خطا در بلوک: '+e.message); }
            setProgress(Math.min(i+CH2, bulkItems.length), bulkItems.length, `ثبت ارزیابی: ${Math.min(i+CH2, bulkItems.length)} از ${bulkItems.length}`);
            await new Promise(r2 => setTimeout(r2, 0));
          }
          ipTitle.textContent = `✔ بارگذاری کامل شد — ${ipOk.textContent} از ${total} ثبت`;
          ipPct.textContent = '100%'; ipBar.style.width = '100%';
          S.periodId = targetPid; renderPeriodSelect();
          await loadAllAssessments(); await loadAssessments();
          const parts = [`${fa(ipOk.textContent)} از ${fa(total)} کنترل ثبت شد`];
          if(createdCount > 0) parts.push(`${fa(createdCount)} کنترل جدید`);
          if(emptyFromExcel > 0) parts.push(`${fa(emptyFromExcel)} بدون داده`);
          log.innerHTML = `<span style="color:var(--txt);font-weight:600">✔ ${parts.join(' — ')} در دوره «${esc(targetPeriod.name)}».</span>`;
          toast('بارگذاری کامل شد');
        }
        render();
      }catch(err){
        ipTitle.textContent = 'خطا در بارگذاری';
        logLine(`❌ ${err.message || err}`);
        log.innerHTML = `<span style="color:var(--delta-neg);font-weight:600">خطا: ${esc(err.message||err)}</span>`;
        toast('خطا در بارگذاری');
      }
    });
  }
}

function openAddControlModal(){
  if(!isAdmin()) return;
  $('#modalHost').innerHTML = `<div class="modal" id="modalBg"><div class="modal-box">
    <button class="close-x" id="closeModal">×</button>
    <h3>افزودن کنترل جدید</h3>
    <div class="field"><label>دسته</label><input id="mCat"></div>
    <div class="field"><label>سطح پیشرفتگی</label><select id="mLevel"><option value="پایه">پایه</option><option value="مقدماتی">مقدماتی</option><option value="پیشرفته">پیشرفته</option></select></div>
    <div class="field"><label>متن کنترل</label><textarea id="mTitle"></textarea></div>
    <div class="field"><label>شواهد</label><textarea id="mEvidence"></textarea></div>
    <div class="field"><label>وضعیت پیاده‌سازی</label><select id="mStatus">${STATUS_OPTS.map(v=>`<option value="${v}">${v}</option>`).join('')}</select></div>
    <div class="field"><label>واحد مسئول رسیدگی</label><input id="mUnit"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn btn-primary" id="mSave">افزودن</button><button class="btn" id="mCancel">انصراف</button></div>
  </div></div>`;
  const close = () => $('#modalHost').innerHTML='';
  $('#closeModal').addEventListener('click', close);
  $('#mCancel').addEventListener('click', close);
  $('#modalBg').addEventListener('click', e => { if(e.target.id==='modalBg') close(); });
  $('#mSave').addEventListener('click', async () => {
    const title = $('#mTitle').value.trim();
    if(!title) return toast('متن کنترل الزامی است');
    try{
      const row = { row_no: S.allControls.reduce((m,c)=>Math.max(m, Number(c.row_no)||0), 0) + 1, category: $('#mCat').value.trim() || null, level: $('#mLevel').value || null, title, evidence: $('#mEvidence').value.trim() || '', status: normalizeStatus($('#mStatus').value), owner_unit: $('#mUnit').value.trim() || null };
      if(MODE==='local'){ await LocalDB.addControlsBulk([row]); }
      else { const { error } = await sb.from('controls').insert(row); if(error) throw error; }
      await loadControls(); toast('کنترل اضافه شد'); close(); render();
    }catch(err){ toast('خطا: '+err.message); }
  });
}

function openControlModal(id){
  const c = S.controls.find(x=>x.id===id); if(!c) return;
  const allMaps = getAllMaps();
  const currIdx = periodIndex();
  const periodsToShow = S.periods.slice(0, currIdx >= 0 ? currIdx + 1 : S.periods.length);
  const historyRows = periodsToShow.map(p => {
    const a = (allMaps[p.id] && allMaps[p.id][c.id]) || {};
    const isCurrent = p.id === S.periodId;
    const isBase = isFirstPeriodById(p.id);
    const ownerUnit = a.owner_unit || c.owner_unit || '—';
    const r = calculateControlProgressDetail(c, p.id, allMaps[p.id]);
    const pr = r.value;
    let statusLabel = '—'; let statusCls = 'badge-soft';
    if(r.reason === 'excluded'){ statusLabel = 'غیر قابل احراز'; statusCls = 'st-gray'; }
    else if(a.status){ statusLabel = normalizeStatus(a.status); statusCls = statusClass(a.status); }
    else if(isBase && c.status){ statusLabel = normalizeStatus(c.status); statusCls = statusClass(c.status); }
    else if(pr !== null){ const st = statusFromProgress(pr); statusLabel = st; statusCls = statusClass(st); }
    else { statusLabel = 'ثبت نشده'; statusCls = 'st-gray'; }
    return `<tr ${isCurrent ? 'style="background:var(--faint);font-weight:600"' : ''}>
      <td style="white-space:nowrap">${esc(p.name)}${isBase ? '<span class="badge badge-first" style="margin-right:4px">پایه</span>' : ''}${isCurrent ? '<span class="badge st-ok" style="margin-right:4px">جاری</span>' : ''}</td>
      <td><span class="badge ${statusCls}">${esc(statusLabel)}</span></td>
      <td style="font-size:11px">${esc(ownerUnit)}</td>
      <td style="font-size:11px;line-height:1.7;max-width:180px">${esc(a.actions || '—')}</td>
      <td style="white-space:nowrap">${a.deadline ? displayDate(a.deadline) : '<span style="color:var(--dim)">—</span>'}</td>
      <td style="font-weight:600">${pr !== null ? fa(pr)+'٪' : '<span style="color:var(--dim)">—</span>'}</td>
      <td style="font-size:11px;line-height:1.7;max-width:160px">${esc(a.notes || '—')}</td>
    </tr>`;
  }).join('');
  const trendVals = periodsToShow.map(p => calculateControlProgressDetail(c, p.id, allMaps[p.id]).value);
  const hasTrend = trendVals.filter(v => v !== null).length >= 1;
  $('#modalHost').innerHTML = `<div class="modal" id="modalBg"><div class="modal-box">
    <button class="close-x" id="closeModal">×</button>
    <h3>#${fa(c.row_no??'')} — ${esc(c.title)}</h3>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">
      <span class="badge badge-soft">${esc(c.category||'—')}</span>
      <span class="badge badge-soft">سطح: ${esc(c.level||'—')}</span>
      <span class="badge badge-soft">${esc(c.owner_unit||'—')}</span>
    </div>
    <div class="kv"><div class="k">متن کنترل</div><div class="v">${esc(c.title)}</div></div>
    <div class="kv"><div class="k">شواهد ارزیابی</div><div class="v">${esc(c.evidence||'—')}</div></div>
    <div class="kv">
      <div class="k">تاریخچه در دوره‌ها</div>
      <div class="tbl-wrap">
        <table class="hist-tbl">
          <thead><tr><th>دوره</th><th>وضعیت</th><th>واحد مسئول</th><th>اقدامات انجام شده</th><th>آخرین مهلت</th><th>درصد پیشرفت</th><th>توضیحات</th></tr></thead>
          <tbody>${historyRows}</tbody>
        </table>
      </div>
    </div>
    ${hasTrend ? `<div class="kv"><div class="k">روند پیشرفت</div><div style="padding:12px;background:var(--faint);border:1px solid var(--line)">${lineChart(periodsToShow.map((p, i) => ({ id: p.id, name: p.name, value: trendVals[i] })))}</div></div>` : ''}
  </div></div>`;
  const close = () => $('#modalHost').innerHTML='';
  $('#closeModal').addEventListener('click', close);
  $('#modalBg').addEventListener('click', e => { if(e.target.id==='modalBg') close(); });
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#loginBtn'), err = $('#loginErr');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'در حال بررسی…';
  try{ const u = await doLogin($('#luser').value.trim(), $('#lpass').value); startSession(u); }
  catch(ex){ err.textContent = ex.message || 'ورود ناموفق'; }
  finally{ btn.disabled = false; btn.textContent = 'ورود'; }
});

$('#nav').addEventListener('click', e => {

  S.view = b.dataset.view;
  $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show');

$('#menuBtn').addEventListener('click', () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); });
$('#overlay').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); });

document.getElementById('themeBtn').addEventListener('click', function(e) { openThemeSwitcher(this, e); });

document.addEventListener('keydown', e => {
  if(e.key==='Escape'){
    $('#sidebar').classList.remove('open');
    $('#overlay').classList.remove('show');
    $('#modalHost').innerHTML='';
    $('#datePickerHost').innerHTML='';
    const ts = document.getElementById('themeSwitcher'); if(ts) ts.remove();

});
updateConnBox();
updateThemeBtn();
